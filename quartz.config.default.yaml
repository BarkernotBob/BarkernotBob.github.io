# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Isaiah Barker
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: barkernotbob.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: "Fraunces"
      body: "Hanken Grotesk"
      code: "IBM Plex Mono"
    colors:
      lightMode:
        light: "#f3ede1"          # Reading Room — warm paper background
        lightgray: "#e4dac6"      # soft hairline dividers
        gray: "#7d745f"           # muted ink
        darkgray: "#231f1a"       # body text — espresso ink
        dark: "#231f1a"           # headings — espresso ink
        secondary: "#1f5d52"      # library teal — links & accents
        tertiary: "#b5512f"       # warm clay — hover/secondary accent
        highlight: "rgba(31, 93, 82, 0.10)"   # soft teal wash
        textHighlight: "#d9a94955"            # warm ochre highlight
      darkMode:
        light: "#1a1613"          # deep espresso background
        lightgray: "#37302a"      # dark hairline
        gray: "#a99d86"           # muted warm gray
        darkgray: "#efe7d6"       # warm light text
        dark: "#f3ead9"           # headings — warm near-white
        secondary: "#62b5a3"      # lighter teal for dark mode
        tertiary: "#e08a63"       # lighter clay
        highlight: "rgba(98, 181, 163, 0.12)"
        textHighlight: "#d9a94944"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: true
    options:
      publishByDefault: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
    options:
      # Hide the "N items under this folder." line on index pages.
      showFolderCount: false
  - source: github:quartz-community/tag-page
    enabled: true
  - source: ./quartz/plugins/custom/tag-filter
    enabled: true
  - source: ./quartz/plugins/custom/pwa
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      useSavedState: false
      folderDefaultState: collapsed
      # Sidebar ordering, in priority order:
      #   1. Top-level sections follow the explicit list below.
      #   2. Anything with a numeric `order:` frontmatter field sorts by it (ascending).
      #   3. Everything else falls back to folders-first, then A–Z.
      sortFn: |
        (a, b) => {
          const order = ["Notes", "Tools", "Games", "Curated YouTube", "Tags"]
          const ia = order.indexOf(a.displayName)
          const ib = order.indexOf(b.displayName)
          if (ia !== -1 || ib !== -1) {
            if (ia === -1) return 1
            if (ib === -1) return -1
            return ia - ib
          }
          if ((!a.isFolder && !b.isFolder) || (a.isFolder && b.isFolder)) {
            const ao = a.data?.order
            const bo = b.data?.order
            if (typeof ao === "number" && typeof bo === "number") return ao - bo
            if (typeof ao === "number") return -1
            if (typeof bo === "number") return 1
            return (a.displayName || "").localeCompare(b.displayName || "", undefined, { numeric: true, sensitivity: "base" })
          }
          return !a.isFolder && b.isFolder ? 1 : -1
        }
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    options:
      # Compact, mockup-style results list. Disabling the side preview pane keeps
      # the modal small so the underlying note (which scrolls to the searched
      # term) stays visible.
      enablePreview: false
    layout:
      position: header
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: header
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder: {}
    tag: {}
    canvas: {}
    bases: {}
