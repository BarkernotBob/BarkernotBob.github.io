<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bank Bonus Tracker</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/static/bank-bonus/manifest.json">

  <!-- iOS / iPhone PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bank Bonus">
  <link rel="apple-touch-icon" href="/static/bank-bonus/apple-touch-icon.png">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#5b5bd6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#7c7cf2" media="(prefers-color-scheme: dark)">
  <style>
    /* =====================================================================
       Design system. Grounded in Stripe (type + number hierarchy), Linear
       (crisp 1px borders over heavy shadows, first-class dark mode) and Apple
       HIG (44px min touch targets, system type, 8/12/16 spacing). One token
       set; [data-theme="dark"] on <html> flips it.
       ===================================================================== */
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f1f3f5; --surface-3: #e8ebef;
      --text: #15171c; --muted: #5e636e; --faint: #8a909b;
      --border: #e6e8ee; --border-strong: #d5d9e1;
      --accent: #5b5bd6; --accent-hover: #4a4ac6; --accent-press: #3f3fb0; --on-accent: #ffffff;
      --accent-soft: rgba(91,91,214,.12);
      --open: #197a3e; --open-bg: #e6f5ec; --closed: #5e636e; --closed-bg: #eef0f3;
      --planned: #3a5bd0; --planned-bg: #e7ecfd; --danger: #d23b3b; --danger-hover: #b62f2f;
      --warn: #92670a; --warn-soft: rgba(146,103,10,.12);
      --shadow-sm: 0 1px 2px rgba(20,23,28,.06), 0 1px 1px rgba(20,23,28,.04);
      --shadow-md: 0 8px 24px rgba(20,23,28,.10);
      --radius: 14px; --radius-sm: 9px; --pill: 999px;
      --bar-h: 56px; --tab-h: 50px; --safe-top: env(safe-area-inset-top, 0px);
    }
    html[data-theme="dark"] {
      --bg: #0b0c0f; --surface: #15171c; --surface-2: #1c1f26; --surface-3: #262a33;
      --text: #e8eaed; --muted: #9aa0ab; --faint: #6c717b;
      --border: #262a32; --border-strong: #353a44;
      --accent: #7c7cf2; --accent-hover: #9090f6; --accent-press: #6a6ae6; --on-accent: #0b0c0f;
      --accent-soft: rgba(124,124,242,.18);
      --open: #45c267; --open-bg: #112619; --closed: #9aa0ab; --closed-bg: #21262d;
      --planned: #8098ff; --planned-bg: #161d3a; --danger: #f06a6a; --danger-hover: #ff8181;
      --warn: #d6a017; --warn-soft: rgba(214,160,23,.16);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 10px 28px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    /* Stop accidental mobile zoom: no double-tap zoom, no text inflation. (iOS also
       won't focus-zoom because inputs are >=16px below.) */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0; padding: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
      letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation; overflow-x: hidden; }
    #main { max-width: 940px; margin: 0 auto; padding: 24px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
    :focus-visible { outline: none; }

    /* ---- App header bar ---- */
    #appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface);
      background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border); padding: var(--safe-top) 16px 0; height: calc(var(--bar-h) + var(--safe-top));
      position: sticky; top: 0; z-index: 101; }
    .appbar-title { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .appbar-right { display: flex; align-items: center; gap: 8px; }
    #appbar-user { font-size: 13px; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { background: none; color: var(--text); border: 1px solid var(--border); border-radius: 10px;
      min-width: 40px; height: 40px; padding: 0 10px; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .icon-btn:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }

    /* ---- Tab bar (horizontally scrollable on small screens) ---- */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: calc(var(--bar-h) + var(--safe-top)); z-index: 100;
      display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 0 0 auto; background: none; border: none; padding: 0 16px; cursor: pointer; font-size: 14px; font-weight: 500;
      border-bottom: 2px solid transparent; color: var(--muted); height: var(--tab-h); white-space: nowrap; transition: color .12s; }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    nav button:hover { color: var(--text); }
    .ic { margin-right: 5px; }
    .badge { background: var(--danger); color: #fff; border-radius: var(--pill); display: inline-block; min-width: 19px; height: 19px; padding: 0 5px; text-align: center; line-height: 19px; font-size: 11px; font-weight: 600; margin-left: 5px; }
    .badge.hidden { display: none; }

    .section { display: none; animation: fadeIn 0.18s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card { background: var(--surface); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .card.clickable { cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; }
    .card.clickable:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-1px); }
    /* Left accent stripe encodes account status at a glance */
    .card.st-open { border-left: 3px solid var(--open); }
    .card.st-closed { border-left: 3px solid var(--closed); }
    .card.st-planned { border-left: 3px solid var(--planned); }
    .card-header { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .row-item { flex: 1; min-width: 130px; }
    .row-item input, .row-item select, .row-item textarea { width: 100%; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin-bottom: 5px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 600; }
    .value.money { font-variant-numeric: tabular-nums; }

    button { background: var(--accent); color: var(--on-accent); border: none; padding: 0 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 600; min-height: 42px; box-shadow: var(--shadow-sm); transition: background .12s, transform .06s; }
    button:hover { background: var(--accent-hover); }
    button:active { background: var(--accent-press); transform: translateY(1px); }
    button:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
    button.sec { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    button.sec:hover { background: var(--surface-3); border-color: var(--border-strong); }
    button.danger { background: var(--danger); color: #fff; }
    button.danger:hover { background: var(--danger-hover); }
    button.small { min-height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }

    /* 16px keeps iOS Safari from auto-zooming when a field is focused. */
    input, select, textarea { border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 16px; font-family: inherit; background: var(--surface); color: var(--text); min-height: 42px; max-width: 100%; min-width: 0; transition: border-color .12s, box-shadow .12s; }
    /* Money fields: a fixed "$" sits inside the box; the input pads left to clear it. */
    .money-field { position: relative; display: flex; align-items: center; }
    .money-field > .money-prefix { position: absolute; left: 12px; color: var(--muted); font-size: 16px; pointer-events: none; }
    .money-field > input { width: 100%; padding-left: 26px; }
    textarea { min-height: 0; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    ::placeholder { color: var(--faint); }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px); background: #1c1f26; color: #fff; padding: 12px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 1000; box-shadow: var(--shadow-md); font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-ov { position: fixed; inset: 0; background: rgba(10,12,16,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; animation: fadeIn .15s ease; }
    .modal-card { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 520px; width: 100%; box-shadow: var(--shadow-md); max-height: 90vh; overflow: auto; }
    .modal-card p { margin: 0 0 16px; }
    .modal-card input, .modal-card select { width: 100%; margin-bottom: 12px; }

    /* ---- Status pills & person tokens ---- */
    .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: var(--pill); letter-spacing: .01em; text-transform: capitalize; }
    .pill-open { color: var(--open); background: var(--open-bg); }
    .pill-closed { color: var(--closed); background: var(--closed-bg); }
    .pill-planned { color: var(--planned); background: var(--planned-bg); }
    .pill-full { color: var(--open); background: var(--open-bg); }
    .pill-partial { color: var(--warn); background: var(--warn-soft); }
    .pill-over { color: var(--danger); background: rgba(210,59,59,.12); }
    .person-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
    .person-dot { width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }

    /* ---- Filter bar + segmented control ---- */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .chips { display: inline-flex; flex-wrap: nowrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; background: none; border: none; color: var(--muted); border-radius: 7px; padding: 0 13px; min-height: 34px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
    .chip:hover { color: var(--text); }
    .chip.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }
    .search-input { flex: 1; min-width: 180px; }

    /* People editor */
    .people-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .person-tag { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--pill); padding: 4px 4px 4px 10px; }
    .person-x { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; min-height: 0; padding: 2px 8px; box-shadow: none; border-radius: var(--pill); }
    .person-x:hover { color: var(--danger); background: none; }

    /* Date fields: never let the native control exceed its column. */
    input[type="date"] { width: 100%; max-width: 100%; box-sizing: border-box; min-width: 0; }
    /* On touch devices (iOS/Android), the native date control has an intrinsic
       min-width that can spill past its column. Neutralizing the native appearance
       lets width:100% win; the date picker still opens on tap. */
    @media (pointer: coarse) {
      input[type="date"] { -webkit-appearance: none; appearance: none; }
    }
    /* Progress bar (calendar paycheck usage) */
    .prog { height: 12px; border-radius: 7px; background: var(--surface-3); overflow: hidden; }
    .prog > i { display: block; height: 100%; border-radius: 7px; }
    .cal-bar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
    .cal-bar > i { display: block; height: 100%; }

    .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
    .empty .empty-cta { margin-top: 18px; }
    .action-bar { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---- Tables ---- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th { background: var(--surface-2); }
    th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.num { font-weight: 600; }
    tbody tr:nth-child(even) { background: var(--surface-2); }
    tbody tr:hover { background: var(--accent-soft); }

    /* ---- Summary stat strip ---- */
    .summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
    .stat .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin-bottom: 7px; font-weight: 600; }
    .stat .stat-value { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat .stat-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ---- Calendar month grid ---- */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cal-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    /* Fixed grid so arrows never move when you change months. */
    .cal-nav { display: grid; grid-template-columns: 44px 1fr 44px auto; align-items: center; gap: 8px; margin-bottom: 16px; }
    .cal-arrow { padding: 0; font-size: 20px; line-height: 1; }
    .cal-month { text-align: center; min-width: 0; }
    .cal-month-name { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-month-sub { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-today-btn { font-size: 13px; }
    .cal-hint { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day-cell { cursor: pointer; }
    .cal-day-cell:hover { border-color: var(--border-strong); }
    .cal-dot { display: none; }
    .cal-dow { font-size: 11px; color: var(--faint); text-align: center; padding: 4px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .cal-cell { min-height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 5px; font-size: 12px; background: var(--surface); }
    .cal-empty { border: none; background: transparent; }
    .cal-day { color: var(--muted); font-weight: 600; }
    .cal-cell.cal-today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .cal-cell.cal-past { opacity: .5; }
    .cal-amt { margin-top: 3px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 11px; }
    .cal-full { background: var(--open-bg); } .cal-full .cal-amt { color: var(--open); }
    .cal-partial { background: var(--warn-soft); } .cal-partial .cal-amt { color: var(--warn); }
    .cal-over { background: rgba(210,59,59,.12); } .cal-over .cal-amt { color: var(--danger); }

    .checkbox { margin: 0; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
    .reminder-list { margin-top: 12px; }
    .reminder-item { background: var(--surface-2); padding: 11px 12px; border-radius: var(--radius-sm); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
    .reminder-date { color: var(--muted); font-size: 12px; }
    kbd { background: var(--surface-2); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .sc-table td { padding: 7px 8px; border: none; }

    @media (max-width: 600px) {
      body { font-size: 15px; }
      #main { padding: 18px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
      .card { padding: 16px; }
      button { min-height: 46px; }
      input, select { min-height: 46px; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      #appbar-user { display: none; }
      /* Stack form fields to full width — no input can spill into the next column. */
      .row { flex-direction: column; gap: 14px; }
      .row-item { min-width: 0; width: 100%; }
      /* Full-width, comfortably spaced action buttons — never squished or overlapping. */
      .action-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .action-bar > button { width: 100%; }
      .filter-bar .search-input { min-width: 120px; }
      .chip { min-height: 44px; }   /* easy-tap filter segments */
      /* Calendar: tighter cells; show a status dot instead of the (too-wide) amount. */
      .cal-nav { grid-template-columns: 44px 1fr 44px auto; gap: 6px; }
      .cal-grid { gap: 3px; }
      .cal-cell { min-height: 46px; padding: 3px; border-radius: 6px; }
      .cal-amt, .cal-bar { display: none; }
      .cal-dot { display: block; width: 7px; height: 7px; border-radius: 50%; margin-top: 3px; }
      .cal-pay.cal-full .cal-dot { background: var(--open); }
      .cal-pay.cal-partial .cal-dot { background: var(--warn); }
      .cal-pay.cal-over .cal-dot { background: var(--danger); }
    }
  </style>
</head>
<body>

<header id="appbar">
  <div class="appbar-title">🏦 Bank Bonus Tracker</div>
  <div class="appbar-right">
    <span id="appbar-user"></span>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light / dark">🌙</button>
    <button class="icon-btn" onclick="showShortcuts()" title="Keyboard shortcuts (press ?)">⌨</button>
  </div>
</header>

<nav id="nav">
  <button data-tab="today" class="nav-btn active" onclick="show('today')" title="Today (1)"><span class="ic">🗓</span>Today</button>
  <button data-tab="active" class="nav-btn" onclick="show('active')" title="Active (2)"><span class="ic">📂</span>Active</button>
  <button data-tab="planned" class="nav-btn" onclick="show('planned')" title="Planned (3)"><span class="ic">🗒</span>Planned</button>
  <button data-tab="offers" class="nav-btn" onclick="show('offers')" title="Offers (4)"><span class="ic">🧰</span>Offers</button>
  <button data-tab="calendar" class="nav-btn" onclick="show('calendar')" title="Calendar (5)"><span class="ic">📅</span>Calendar</button>
  <button data-tab="reports" class="nav-btn" onclick="show('reports')" title="Reports (6)"><span class="ic">📊</span>Reports</button>
  <button data-tab="settings" class="nav-btn" onclick="show('settings')" title="Settings (7)"><span class="ic">⚙︎</span>Settings</button>
</nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Bank Bonus Tracker — single-file app.
   Stores everything in a PRIVATE GitHub repo (the "data repo") via the GitHub API.
   No data lives in this file; settings live in localStorage.
   ========================================================================= */

/* ---- App-wide sign-in config. Shared with the Pool app: one GitHub OAuth App
        + one Cloudflare Worker cover all of barkernotbob.github.io/static/*.
        These two values are PUBLIC (not secrets). The token-paste fallback works
        even before OAuth is set. ---- */
const OAUTH = {
  clientId:  'Ov23lirmVUCJFsZgphQC',                       // GitHub OAuth App "Client ID"
  workerUrl: 'https://pool-auth.isaiahmail97.workers.dev'  // Cloudflare Worker base URL
};

// Bump this on each deploy so the Settings footer shows which build is live —
// lets you confirm a phone isn't serving a cached old copy.
const BUILD = '2026-06-29 · r9 · PWA';

const LS = {
  get repo(){ return localStorage.getItem('bb_repo') || '' },
  set repo(v){ localStorage.setItem('bb_repo', v) },
  get token(){ return localStorage.getItem('bb_token') || '' },
  set token(v){ localStorage.setItem('bb_token', v) },
  get me(){ return localStorage.getItem('bb_me') || '' },
  set me(v){ localStorage.setItem('bb_me', v) },
  get login(){ return localStorage.getItem('bb_login') || '' },      // GitHub username (from OAuth)
  set login(v){ localStorage.setItem('bb_login', v) },
  get method(){ return localStorage.getItem('bb_method') || '' },    // 'oauth' | 'token'
  set method(v){ localStorage.setItem('bb_method', v) },
};

const API = 'https://api.github.com';
const DB = {};

// --------- UI helpers ---------
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const el = (tag, attrs={}, html='') => {
  const e = document.createElement(tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html !== '') e.innerHTML = html;
  return e;
};
const money = n => (n == null || isNaN(n)) ? '—' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// Money INPUT helpers: format with thousands separators (no forced decimals) for
// display in a text field, and parse back to a number tolerating "$" and commas.
function parseMoney(str){
  if(str == null) return null;
  const c = String(str).replace(/[^0-9.\-]/g, '');
  if(c === '' || c === '-' || c === '.') return null;
  const n = parseFloat(c);
  return isNaN(n) ? null : n;
}
function fmtMoneyInput(v){
  if(v == null || v === '') return '';
  const n = Number(v);
  if(isNaN(n)) return '';
  return n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
}
function reformatMoney(elm){ const n = parseMoney(elm.value); elm.value = (n == null ? '' : fmtMoneyInput(n)); }
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// "Today" in the user's configured timezone (not the browser/UTC day), so
// date-based alerts don't roll over a day early/late.
function todayISO(){
  const tz = (typeof config !== 'undefined' && config && config.timezone) || 'America/New_York';
  try {
    return new Intl.DateTimeFormat('en-CA', {timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  } catch(e) {
    return new Date().toISOString().split('T')[0];
  }
}
// Shift an ISO date by N days (anchored at noon UTC to dodge DST edges).
function shiftISO(iso, days){
  const d = new Date(iso + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().split('T')[0];
}
// Format a stored ISO date (YYYY-MM-DD) for DISPLAY as MM/DD/YY. Storage and
// all date math stay ISO; this only affects what the user sees. Returns ''
// for empty/invalid input so callers can fall back to a placeholder.
function fmtDate(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return m[2] + '/' + m[3] + '/' + m[1].slice(2);
}

function toast(msg, ms=2600){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}

// --------- Theme (light / dark) ---------
function applyTheme(){
  const stored = localStorage.getItem('bb_theme');
  const dark = stored ? stored === 'dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = $('#themeBtn'); if(btn) btn.textContent = dark ? '☀️' : '🌙';
}
function toggleTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  localStorage.setItem('bb_theme', dark ? 'light' : 'dark');
  applyTheme();
}

// --------- Status pills & person tokens ---------
function statusPill(status){
  const s = (status||'').toLowerCase();
  const cls = s==='open'?'pill-open':s==='closed'?'pill-closed':'pill-planned';
  return `<span class="pill ${cls}">${esc(s||'—')}</span>`;
}
// Stable color per person name, so each person reads as the same chip everywhere.
const PERSON_PALETTE = ['#0969da','#1a7f37','#9a3fb0','#bc4c00','#0a7ea3','#a8431e','#6e40c9','#2d7d46'];
function personColor(name){
  let h = 0; const s = String(name||'');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return PERSON_PALETTE[h % PERSON_PALETTE.length];
}
function personChip(name){
  if(!name) return '';
  const initial = String(name).trim().charAt(0).toUpperCase() || '?';
  return `<span class="person-chip"><span class="person-dot" style="background:${personColor(name)}">${esc(initial)}</span>${esc(name)}</span>`;
}

// --------- Keyboard shortcuts ---------
const TAB_KEYS = {'1':'today','2':'active','3':'planned','4':'offers','5':'calendar','6':'reports','7':'settings'};
function showShortcuts(){
  modal(`<p><strong>⌨ Keyboard shortcuts</strong></p>
    <table class="sc-table" style="width:100%;font-size:13px">
      <tr><td><kbd>1</kbd>–<kbd>7</kbd></td><td>Jump to Today / Active / Planned / Offers / Calendar / Reports / Settings</td></tr>
      <tr><td><kbd>n</kbd></td><td>New — account (Active/Planned) or offer (Offers)</td></tr>
      <tr><td><kbd>s</kbd></td><td>Save changes (in an account)</td></tr>
      <tr><td><kbd>e</kbd></td><td>Edit — focus the first field (in an account)</td></tr>
      <tr><td><kbd>/</kbd></td><td>Focus the search box (Active / Planned)</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Close a dialog, or go back from an account</td></tr>
      <tr><td><kbd>?</kbd></td><td>Show this help</td></tr>
    </table>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button data-mval="ok">Got it</button></div>`);
}
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  // Escape: close the top modal, else step back out of the detail view.
  if(e.key === 'Escape'){
    if(modalOpen()){ const o = document.querySelector('.modal-ov'); if(o && o._esc) o._esc(); return; }
    if(currentTab() === 'detail'){ backFromDetail(); }
    return;
  }
  // Don't hijack keys while typing or while a dialog is open.
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || modalOpen()) return;

  if(TAB_KEYS[e.key]){ show(TAB_KEYS[e.key]); return; }
  if(e.key === '?'){ showShortcuts(); return; }
  const tab = currentTab();
  if(e.key === 'n'){
    if(tab === 'offers') addOffer();
    else if(tab === 'active' || tab === 'planned') addAccount(tab === 'active' ? 'open' : 'planned');
    return;
  }
  if(e.key === '/' && (tab === 'active' || tab === 'planned')){
    const s = document.querySelector(`#section-${tab} .search-input`); if(s){ e.preventDefault(); s.focus(); }
    return;
  }
  if(tab === 'detail'){
    if(e.key === 's'){ e.preventDefault(); saveAccountDetail(); }
    else if(e.key === 'e'){ const f = document.querySelector('#section-detail input, #section-detail select, #section-detail textarea'); if(f){ e.preventDefault(); f.focus(); } }
  }
});

function modal(innerHtml){
  return new Promise(resolve => {
    const o = el('div', {class:'modal-ov'});
    o.innerHTML = `<div class="modal-card">${innerHtml}</div>`;
    const close = (val) => { if(o._done) return; o._done=true; o.remove(); resolve(val); };
    o._esc = () => close(null);   // let the global Esc handler cancel this modal
    o.addEventListener('click', e => { if(e.target===o) close(null); });
    document.body.appendChild(o);
    const focusEl = o.querySelector('[autofocus]') || o.querySelector('input, select, textarea');
    if(focusEl) setTimeout(() => focusEl.focus(), 30);
    o.querySelectorAll('[data-mval]').forEach(b => b.addEventListener('click', () => close(b.getAttribute('data-mval'))));
    o.querySelectorAll('[data-mcancel]').forEach(b => b.addEventListener('click', () => close(null)));
  });
}

function confirmModal(message, okLabel='OK', danger=false){
  return modal(`<p style="margin:0 0 14px">${esc(message)}</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="${danger?'danger':''}" data-mval="yes">${esc(okLabel)}</button></div>`)
    .then(v=>v==='yes');
}

function uid(p){ return p + '_' + Math.floor(Date.now()/1000) + '_' + Math.random().toString(36).slice(2,6); }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(b64))); }

// --------- GitHub API ---------
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + LS.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

/* =========================================================================
   SIGN-IN  (GitHub OAuth via Cloudflare Worker, with token-paste fallback)
   ========================================================================= */
function oauthReady(){ return OAUTH.clientId && OAUTH.workerUrl; }
function appRedirect(){ return location.origin + location.pathname; }

function signInWithGitHub(){
  if(!oauthReady()){ toast('GitHub sign-in isn\'t set up yet — use a token below for now.'); return; }
  const state = uid('s'); localStorage.setItem('bb_oauth_state', state);
  const u = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(OAUTH.clientId)}`
          + `&scope=repo&redirect_uri=${encodeURIComponent(appRedirect())}&state=${encodeURIComponent(state)}`;
  location.href = u;
}
async function handleOAuthRedirect(){
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), state = p.get('state');
  if(!code) return false;
  history.replaceState({}, '', appRedirect()); // clean the URL no matter what
  if(state !== localStorage.getItem('bb_oauth_state')){ toast('Sign-in expired, please try again.'); return false; }
  try{
    const r = await fetch(OAUTH.workerUrl.replace(/\/$/,'')+'/exchange', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code, redirect_uri: appRedirect() })
    });
    const j = await r.json();
    if(!j.access_token) throw new Error(j.error_description||j.error||'No token returned');
    LS.token = j.access_token; LS.method='oauth';
    await afterSignIn();
    return true;
  }catch(e){ toast('Sign-in failed: '+(e.message||e)); return false; }
}
/* After we have a token: learn the username, default the data repo, then load. */
async function afterSignIn(){
  try{
    const r = await fetch(`${API}/user`, {headers:ghHeaders()});
    if(r.ok){ const u=await r.json(); LS.login=u.login; if(!LS.repo) LS.repo = u.login+'/bank-bonus-data'; }
  }catch(e){}
  toast('Signed in 🎉');
  await init();
}
async function signOut(){
  if(await confirmModal('Sign out on this device? Your data stays safe in GitHub; other devices stay signed in.','Sign out',true)){
    localStorage.removeItem('bb_token'); localStorage.removeItem('bb_login'); localStorage.removeItem('bb_method');
    toast('Signed out'); init();
  }
}

async function ghContents(path){
  const r = await fetch(`${API}/repos/${LS.repo}/contents/${path}`, {headers: ghHeaders()});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}

async function ghPut(path, contentB64, sha, message){
  const body = { message, content: contentB64 };
  if(sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${LS.repo}/contents/${path}`, {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error(`Save failed ${r.status}`);
  return r.json();
}

async function loadJson(path, fallback){
  try {
    const c = await ghContents(path);
    if(c === null){
      DB[path] = {value: JSON.parse(JSON.stringify(fallback)), sha: null};
      return DB[path].value;
    }
    const value = JSON.parse(b64decode(c.content));
    DB[path] = {value, sha: c.sha};
    return value;
  } catch(e) {
    console.error('Error loading', path, e);
    throw e;
  }
}

async function saveJson(path, value, message){
  let sha = DB[path] ? DB[path].sha : null;
  let retries = 1;
  while(retries-- >= 0) {
    try {
      const res = await ghPut(path, b64encode(JSON.stringify(value, null, 2)), sha, message);
      DB[path] = {value, sha: res.content.sha};
      return;
    } catch(e) {
      if(retries > 0 && e.message.includes('conflict')) {
        const c = await ghContents(path);
        sha = c.sha;
      } else throw e;
    }
  }
}

function show(tab){
  $$('.section').forEach(s => s.classList.remove('active'));
  $$('.nav-btn').forEach(b => b.classList.remove('active'));
  const section = $(`#section-${tab}`);
  if(section) {
    section.classList.add('active');
    const navBtn = $(`[data-tab="${tab}"]`);
    if(navBtn){ navBtn.classList.add('active');   // detail view has no nav button
      navBtn.scrollIntoView({inline: 'center', block: 'nearest'}); }   // keep active tab visible on the scrollable mobile bar
    if(tab !== 'detail'){ lastTab = tab; localStorage.setItem('bb_tab', tab); }  // remember tab across refreshes
    const fn = window[`render_${tab}`];
    if(fn) fn();
  }
  updateAppbarUser();
}

// --------- Main init ---------
let loadError = '';

async function init(){
  const main = $('#main');

  // Create all sections (only once — never destroy them, or Settings becomes
  // unreachable on a load error)
  if(!$('#section-today')) {
    main.innerHTML = `
      <div id="section-today" class="section"></div>
      <div id="section-active" class="section"></div>
      <div id="section-planned" class="section"></div>
      <div id="section-offers" class="section"></div>
      <div id="section-calendar" class="section"></div>
      <div id="section-reports" class="section"></div>
      <div id="section-settings" class="section"></div>
      <div id="section-detail" class="section"></div>
    `;
  }

  // If no repo/token configured yet, send the user straight to Settings.
  if(!LS.repo || !LS.token) {
    loadError = 'Welcome! Enter your data repo and GitHub token below to get started.';
    show('settings');
    return;
  }

  // Load data and render. On failure, fall back to Settings (which stays
  // reachable) rather than wiping the page.
  if(await loadAll()) {
    loadError = '';
    // Reopen the tab you were last on (survives a page refresh).
    const TABS = ['today','active','planned','offers','calendar','reports','settings'];
    const saved = localStorage.getItem('bb_tab');
    show(TABS.includes(saved) ? saved : 'today');
  } else {
    loadError = 'Could not load data. Check your repo name and token below.';
    show('settings');
  }
}

// --------- Render functions ---------

function render_today(){
  const section = $('#section-today');
  const today = todayISO();
  let html = '';

  const toOpen = accounts.filter(a => (a.status === 'planned' && a.dates.plannedOpen === today) || (a.dates.reopenAfter === today));
  const toClose = accounts.filter(a => a.dates.closed === today);

  let reminders = [];
  accounts.forEach(a => {
    if(a.reminders) {
      a.reminders.forEach(r => {
        if(r.date === today && !r.done) {
          reminders.push({...r, institution: a.institution, person: a.person, accountId: a.id});
        }
      });
    }
  });

  const yesterdayISO = shiftISO(today, -1);
  const ddCleared = accounts.filter(a => a.dates.firstDD === yesterdayISO && a.status === 'open');

  if(toOpen.length + toClose.length + reminders.length + ddCleared.length === 0) {
    if(accounts.length === 0){
      // Truly no data loaded — point the user at sign-in rather than implying it's empty.
      html = `<div class="empty">No accounts loaded.<br>
        <span style="font-size:13px">If your data isn't showing, open <b>Settings</b> (press <kbd>7</kbd>) and tap <b>🔐 Sign in with GitHub</b>. Or add one on <b>Active</b> / <b>Planned</b>.</span></div>`;
    } else {
      // Caught up for today, but accounts still exist — show the totals so an empty
      // Today screen is never mistaken for "my data is gone."
      const o = accounts.filter(a => a.status === 'open').length;
      const p = accounts.filter(a => a.status === 'planned').length;
      const c = accounts.filter(a => a.status === 'closed').length;
      html = `<div class="card">
        <div class="card-header">✅ Nothing due today</div>
        <p style="margin:0 0 12px;color:var(--muted)">You're all caught up. Your ${accounts.length} accounts are still here:</p>
        <div class="summary-strip" style="margin:0 0 12px">
          <div class="stat"><div class="stat-label">Open</div><div class="stat-value">${o}</div></div>
          <div class="stat"><div class="stat-label">Planned</div><div class="stat-value">${p}</div></div>
          <div class="stat"><div class="stat-label">Closed</div><div class="stat-value">${c}</div></div>
        </div>
        <div class="action-bar" style="margin:0">
          <button onclick="show('active')">View Active</button>
          <button class="sec" onclick="show('reports')">Reports</button>
          <button class="sec" onclick="show('calendar')">Calendar</button>
        </div>
      </div>`;
    }
  } else {
    if(toOpen.length) {
      html += '<div class="card"><div class="card-header">📖 Accounts to Open</div>';
      toOpen.forEach(a => {
        html += `<div class="list-item"><div><strong>${esc(a.institution)}</strong> (${esc(a.person)})<br><span style="font-size:12px;color:var(--muted)">${money(a.bonus)} bonus, ${money(a.directDepositTotal)} DD</span></div></div>`;
      });
      html += '</div>';
    }

    if(toClose.length) {
      html += '<div class="card"><div class="card-header">🔒 Accounts to Close</div>';
      toClose.forEach(a => {
        html += `<div class="list-item"><strong>${esc(a.institution)}</strong> (${esc(a.person)})</div>`;
      });
      html += '</div>';
    }

    if(reminders.length) {
      html += '<div class="card"><div class="card-header">⏰ Reminders</div>';
      reminders.forEach(r => {
        html += `<div class="list-item"><div><strong>${esc(r.institution)}</strong> (${esc(r.person)})<br><span style="font-size:13px">${esc(r.note)}</span></div><button class="sec" onclick="markReminderDone('${esc(r.accountId)}','${esc(r.id)}')">Done</button></div>`;
      });
      html += '</div>';
    }

    if(ddCleared.length) {
      html += '<div class="card"><div class="card-header">✅ First DD Cleared (Yesterday)</div>';
      ddCleared.forEach(a => {
        html += `<div class="list-item"><strong>${esc(a.institution)}</strong> (${esc(a.person)})</div>`;
      });
      html += '</div>';
    }
  }

  // Update nav badge
  const badge = $('[data-tab="today"] .badge') || document.createElement('span');
  const count = toOpen.length + toClose.length + reminders.length + ddCleared.length;
  if(count > 0) {
    $('[data-tab="today"]').innerHTML = '<span class="ic">🗓</span>Today<span class="badge">' + count + '</span>';
  } else {
    $('[data-tab="today"]').innerHTML = '<span class="ic">🗓</span>Today';
  }

  section.innerHTML = html;
}

async function markReminderDone(accountId, reminderId){
  const acc = accounts.find(a => a.id === accountId);
  if(acc && acc.reminders) {
    const rem = acc.reminders.find(r => r.id === reminderId);
    if(rem) {
      rem.done = true;
      await saveAccounts('Mark reminder done');
      render_today();
      toast('Reminder marked done');
    }
  }
}

// Per-tab browse filters (person + free-text search).
const acctFilter = { active: {person:'all', q:''}, planned: {person:'all', q:''} };

function filterBarHTML(tab){
  const f = acctFilter[tab];
  const chips = ['all', ...(config.people || [])].map(p =>
    `<button class="chip ${f.person===p?'active':''}" onclick="setPersonFilter('${tab}','${esc(p)}')">${p==='all'?'Everyone':esc(p)}</button>`).join('');
  const addLabel = tab==='active' ? '+ Add Account' : '+ Add Planned';
  const addStatus = tab==='active' ? 'open' : 'planned';
  return `<div class="filter-bar">
      <div class="chips">${chips}</div>
      <input class="search-input" type="search" placeholder="Search institution… ( / )" value="${esc(f.q)}"
        oninput="setSearchFilter('${tab}', this.value)">
      <button onclick="addAccount('${addStatus}')">${addLabel}</button>
    </div>`;
}
function setPersonFilter(tab, person){ acctFilter[tab].person = person; window['render_'+tab](); }
function setSearchFilter(tab, q){
  acctFilter[tab].q = q;
  const ql = q.trim().toLowerCase();
  document.querySelectorAll(`#section-${tab} [data-inst]`).forEach(card => {
    card.style.display = card.getAttribute('data-inst').includes(ql) ? '' : 'none';
  });
}
function matchPerson(tab, a){ const p = acctFilter[tab].person; return p==='all' || a.person===p; }

function render_active(){
  const section = $('#section-active');
  const active = accounts.filter(a => a.status === 'open' && matchPerson('active', a));

  if(accounts.filter(a => a.status === 'open').length === 0){
    section.innerHTML = `<div class="empty">No active accounts yet.
      <div class="empty-cta"><button onclick="addAccount('open')">+ Add Account</button></div></div>`;
    return;
  }

  let html = filterBarHTML('active');
  active.forEach(a => {
    html += `<div class="card clickable st-open" data-inst="${esc((a.institution||'').toLowerCase())}" onclick="editAccount('${a.id}')">
      <div class="card-header"><span class="card-title">${esc(a.institution)} ${personChip(a.person)}</span>${statusPill('open')}</div>
      <div class="row">
        <div class="row-item"><div class="label">Bonus</div><div class="value money">${money(a.bonus)}</div></div>
        <div class="row-item"><div class="label">DD Total</div><div class="value money">${money(a.directDepositTotal)}</div></div>
        <div class="row-item"><div class="label">Opened</div><div class="value">${fmtDate(a.dates.opened) || '—'}</div></div>
        <div class="row-item"><div class="label">First DD</div><div class="value">${fmtDate(a.dates.firstDD) || '—'}</div></div>
      </div>
    </div>`;
  });
  if(active.length === 0) html += `<div class="empty">No matches for this filter.</div>`;
  section.innerHTML = html;
  setSearchFilter('active', acctFilter.active.q);
}

function render_planned(){
  const section = $('#section-planned');
  const planned = accounts.filter(a => a.status === 'planned' && matchPerson('planned', a));

    html += `<div class="card st-planned" data-inst="${esc((a.institution||'').toLowerCase())}">
      <div class="card-header"><span class="card-title">${esc(a.institution)} ${personChip(a.person)}</span>${statusPill('planned')}</div>
      <div class="row">

// Generate `count` paycheck dates on/after fromISO, from the config schedule.
function paycheckDates(fromISO, count){
  const pc = config.paycheck || {};
  const interval = pc.intervalDays || 14;
  let d = pc.firstDate || '2024-12-27';
  const out = [];
  let guard = 0;
  while(d < fromISO && guard < 2000){ d = shiftISO(d, interval); guard++; }
  while(out.length < count && guard < 4000){ out.push(d); d = shiftISO(d, interval); guard++; }
  return out;
}

// Total DD already allocated on a payroll date by all accounts except one.
function allocatedOn(date, exceptId){
  return accounts.reduce((s, a) => {
    if(a.id === exceptId) return s;
    const dd = (a.ddPlan || []).find(x => x.payrollDate === date);
    return s + (dd ? dd.amount : 0);
  }, 0);
}

// --------- Paycheck amount over time ---------
// Stored as config.paycheck.amounts = [{from:'YYYY-MM-DD', amount}], sorted. This
// lets the take-home change on a date (e.g. $2000 now, $3000 in 6 months) and have
// the calendar / auto-suggest use the right amount for each payday. Migrates the
// old single `amount` + `firstDate` automatically.
function pcAmounts(){
  const pc = config.paycheck || (config.paycheck = {});
  if(!Array.isArray(pc.amounts) || pc.amounts.length === 0){
    pc.amounts = [{ from: pc.firstDate || '2000-01-01', amount: (pc.amount != null ? pc.amount : 1930) }];
  }
  pc.amounts.sort((a, b) => a.from.localeCompare(b.from));
  return pc.amounts;
}
// The take-home paycheck amount in effect on a given date.
function paycheckAmountOn(dateISO){
  const arr = pcAmounts();
  let amt = arr[0].amount;
  for(const e of arr){ if(e.from <= dateISO) amt = e.amount; else break; }
  return amt;
}

// Build one month's 7-column grid. Always renders 6 week-rows (42 day cells) so
// the calendar is the SAME height every month — switching months never shifts
// anything below it. Payroll days are colored and tappable for a breakdown.
function calMonthGrid(ym, allocByDate, today){
  const [y, m] = ym.split('-').map(Number);
  const startDow = new Date(Date.UTC(y, m-1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-cell cal-empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${ym}-${String(d).padStart(2,'0')}`;
    const alloc = allocByDate[iso];
    let cls = 'cal-cell cal-day-cell';
    if(iso < today) cls += ' cal-past';
    if(iso === today) cls += ' cal-today';
    let inner = `<div class="cal-day">${d}</div>`;
    if(alloc != null){
      const cap = paycheckAmountOn(iso);
      const st = alloc > cap ? 'over' : alloc === cap ? 'full' : 'partial';
      cls += ' cal-pay cal-' + st;
      const pct = cap > 0 ? Math.min(100, Math.round(alloc / cap * 100)) : 100;
      const fill = st === 'over' ? 'var(--danger)' : st === 'full' ? 'var(--open)' : 'var(--warn)';
      inner += `<div class="cal-amt">${money(alloc)}</div><div class="cal-bar"><i style="width:${pct}%;background:${fill}"></i></div><span class="cal-dot"></span>`;
    }
    cells += `<div class="${cls}" onclick="calDay('${iso}')">${inner}</div>`;
  }
  // Pad trailing cells out to a full 6 rows (42 cells) for constant height.
  const filled = startDow + daysInMonth;
  for(let i=filled;i<42;i++) cells += '<div class="cal-cell cal-empty"></div>';
  return `<div class="cal-grid">${dows}${cells}</div>`;
}

// Tap a calendar day → modal listing every direct deposit planned that day.
function calDay(iso){
  const items = [];
  accounts.forEach(a => (a.ddPlan || []).forEach(dd => {
    if(dd.payrollDate === iso) items.push({inst: a.institution, person: a.person, amount: dd.amount});
  }));
  const cap = paycheckAmountOn(iso);
  const total = items.reduce((s,x) => s + x.amount, 0);
  const label = new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone:'UTC'});
  let body = `<p style="margin:0 0 14px"><strong>${esc(label)}</strong></p>`;
  if(items.length === 0){
    body += `<p style="color:var(--muted);margin:0 0 18px">No direct deposits planned on this day.</p>`;
  } else {
    body += '<div class="reminder-list" style="margin:0 0 14px">';
    items.sort((a,b) => b.amount - a.amount).forEach(x => {
      body += `<div class="reminder-item"><div style="display:flex;align-items:center;gap:8px">${personChip(x.person)} <strong>${esc(x.inst)}</strong></div><div class="value money">${money(x.amount)}</div></div>`;
    });
    body += '</div>';
    const st = total > cap ? 'over' : total === cap ? 'full' : 'partial';
    const pct = cap > 0 ? Math.min(100, Math.round(total / cap * 100)) : 100;
    const free = Math.max(0, cap - total);
    const fill = st === 'over' ? 'var(--danger)' : st === 'full' ? 'var(--open)' : 'var(--warn)';
    body += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px">
        <span style="font-weight:600">${money(total)} of ${money(cap)}</span>
        <span class="pill pill-${st}">${st}</span>
      </div>
      <div class="prog"><i style="width:${pct}%;background:${fill}"></i></div>
      <p style="margin:6px 0 18px;font-size:13px;color:var(--muted)">${pct}% of paycheck used · ${money(free)} still free${st === 'over' ? ' · over by ' + money(total - cap) : ''}</p>`;
  }
  body += `<div class="row" style="justify-content:flex-end;margin:0"><button data-mval="ok">Close</button></div>`;
  modal(body);
}

// Which month the Calendar is showing (YYYY-MM). Defaults to the current month;
// the ‹ › buttons step back/forward and "Today" jumps home.
let calMonth = null;
function shiftMonth(ym, delta){
  let [y, m] = ym.split('-').map(Number);
  m += delta;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  return y + '-' + String(m).padStart(2, '0');
}
function calNav(delta){ calMonth = shiftMonth(calMonth || todayISO().slice(0,7), delta); render_calendar(); }
function calToday(){ calMonth = todayISO().slice(0,7); render_calendar(); }

function render_calendar(){
  const section = $('#section-calendar');
  const today = todayISO();
  if(!calMonth) calMonth = today.slice(0,7);   // open on the current month

  // Sum each payroll date's allocation across all accounts.
  const allocByDate = {};
  accounts.forEach(a => (a.ddPlan || []).forEach(dd => {
    allocByDate[dd.payrollDate] = (allocByDate[dd.payrollDate] || 0) + dd.amount;
  }));
  const dates = Object.keys(allocByDate).sort();
  const totalPlanned = dates.reduce((s,d) => s + allocByDate[d], 0);
  const upcoming = dates.filter(d => d >= today).length;
  const overCount = dates.filter(d => allocByDate[d] > paycheckAmountOn(d)).length;

  const [yy, mm] = calMonth.split('-').map(Number);
  const monthName = new Date(Date.UTC(yy, mm-1, 1)).toLocaleString('en-US', {month:'long', year:'numeric', timeZone:'UTC'});
  const monthTotal = dates.filter(d => d.slice(0,7) === calMonth).reduce((s,d) => s + allocByDate[d], 0);

  // The nav uses a FIXED grid and an always-present Today button + subtitle line,
  // so stepping between months never moves the arrows or resizes the controls.
  let html = `<div class="summary-strip">
      <div class="stat"><div class="stat-label">Total planned DD</div><div class="stat-value">${money(totalPlanned)}</div><div class="stat-sub">${dates.length} payday(s)</div></div>
      <div class="stat"><div class="stat-label">Upcoming</div><div class="stat-value">${upcoming}</div><div class="stat-sub">payday(s) ahead</div></div>
      <div class="stat"><div class="stat-label">Over-allocated</div><div class="stat-value">${overCount}</div><div class="stat-sub">need a fix</div></div>
    </div>
    <div class="cal-legend">
      <span><i style="background:var(--open-bg)"></i> Full</span>
      <span><i style="background:var(--warn-soft)"></i> Partial</span>
      <span><i style="background:rgba(210,59,59,.18)"></i> Over</span>
      <span><i style="outline:2px solid var(--accent);outline-offset:-2px"></i> Today</span>
    </div>
    <div class="card">
      <div class="cal-nav">
        <button class="sec cal-arrow" onclick="calNav(-1)" aria-label="Previous month">‹</button>
        <div class="cal-month">
          <div class="cal-month-name">${esc(monthName)}</div>
          <div class="cal-month-sub">${monthTotal > 0 ? money(monthTotal) + ' planned' : 'No deposits this month'}</div>
        </div>
        <button class="sec cal-arrow" onclick="calNav(1)" aria-label="Next month">›</button>
        <button class="sec cal-today-btn" onclick="calToday()">Today</button>
      </div>
      ${calMonthGrid(calMonth, allocByDate, today)}
      <p class="cal-hint">Tap any day to see what's planned.</p>
    </div>`;
  section.innerHTML = html;
}

let reportPerson = 'all';
function setReportPerson(p){ reportPerson = p; render_reports(); }

function render_reports(){
  const section = $('#section-reports');

  const open = accounts.filter(a => a.status === 'open');
  const closed = accounts.filter(a => a.status === 'closed');
  const planned = accounts.filter(a => a.status === 'planned');

  // Gross income per account = bonus + referral
  const gross = a => (a.bonus || 0) + (a.referralValue || 0);
  const sum = arr => arr.reduce((s, a) => s + gross(a), 0);

  const taxRate = config.taxRate || 0;
  const afterTax = v => v * (1 - taxRate);

  const earned = sum(closed);
  const pending = sum(open);
  const plannedTot = sum(planned);
  const total = earned + pending + plannedTot;

  const hrs = config.laborHours || {};
  const perOpen = (hrs.open || 0.35) + (hrs.requirements || 0.5);
  const perClosed = (hrs.open || 0.35) + (hrs.requirements || 0.5) + (hrs.close || 0.5);
  // Realized + in-progress effort (planned accounts not yet worked)
  const totalHours = open.length * perOpen + closed.length * perClosed;
  const afterTaxRealized = afterTax(earned + pending);

  const pct = (taxRate * 100).toFixed(2);

  // Headline numbers up top.
  let html = `<div class="summary-strip">
      <div class="stat"><div class="stat-label">Total projected (after-tax)</div><div class="stat-value">${money(afterTax(total))}</div><div class="stat-sub">${money(total)} gross · ${accounts.length} accounts</div></div>
      <div class="stat"><div class="stat-label">Earned</div><div class="stat-value">${money(afterTax(earned))}</div><div class="stat-sub">${closed.length} closed</div></div>
      <div class="stat"><div class="stat-label">Pending</div><div class="stat-value">${money(afterTax(pending))}</div><div class="stat-sub">${open.length} open</div></div>
      <div class="stat"><div class="stat-label">After-tax $/hr</div><div class="stat-value">${money(afterTaxRealized / Math.max(totalHours, 1))}</div><div class="stat-sub">${totalHours.toFixed(1)}h invested</div></div>
    </div>`;

  html += '<div class="card" style="padding:0"><div class="card-header" style="padding:16px 16px 0">Bonuses (gross → after-tax)</div>';
  html += '<div class="table-wrap"><table><thead><tr><th></th><th class="num">Gross</th><th class="num">After-tax</th><th class="num">#</th></tr></thead><tbody>';
  html += `<tr><td>Earned (closed)</td><td class="num">${money(earned)}</td><td class="num">${money(afterTax(earned))}</td><td class="num">${closed.length}</td></tr>`;
  html += `<tr><td>Pending (open)</td><td class="num">${money(pending)}</td><td class="num">${money(afterTax(pending))}</td><td class="num">${open.length}</td></tr>`;
  html += `<tr><td>Planned</td><td class="num">${money(plannedTot)}</td><td class="num">${money(afterTax(plannedTot))}</td><td class="num">${planned.length}</td></tr>`;
  html += `<tr style="font-weight:700"><td>Total projected</td><td class="num">${money(total)}</td><td class="num">${money(afterTax(total))}</td><td class="num">${accounts.length}</td></tr>`;
  html += '</tbody></table></div>';
  html += `<div style="font-size:12px;color:var(--muted);padding:8px 16px 16px">After-tax applies your ${pct}% marginal rate to bonus + referral income.</div>`;
  html += '</div>';

  html += '<div class="card"><div class="card-header">Effort & return</div><div class="row">';
  html += `<div class="row-item"><div class="label">Est. hours (opened)</div><div class="value">${totalHours.toFixed(1)}h</div></div>`;
  html += `<div class="row-item"><div class="label">After-tax realized+pending</div><div class="value money">${money(afterTaxRealized)}</div></div>`;
  html += `<div class="row-item"><div class="label">After-tax $/hr</div><div class="value money">${money(afterTaxRealized / Math.max(totalHours, 1))}/hr</div></div>`;
  html += '</div></div>';

  // All-accounts table, filterable by person.
  const personChips = ['all', ...(config.people || [])].map(p =>
    `<button class="chip ${reportPerson===p?'active':''}" onclick="setReportPerson('${esc(p)}')">${p==='all'?'Everyone':esc(p)}</button>`).join('');
  const rows = accounts.filter(a => reportPerson==='all' || a.person===reportPerson);

  html += '<div class="card" style="padding:0"><div class="card-header" style="padding:16px 16px 0">All accounts</div>';
  html += `<div style="padding:0 16px 12px"><div class="chips">${personChips}</div></div>`;
  html += '<div class="table-wrap"><table><thead><tr><th>Institution</th><th>Person</th><th>Status</th><th class="num">Bonus</th><th class="num">Referral</th><th class="num">APY</th></tr></thead><tbody>';
  rows.forEach(a => {
    let apy = '—';
    if (a.minBalance && a.minBalance > 0 && a.minBalDays && a.minBalDays > 0) {
      const afterTaxBonus = (a.bonus || 0) * (1 - taxRate);
      apy = `${(afterTaxBonus / a.minBalance * 365 / a.minBalDays * 100).toFixed(1)}%`;
    }
    html += `<tr><td>${esc(a.institution)}</td><td>${personChip(a.person)}</td><td>${statusPill(a.status)}</td><td class="num">${money(a.bonus)}</td><td class="num">${a.referralValue ? money(a.referralValue) : '—'}</td><td class="num">${apy}</td></tr>`;
  });
  html += '</tbody></table></div></div>';

  section.innerHTML = html;
}

async function saveSettings(){
  if($('#set_me')) LS.me = $('#set_me').value;
  // The repo/token fields only exist on the paste-a-token path (signed out).
  const repoEl = $('#set_repo'), tokenEl = $('#set_token');
  if(repoEl && tokenEl){
    const repo = repoEl.value.trim(), token = tokenEl.value.trim();
    if(token !== LS.token){ LS.method = 'token'; }
    LS.repo = repo; LS.token = token;
    if(!LS.repo || !LS.token){ toast('Repo and token required'); return; }
    try { await loadAll(); toast('Settings saved and data loaded'); init(); }
    catch(e){ toast('Error: ' + e.message); }
    return;
  }
  toast('Saved');
  updateAppbarUser();
}

async function savePaycheckSettings(){
  const pc = config.paycheck || (config.paycheck = {});
  pc.intervalDays = parseInt($('#set_interval').value) || 14;
  pc.firstDate = $('#set_firstdate').value.trim();
  pc.ddClearDays = parseInt($('#set_ddclear').value) || 21;
  pcAmounts();   // ensure the amounts list exists; it's the source of truth for amount
  try {
    await saveConfig('Update paycheck settings');
    toast('Paycheck settings saved');
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

// Add / remove a take-home amount that takes effect on a date.
async function addPaycheckAmount(){
  const from = $('#pa_from').value;
  const amount = parseMoney($('#pa_amount').value);
  if(!from || amount == null){ toast('Pick an effective date and amount'); return; }
  const pc = config.paycheck || (config.paycheck = {});
  const arr = pcAmounts();
  const existing = arr.find(e => e.from === from);
  if(existing) existing.amount = amount; else arr.push({ from, amount });
  arr.sort((a, b) => a.from.localeCompare(b.from));
  pc.amount = arr[arr.length - 1].amount;   // keep legacy field = latest
  try { await saveConfig('Update paycheck amount'); render_settings(); toast('Saved'); }
  catch(e){ toast('Error: ' + e.message); }
}
async function removePaycheckAmount(i){
  const arr = pcAmounts();
  if(arr.length <= 1){ toast('Keep at least one amount'); return; }
  if(!await confirmModal('Remove this paycheck amount?', 'Remove', true)) return;
  arr.splice(i, 1);
  config.paycheck.amount = arr[arr.length - 1].amount;
  try { await saveConfig('Remove paycheck amount'); render_settings(); }
  catch(e){ toast('Error: ' + e.message); }
}

// People list (drives every Person dropdown).
async function addPerson(){
  const v = ($('#new_person').value || '').trim();
  if(!v) return;
  if(!config.people) config.people = [];
  if(config.people.includes(v)){ toast('Already in the list'); return; }
  config.people.push(v);
  try { await saveConfig('Add person: ' + v); render_settings(); toast(v + ' added'); }
  catch(e){ toast('Error: ' + e.message); }
}
async function removePerson(p){
  if(!await confirmModal('Remove "' + p + '"? Existing accounts keep their label, but you won\'t be able to pick this person for new ones.', 'Remove', true)) return;
  config.people = (config.people || []).filter(x => x !== p);
  try { await saveConfig('Remove person: ' + p); render_settings(); }
  catch(e){ toast('Error: ' + e.message); }
}

// Notifications: save email, and trigger a one-off test of the email workflow.
async function saveNotifyEmail(){
  const email = ($('#set_email').value || '').trim();
  if(!config.notify) config.notify = [];
  if(email) config.notify[0] = { email, enabled: true };
  else config.notify = [];
  try { await saveConfig('Update notify email'); toast('Email saved'); }
  catch(e){ toast('Error: ' + e.message); }
}
async function testNotification(){
  if(!LS.token || !LS.repo){ toast('Sign in first'); return; }
  const email = ($('#set_email') && $('#set_email').value.trim()) || '';
  try {
    if(email){ if(!config.notify) config.notify = []; config.notify[0] = { email, enabled: true }; await saveConfig('Update notify email'); }
    const r = await fetch(`${API}/repos/${LS.repo}/actions/workflows/daily-email.yml/dispatches`, {
      method: 'POST', headers: ghHeaders(),
      body: JSON.stringify({ ref: 'main', inputs: { test: 'true' } })
    });
    if(r.status === 204){ toast('Test email sent — check your inbox in a minute 📧'); }
    else { const j = await r.json().catch(() => ({})); toast('Could not send test: ' + (j.message || ('HTTP ' + r.status))); }
  } catch(e){ toast('Error: ' + e.message); }
}

function editAccount(accountId){

  show('detail');

// Read every field input back into the in-memory account object, so edits are
// never lost when the detail view re-renders (e.g. after adding a reminder).
function captureFields(){
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const gv = id => { const e = $('#' + id); return e ? e.value : undefined; };
  const gs = id => { const v = gv(id); return v === undefined ? undefined : v.trim(); };
  const gn = id => { const v = gv(id); if(v === undefined) return undefined; const c = String(v).replace(/[^0-9.\-]/g, ''); if(c === '' || c === '-' || c === '.') return null; const n = parseFloat(c); return isNaN(n) ? null : n; };
  const gd = id => { const v = gv(id); return v === undefined ? undefined : (v.trim() === '' ? null : v.trim()); };

  if(gs('d_institution') !== undefined) a.institution = gs('d_institution');
  if(gv('d_person') !== undefined) a.person = gv('d_person');
  if(gv('d_status') !== undefined) a.status = gv('d_status');
  if(gn('d_bonus') !== undefined) a.bonus = gn('d_bonus');
  if(gn('d_referralValue') !== undefined) a.referralValue = gn('d_referralValue');
  if(gn('d_directDepositTotal') !== undefined) a.directDepositTotal = gn('d_directDepositTotal');
  if(gn('d_nbDeposits') !== undefined) a.nbDeposits = gn('d_nbDeposits');
  if(gn('d_minBalance') !== undefined) a.minBalance = gn('d_minBalance');
  if(gn('d_minBalDays') !== undefined) a.minBalDays = gn('d_minBalDays');
  if(gn('d_daysToCompleteReq') !== undefined) a.daysToCompleteReq = gn('d_daysToCompleteReq');
  if(gn('d_monthsTillReopen') !== undefined) a.monthsTillReopen = gn('d_monthsTillReopen');
  if(gs('d_bonusTiming') !== undefined) a.bonusTiming = gs('d_bonusTiming');
  if(gs('d_avoidFees') !== undefined) a.avoidFees = gs('d_avoidFees');
  if(gs('d_additionalRequirements') !== undefined) a.additionalRequirements = gs('d_additionalRequirements');
  if(gs('d_notes') !== undefined) a.notes = gs('d_notes');

  if(gd('d_date_plannedOpen') !== undefined) a.dates.plannedOpen = gd('d_date_plannedOpen');
  if(gd('d_date_opened') !== undefined) a.dates.opened = gd('d_date_opened');
  if(gd('d_date_firstDD') !== undefined) a.dates.firstDD = gd('d_date_firstDD');
  if(gd('d_date_bonusPaidOut') !== undefined) a.dates.bonusPaidOut = gd('d_date_bonusPaidOut');
  if(gd('d_date_closed') !== undefined) a.dates.closed = gd('d_date_closed');
  if(gd('d_date_reopenAfter') !== undefined) a.dates.reopenAfter = gd('d_date_reopenAfter');
}

      <div class="row">${num('d_daysToCompleteReq','Days to Complete Req', a.daysToCompleteReq)}${num('d_monthsTillReopen','Months till Reopen', a.monthsTillReopen)}${txt('d_bonusTiming','Bonus Timing', a.bonusTiming)}</div>
      <div class="row">${txt('d_avoidFees','Avoid Fees', a.avoidFees)}</div>
      <div class="row"><div class="row-item"><div class="label">Additional Requirements</div><textarea id="d_additionalRequirements" rows="2" style="width:100%">${esc(a.additionalRequirements || '')}</textarea></div></div>
      <div class="row"><div class="row-item"><div class="label">Notes</div><textarea id="d_notes" rows="2" style="width:100%">${esc(a.notes || '')}</textarea></div></div>
    </div>

    <div class="card">
      <div class="card-header">Dates</div>
      <div class="row">${dat('d_date_plannedOpen','Planned Open', a.dates.plannedOpen)}${dat('d_date_opened','Opened', a.dates.opened)}${dat('d_date_firstDD','First DD', a.dates.firstDD)}</div>
      <div class="row">${dat('d_date_bonusPaidOut','Bonus Paid Out', a.dates.bonusPaidOut)}${dat('d_date_closed','Closed', a.dates.closed)}${dat('d_date_reopenAfter','Reopen After', a.dates.reopenAfter)}</div>
    </div>

    <div class="card">
      <div class="card-header">Tasks</div>`;

  const taskDefs = [['estatements','E-Statements'],['alerts','Account alerts'],['ddSetup','DD setup'],['documented','Notes/fees documented'],['reminders','Reminders added'],['referrals','Referrals sent']];
  taskDefs.forEach(([key,label]) => {
    html += `<label style="display:block;margin-bottom:6px"><input type="checkbox" class="checkbox" ${a.tasks[key] ? 'checked' : ''} onchange="toggleTask('${key}')"> ${label}</label>`;

function backFromDetail(){
  captureFields();
  saveAccounts('Update account').catch(e => toast('Save error: ' + e.message));
  editingId = null;
  show(lastTab);
}

async function persistDetail(msg){
  try {
    await saveAccounts(msg);
    render_detail();
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

async function toggleTask(key){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.tasks[key] = !a.tasks[key];
  await persistDetail('Update task');
}

async function toggleReminderDetail(remId){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  const r = a && a.reminders.find(x => x.id === remId);
  if(!r) return;
  r.done = !r.done;
  await persistDetail('Toggle reminder');
}

async function deleteReminder(remId){
  if(!await confirmModal('Delete this reminder?', 'Delete', true)) return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.reminders = a.reminders.filter(x => x.id !== remId);
  await persistDetail('Delete reminder');
}

async function addReminder(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const date = $('#d_new_rem_date').value;
  const note = $('#d_new_rem_note').value.trim();
  if(!date || !note) { toast('Reminder needs a date and a note'); return; }
  a.reminders.push({ id: uid('r'), date, note, done: false });
  await persistDetail('Add reminder');
}

async function deleteDD(index){
  if(!await confirmModal('Remove this direct-deposit entry?', 'Remove', true)) return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.ddPlan.splice(index, 1);
  await persistDetail('Delete DD entry');
}

async function addDD(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const payrollDate = $('#d_new_dd_date').value;
  const amount = parseMoney($('#d_new_dd_amount').value);
  if(!payrollDate || amount == null) { toast('DD entry needs a date and amount'); return; }
  a.ddPlan.push({ payrollDate, amount });
  a.ddPlan.sort((x, y) => x.payrollDate.localeCompare(y.payrollDate));
  await persistDetail('Add DD entry');
}

async function suggestDD(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const need = a.directDepositTotal || 0;
  if(need <= 0){ toast('No DD requirement to schedule'); return; }
  const start = a.dates.plannedOpen || a.dates.opened || todayISO();
  const dates = paycheckDates(start, 60);
  const plan = [];
  let remaining = need;
  const n = (a.nbDeposits && a.nbDeposits > 1) ? Math.floor(a.nbDeposits) : 0;

  if(n > 0){
    // "Requires N deposits": split the total into N equal deposits, one per
    // consecutive payday (e.g. $120 over 12 deposits -> 12 × $10).
    const per = Math.round((need / n) * 100) / 100;
    for(let i = 0; i < n && i < dates.length; i++){
      const amt = (i === n - 1) ? Math.round(remaining * 100) / 100 : per;  // last absorbs rounding
      plan.push({ payrollDate: dates[i], amount: amt });
      remaining -= amt;
    }
    remaining = 0;
  } else {
    // Otherwise fill each payday up to that paycheck's take-home, until the total
    // is met (without over-allocating a payday).
    for(const d of dates){
      if(remaining <= 0) break;
      const free = paycheckAmountOn(d) - allocatedOn(d, a.id);
      if(free <= 0) continue;
      const amt = Math.min(remaining, free);
      plan.push({ payrollDate: d, amount: Math.round(amt * 100) / 100 });
      remaining -= amt;
    }
  }
  if(plan.length === 0){ toast('No paycheck capacity available'); return; }
  a.ddPlan = plan;
  if(remaining > 0) toast('Scheduled ' + money(need - remaining) + ' of ' + money(need) + ' — ran out of paychecks');
  else toast('Suggested ' + plan.length + ' deposit(s)' + (n > 0 ? ' of ' + money(plan[0].amount) : ''));
  await persistDetail('Auto-suggest DD plan');
}

async function saveAccountDetail(){
  captureFields();
  try {
    await saveAccounts('Update account');
    toast('Saved');
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

async function closeAccountDetail(){
  const ok = await modal(`<p>Close this account? Status will be set to <strong>closed</strong>.</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="danger" data-mval="yes">Close Account</button></div>`);
  if(ok !== 'yes') return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.status = 'closed';
  if(!a.dates.closed) a.dates.closed = todayISO();
  try {
    await saveAccounts('Close account: ' + a.institution);
    toast('Account closed');
    editingId = null;
    show(lastTab);
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

// Move an account back to the Offers backlog (the reverse of "Promote").
async function moveToOffers(){
  if(!await confirmModal('Move this account back to the Offers backlog? Its open/close dates, reminders, and DD plan will be cleared.', 'Move to Offers')) return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  offers.push({
    id: uid('o'), institution: a.institution, person: a.person, bonus: a.bonus,
    referralValue: a.referralValue, directDepositTotal: a.directDepositTotal,
    requiresMultipleDeposits: a.requiresMultipleDeposits, nbDeposits: a.nbDeposits,
    minBalance: a.minBalance, minBalDays: a.minBalDays, additionalRequirements: a.additionalRequirements,
    daysToCompleteReq: a.daysToCompleteReq, bonusTiming: a.bonusTiming, avoidFees: a.avoidFees,
    churnable: a.churnable, monthsTillReopen: a.monthsTillReopen, notes: a.notes, status: 'backlog'
  });
  accounts = accounts.filter(x => x.id !== editingId);
  try {
    await saveOffers('Move account to offers: ' + a.institution);
    await saveAccounts('Remove account moved to offers: ' + a.institution);
    toast(a.institution + ' moved to Offers');
    editingId = null;
    show('offers');
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

async function deleteAccountDetail(){
  const ok = await modal(`<p>Permanently delete this account? This cannot be undone.</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="danger" data-mval="yes">Delete</button></div>`);
  if(ok !== 'yes') return;
  accounts = accounts.filter(x => x.id !== editingId);
  try {
    await saveAccounts('Delete account');
    toast('Account deleted');
    editingId = null;
    show(lastTab);
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}
