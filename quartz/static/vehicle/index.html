<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#14494B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Model long-term vehicle ownership costs and compare cars side by side." />
<title>Driveline — Vehicle Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,650&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F3F1EA; --bg2:#ECE8DD; --surface:#FFFFFF; --surface2:#FBFAF5;
  --ink:#1B1E1C; --muted:#6E726B; --faint:#9B9E96; --line:#E5E1D6; --line2:#EFECE3;
  --primary:#14494B; --primary-d:#0E3739; --primary-t:#E2EDEC;
  --accent:#C8702D; --accent-t:#F6E9DC;
  --good:#2F7D52; --good-t:#E0EFE6; --warn:#B4690E; --danger:#9E2B25;
  --shadow:0 1px 2px rgba(20,30,25,.05), 0 4px 16px rgba(20,30,25,.05);
  --shadow-lg:0 8px 30px rgba(20,30,25,.12);
  --r:18px; --r-sm:12px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  line-height:1.45; letter-spacing:-.005em;
  padding-bottom:calc(76px + var(--safe-b));
  overflow-x:hidden;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit}
a{color:var(--primary)}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:40;background:var(--primary);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
.appbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
.appbar .mark{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border-radius:9px}
.appbar .mark svg{width:18px;height:18px;display:block}
.appbar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:11.5px;opacity:.72;font-weight:500;margin-top:1px}
.appbar .spacer{flex:1}
.appbar .back{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;
  border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.appbar .back svg{width:18px;height:18px}

/* ---------- Layout ---------- */
main{max-width:880px;margin:0 auto;padding:16px 16px 8px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 2px 2px}
.page-sub{color:var(--muted);font-size:13.5px;margin:0 2px 14px}

/* ---------- Assumptions bar ---------- */
.assume{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.assume::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 13px;font-size:12.5px;color:var(--ink);display:flex;gap:7px;align-items:center;cursor:pointer;
  box-shadow:var(--shadow);white-space:nowrap}
.chip b{font-weight:600}
.chip .k{color:var(--muted);font-weight:500}
.chip.alt{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.alt .k{color:rgba(255,255,255,.7)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:12px}
.card h2.tight{margin-bottom:6px}

/* ---------- Vehicle list cards ---------- */
.vcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:0;margin:0 0 13px;box-shadow:var(--shadow);cursor:pointer;
  overflow:hidden;position:relative;transition:transform .12s ease, box-shadow .12s ease}
.vcard:active{transform:scale(.992)}
.vcard .accentbar{position:absolute;left:0;top:0;bottom:0;width:5px}
.vcard .vc-top{display:flex;align-items:flex-start;gap:12px;padding:15px 16px 12px 19px}
.vc-name{font-family:var(--serif);font-size:18.5px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.vc-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--muted)}
.badge.ev{background:var(--good-t);color:#1d6b43}
.badge.hybrid{background:var(--primary-t);color:var(--primary-d)}
.badge.gas{background:var(--accent-t);color:#9c531c}
.vc-head-num{margin-left:auto;text-align:right;flex:0 0 auto}
.vc-head-num .big{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em}
.vc-head-num .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.vc-rec{display:flex;align-items:center;gap:8px;padding:11px 16px 13px 19px;border-top:1px solid var(--line2);
  background:var(--surface2);font-size:12.5px;color:var(--muted)}
.vc-rec .dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:0 0 auto}
.vc-rec b{color:var(--ink);font-weight:600}
.vc-spark{flex:0 0 auto;margin-left:auto}
.vc-spark canvas{display:block}
.chev{flex:0 0 auto;color:var(--faint)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-size:15px;font-weight:600;border:0;border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;
  background:var(--primary);color:#fff;transition:filter .12s ease,transform .1s ease}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #e7cdc9}
.btn.accent{background:var(--accent)}
.btn svg{width:18px;height:18px}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}

/* ---------- Headline / metrics ---------- */
.hero{background:linear-gradient(160deg,var(--primary),var(--primary-d));color:#fff;border-radius:var(--r);
  padding:18px;margin:0 0 14px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;opacity:.72;font-weight:600}
.hero .line{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em;margin:7px 0 14px;line-height:1.3}
.hero .line b{font-weight:650}
.hero .stats{display:flex;gap:10px}
.hero .stat{flex:1;background:rgba(255,255,255,.10);border-radius:12px;padding:11px 12px}
.hero .stat .v{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.02em}
.hero .stat .k{font-size:10.5px;opacity:.74;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:12px 12px}
.metric .v{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.metric .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}

/* ---------- Breakdown bars ---------- */
.bd-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.bd-row .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.bd-row .name{font-size:13.5px;min-width:96px}
.bd-track{flex:1;height:8px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bd-fill{height:100%;border-radius:6px}
.bd-val{font-size:13px;font-weight:600;min-width:64px;text-align:right}
.bd-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bd-total .v{font-family:var(--serif);font-size:22px;font-weight:600}

/* ---------- Controls ---------- */
.field{margin:0 0 12px}
.field:last-child{margin-bottom:0}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
input.inp,select.inp{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
input.inp:focus,select.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-t)}
.inp-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;min-width:0}
.inp-group .pre{padding:0 2px 0 13px;color:var(--muted);font-size:15px}
.inp-group .suf{padding:0 13px 0 4px;color:var(--muted);font-size:13px;white-space:nowrap}
.inp-group input{border:0;flex:1;min-width:0;padding:12px 8px;font-size:16px;background:transparent;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.inp-group input:focus{outline:none}
.inp-group:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-t)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2>*,.grid3>*{min-width:0}

/* ---------- Slider ---------- */
.slider-wrap{padding:2px 2px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider-top .v{font-family:var(--serif);font-size:18px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--primary) var(--p,50%),var(--bg2) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:2px solid var(--primary);box-shadow:var(--shadow);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
  border:2px solid var(--primary);cursor:pointer}

/* ---------- Seg control ---------- */
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:8px;font-size:13px;
  font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Data table ---------- */
.dt-head,.dt-row{display:grid;grid-template-columns:54px 1fr 1fr 1fr 1fr 30px;gap:6px;align-items:center}
.dt-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);font-weight:600;
  padding:0 2px 7px;position:sticky}
.dt-row{padding:4px 0}
.dt-row input{width:100%;padding:8px 7px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;
  background:#fff;font-variant-numeric:tabular-nums;text-align:right}
.dt-row input.yr{text-align:center;font-weight:600;background:var(--surface2)}
.dt-row input:focus{outline:none;border-color:var(--primary)}
.dt-del{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.dt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt-inner{min-width:420px}

/* ---------- Compare ---------- */
.selrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.selrow::-webkit-scrollbar{display:none}
.selchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;
  color:var(--muted);white-space:nowrap}
.selchip .sw{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.selchip.on{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend .sw{width:11px;height:3px;border-radius:2px}

table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--line2)}
table.cmp th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);font-weight:600}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
table.cmp td.car{font-weight:600}
table.cmp td .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
table.cmp tr.best td{background:var(--good-t)}
table.cmp .pill{display:inline-block;font-size:10px;font-weight:700;color:#1d6b43;margin-left:6px}
.num.big{font-family:var(--serif)}

.chartbox{position:relative;width:100%}
.chartbox canvas{display:block;width:100%}

/* ---------- Bottom nav ---------- */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + var(--safe-b))}
nav.tab button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--faint);font-size:11px;font-weight:600;padding:4px}
nav.tab button svg{width:23px;height:23px}
nav.tab button.on{color:var(--primary)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;color:var(--faint);margin-bottom:10px}
.note{font-size:12px;color:var(--faint);line-height:1.5}
.sec-gap{height:4px}
.hr{height:1px;background:var(--line);margin:14px 0}
.inline-link{background:none;border:0;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));z-index:80;
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(min-width:760px){
  .page-title{font-size:30px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .two-col>.card{margin-bottom:0}
}
</style>
</head>
<body>
<div class="appbar">
  <button class="back" id="backBtn" style="display:none" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"/><path d="M4 13h16v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="15.5" r=".6"/><circle cx="16.5" cy="15.5" r=".6"/></svg></span>
    <div style="min-width:0">
      <h1 id="abTitle">Driveline</h1>
      <div class="sub" id="abSub">Long-term cost of ownership</div>
    </div>
  </div>
</div>

<main id="app"></main>

<nav class="tab" id="tabnav">
  <button data-tab="garage" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.6-4.8A2 2 0 0 1 8.5 7h7a2 2 0 0 1 1.9 1.2L19 13"/><path d="M4 13h16v4h-2v-1H6v1H4z"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="16.5" cy="15.5" r="1"/></svg>
    Garage
  </button>
  <button data-tab="compare">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><rect x="7" y="11" width="3.4" height="8" rx="1"/><rect x="13.6" y="7" width="3.4" height="12" rx="1"/><path d="M4 19h16"/></svg>
    Compare
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V20a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 18.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 4.6l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H20a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    Settings
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================ *
 *  ENGINE  (verified standalone in Node — see notes)            *
 * ============================================================ */
const Eng = (() => {
  const DEFAULTS = {
    annualMiles:10000, fuelPrice:3.50, salesTax:0.07, inflation:0.03,
    baselineMiles:13500, mileWeight:0.5, valuePerMile:null, maxHold:20
  };
  function linreg(xs,ys){
    const n=xs.length; if(!n) return {m:0,b:0};
    let sx=0,sy=0,sxx=0,sxy=0;
    for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}
    const d=n*sxx-sx*sx; if(Math.abs(d)<1e-9) return {m:0,b:sy/n};
    const m=(n*sxy-sx*sy)/d; return {m,b:(sy-m*sx)/n};
  }
  function prep(rows){
    const refYear=Math.max(...rows.map(r=>+r[0]));
    const pts=rows.map(r=>({age:refYear-(+r[0]),price:num(r[1]),maint:num(r[2]),ins:num(r[3]),reg:num(r[4])}));
    return {refYear,pts};
  }
  function num(x){ const v=parseFloat(x); return isFinite(v)?v:null; }
  function fitValue(pts){
    const data=pts.filter(p=>p.price!=null&&p.price>0).map(p=>({a:p.age,v:p.price}));
    if(data.length<2){const v=(data[0]&&data[0].v)||0;return ()=>v;}
    const minV=Math.min(...data.map(d=>d.v)); let best=null,steps=80;
    for(let i=0;i<=steps;i++){
      const f=(0.95*minV)*(i/steps);
      if(data.some(d=>d.v-f<=1)) continue;
      const {m,b}=linreg(data.map(d=>d.a),data.map(d=>Math.log(d.v-f)));
      if(m>0) continue;
      const A=Math.exp(b); let sse=0;
      for(const d of data){const pred=f+A*Math.exp(m*d.a);sse+=(pred-d.v)**2;}
      if(!best||sse<best.sse) best={sse,f,A,k:-m};
    }
    if(!best){const {m,b}=linreg(data.map(d=>d.a),data.map(d=>d.v));return a=>Math.max(0,b+m*a);}
    const {f,A,k}=best; return a=>Math.max(0,f+A*Math.exp(-k*Math.max(a,0)));
  }
  function fitTrend(pts,key,{floorFrac=0,capMul=3,dropZero=false}={}){
    const data=pts.filter(p=>p[key]!=null&&(dropZero?p[key]>0:p[key]>=0)).map(p=>({a:p.age,v:p[key]}));
    if(!data.length) return ()=>0;
    if(data.length===1){const v=data[0].v;return ()=>v;}
    const {m,b}=linreg(data.map(d=>d.a),data.map(d=>d.v));
    const vals=data.map(d=>d.v),lo=floorFrac*Math.min(...vals),hi=capMul*Math.max(...vals);
    return a=>Math.min(hi,Math.max(lo,b+m*Math.max(a,0)));
  }
  function loanInterest(price,down,rate,years){
    const principal=Math.max(price-down,0);
    if(principal<=0||years<=0) return 0;
    const r=rate/12,n=years*12;
    const pmt=r===0?principal/n:principal*r/(1-Math.pow(1+r,-n));
    return Math.max(pmt*n-principal,0);
  }
  function model(vehicle,S){
    S=Object.assign({},DEFAULTS,S);
    const {refYear,pts}=prep(vehicle.rows);
    const valueFn=fitValue(pts);
    const maintFn=fitTrend(pts,'maint',{floorFrac:0,capMul:3,dropZero:true});
    const insFn=fitTrend(pts,'ins',{floorFrac:0.3,capMul:1.5});
    const regFn=fitTrend(pts,'reg',{floorFrac:0.2,capMul:1.5});
    const maxAge=Math.max(...pts.map(p=>p.age));
    const newV=valueFn(0),oldV=valueFn(maxAge);
    const avgDepPerMile=Math.max(newV-oldV,0)/Math.max(maxAge*S.baselineMiles,1);
    const valuePerMile=S.valuePerMile!=null?S.valuePerMile:avgDepPerMile*S.mileWeight;
    const fuelPrice=vehicle.fuelPriceOverride!=null&&vehicle.fuelPriceOverride!==''?+vehicle.fuelPriceOverride:S.fuelPrice;
    const mpg=Math.max(+vehicle.mpg||1,1);
    const marketValue=age=>valueFn(Math.max(age,0));
    const adjValue=(age,odo)=>Math.max(0,marketValue(age)+(age*S.baselineMiles-odo)*valuePerMile);
    function ownership(buyAge,H,M){
      M=M||S.annualMiles;
      const purchase=marketValue(buyAge),startOdo=buyAge*S.baselineMiles;
      const resale=adjValue(buyAge+H,startOdo+H*M);
      const depreciation=Math.max(purchase-resale,0);
      const salesTax=purchase*S.salesTax;
      const interest=loanInterest(purchase,vehicle.down,vehicle.rate,vehicle.loanYears);
      let maint=0,fuel=0,ins=0,reg=0;
      for(let t=0;t<H;t++){
        const age=buyAge+t,infl=Math.pow(1+S.inflation,t);
        maint+=maintFn(age)*(M/S.baselineMiles)*infl;
        fuel+=M*(fuelPrice/mpg)*infl;
        ins+=insFn(age)*infl; reg+=regFn(age)*infl;
      }
      const operating=maint+fuel+ins+reg, total=depreciation+salesTax+interest+operating;
      return {buyAge,modelYear:refYear-buyAge,H,M,purchase,resale,depreciation,salesTax,interest,
        maint,fuel,ins,reg,operating,total,perYear:total/H,perMile:total/(H*M)};
    }
    function optimal(M,maxBuyAge){
      M=M||S.annualMiles; const maxBA=maxBuyAge!=null?maxBuyAge:maxAge; let best=null;
      for(let ba=0;ba<=maxBA;ba++)for(let H=1;H<=S.maxHold;H++){
        const o=ownership(ba,H,M); if(!best||o.perYear<best.perYear) best=o;
      }
      return best;
    }
    function cumulative(buyAge,H,M){
      M=M||S.annualMiles;
      const purchase=marketValue(buyAge),startOdo=buyAge*S.baselineMiles;
      const salesTax=purchase*S.salesTax,interest=loanInterest(purchase,vehicle.down,vehicle.rate,vehicle.loanYears);
      const arr=[]; let op=0;
      for(let t=1;t<=H;t++){
        const age=buyAge+t-1,infl=Math.pow(1+S.inflation,t-1);
        op+=maintFn(age)*(M/S.baselineMiles)*infl+M*(fuelPrice/mpg)*infl+insFn(age)*infl+regFn(age)*infl;
        const resale=adjValue(buyAge+t,startOdo+t*M);
        arr.push({t,cum:Math.max(purchase-resale,0)+salesTax+interest+op});
      }
      return arr;
    }
    return {refYear,maxAge,valuePerMile,marketValue,adjValue,ownership,optimal,cumulative,maintFn,insFn,regFn};
  }
  return {DEFAULTS,model,prep,loanInterest};
})();

/* ---------- Canvas line chart ---------- */
function lineChart(canvas,series,opts={}){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const cssW=canvas.clientWidth||canvas.parentElement.clientWidth||320;
  const cssH=opts.height||210;
  canvas.style.height=cssH+"px";
  canvas.width=cssW*dpr; canvas.height=cssH*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  const padL=opts.padL!=null?opts.padL:46, padR=14, padT=12, padB=26;
  const W=cssW-padL-padR, Hh=cssH-padT-padB;
  let allX=[],allY=[];
  series.forEach(s=>s.points.forEach(p=>{allX.push(p.x);allY.push(p.y);}));
  if(!allX.length){return;}
  const minX=Math.min(...allX),maxX=Math.max(...allX);
  let minY=opts.minY!=null?opts.minY:Math.min(...allY,0), maxY=Math.max(...allY);
  if(maxY===minY) maxY=minY+1;
  maxY*=1.08;
  const xToP=x=>padL+(maxX===minX?0:(x-minX)/(maxX-minX))*W;
  const yToP=y=>padT+Hh-(y-minY)/(maxY-minY)*Hh;
  // gridlines + y labels
  ctx.font="11px "+getComputedStyle(document.body).fontFamily;
  ctx.textBaseline="middle";
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const yv=minY+(maxY-minY)*i/ticks, py=yToP(yv);
    ctx.strokeStyle="#EBE7DC"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(padL+W,py); ctx.stroke();
    ctx.fillStyle="#9B9E96"; ctx.textAlign="right";
    ctx.fillText(opts.yfmt?opts.yfmt(yv):("$"+k(yv)),padL-8,py);
  }
  // x labels
  ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillStyle="#9B9E96";
  const xticks=opts.xticks||Math.min(6,maxX-minX);
  for(let i=0;i<=xticks;i++){
    const xv=minX+(maxX-minX)*i/xticks, px=xToP(xv);
    ctx.fillText((opts.xfmt?opts.xfmt(xv):Math.round(xv)),px,padT+Hh+7);
  }
  // series
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=s.width||2.5; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    s.points.forEach((p,i)=>{ const px=xToP(p.x),py=yToP(p.y); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    if(s.dash){ctx.setLineDash(s.dash);} ctx.stroke(); ctx.setLineDash([]);
    if(s.dot){ const last=s.points[s.points.length-1]; ctx.fillStyle=s.color;
      ctx.beginPath(); ctx.arc(xToP(last.x),yToP(last.y),3.4,0,7); ctx.fill(); }
  });
}

  app.querySelectorAll("[data-assume]").forEach(b=>b.onclick=()=>editAssumption(b.dataset.assume));
}

function editAssumption(key){
  const S=state.settings;
  const meta={annualMiles:["Miles driven per year","Used for every vehicle — kept identical so comparisons are fair.",1,v=>v],
    fuelPrice:["Fuel price ($ per gallon / gal-equivalent)","Applies to MPG and MPGe alike. Override per-vehicle in its Data tab.",0.01,v=>v],
    inflation:["Inflation (%)","Grows fuel, maintenance, insurance & registration each year.",0.1,v=>v/100],
    salesTax:["Sales tax (%)","One-time tax on the purchase price.",0.1,v=>v/100]};
  const m=meta[key];
  const cur=key==="inflation"||key==="salesTax"?(S[key]*100):S[key];
  const val=prompt(m[0]+"\n\n"+m[1],cur);
  if(val===null) return;
  const n=parseFloat(val); if(!isFinite(n)){toast("Enter a number");return;}
  S[key]=m[3](n); save(); render();
}

function styleRange(r){ const pct=(r.value-r.min)/(r.max-r.min)*100; r.style.setProperty("--p",pct+"%"); }
function dataRowHTML(r,i){
  return `<div class="dt-row" data-i="${i}">
    <input class="yr" data-c="0" inputmode="numeric" value="${r[0]??""}">
    <input data-c="1" inputmode="numeric" value="${r[1]??""}">
    <input data-c="2" inputmode="numeric" value="${r[2]??""}">
    <input data-c="3" inputmode="numeric" value="${r[3]??""}">
    <input data-c="4" inputmode="numeric" value="${r[4]??""}">
    <button class="dt-del" data-del="${i}" aria-label="Remove">×</button>
  </div>`;
}
function drawValueChart(v,S,M){
  const c=$("#valChart"); if(!c) return;
  const maxA=Math.max(M.maxAge+8,15);
  const mkt=[],adj=[];
  for(let a=0;a<=maxA;a++){ mkt.push({x:a,y:M.marketValue(a)}); adj.push({x:a,y:M.adjValue(a,a*S.annualMiles)}); }
  lineChart(c,[
    {color:"#14494B",points:mkt,width:2.6,dot:true},
    {color:"#C8702D",points:adj,width:2.6,dash:[5,4],dot:true}
  ],{height:200,xticks:Math.min(6,maxA),xfmt:x=>Math.round(x)+"y",yfmt:y=>"$"+k(y),minY:0});
}
function bindDataTab(v){
  const remodel=()=>{ save(); };
  const onField=(id,fn)=>{ const el=$("#"+id); if(el) el.onchange=()=>{fn(el.value);save();}; };
  onField("f_name",x=>{v.name=x||"Vehicle";});
  onField("f_mpg",x=>{v.mpg=parseFloat(x)||v.mpg;});
  onField("f_fuel",x=>{v.fuelPriceOverride=(x===""?null:parseFloat(x));});
  onField("f_loanYears",x=>{v.loanYears=parseFloat(x)||0;});
  onField("f_rate",x=>{v.rate=(parseFloat(x)||0)/100;});
  onField("f_down",x=>{v.down=parseFloat(x)||0;});
  const pt=$("#f_pt"); if(pt) pt.onchange=()=>{v.pt=pt.value;save();renderVehicle(v.id);};
  // rows
  const box=$("#rowsBox");
  box.addEventListener("change",e=>{
    const inp=e.target.closest("input[data-c]"); if(!inp) return;
    const row=inp.closest(".dt-row"); const i=+row.dataset.i; const c=+inp.dataset.c;
    const val=inp.value===""?null:parseFloat(inp.value);
    v.rows[i][c]=isFinite(val)?val:(c===0?inp.value:null); save();
  });
  box.addEventListener("click",e=>{
    const d=e.target.closest("[data-del]"); if(!d) return;
    v.rows.splice(+d.dataset.del,1); save(); renderVehicle(v.id);
  });
  $("#addRow").onclick=()=>{
    const last=v.rows[v.rows.length-1];
    const yr=last?(+last[0]-1):2025;
    v.rows.push([yr,last?last[1]:0,last?last[2]:0,last?last[3]:0,last?last[4]:0]);
    save(); renderVehicle(v.id);
  };
  $("#delVeh").onclick=()=>{
    if(confirm("Delete "+v.name+"? This can't be undone.")){
      state.vehicles=state.vehicles.filter(x=>x.id!==v.id);
      state.compare=state.compare.filter(x=>x!==v.id);
      save(); heroBuy=heroHold=null; go("garage");
    }
  };
}

let cmpHorizon=10, cmpBasis="new";
function renderCompare(){
  setBar("Compare","Side-by-side ownership",false);
  const S=state.settings;
  if(state.vehicles.length<2){
    app.innerHTML=`<div class="view"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5"/><rect x="7" y="11" width="3.4" height="8" rx="1"/><rect x="13.6" y="7" width="3.4" height="12" rx="1"/></svg><p>Add at least two vehicles to compare.</p></div></div>`;
    return;
  }
  if(!state.compare.length) state.compare=state.vehicles.slice(0,Math.min(3,state.vehicles.length)).map(v=>v.id);
  let h=`<div class="view">
    <div class="page-title">Compare</div>
    <div class="page-sub">Tap vehicles to include · same miles for a fair fight</div>
    <div class="selrow">`;
  state.vehicles.forEach((v,i)=>{
    const on=state.compare.includes(v.id); const color=PALETTE[i%PALETTE.length];
    h+=`<button class="selchip ${on?"on":""}" data-sel="${v.id}"><span class="sw" style="background:${on?color:"var(--faint)"}"></span>${esc(v.name)}</button>`;
  });
  h+=`</div>`;
  // shared controls
  h+=`<div class="card" style="margin-top:12px">
    <div class="field"><label class="lbl">Miles driven per year <span style="font-weight:400;color:var(--faint)">· shared by all</span></label>
      <div class="inp-group"><input id="cmpMiles" inputmode="numeric" class="num" value="${+S.annualMiles}"><span class="suf">mi/yr</span></div></div>
    <div class="slider-wrap" style="margin-top:4px">
      <div class="slider-top"><label class="lbl" style="margin:0">Compare over</label><span class="v num" id="czVal">${cmpHorizon} yrs</span></div>
      <input type="range" id="czR" min="3" max="20" step="1" value="${cmpHorizon}">
    </div>
    <div style="margin-top:14px"><label class="lbl">Purchase basis</label>
      <div class="seg"><button data-basis="new" class="${cmpBasis==="new"?"on":""}">Buy new (same age)</button><button data-basis="optimal" class="${cmpBasis==="optimal"?"on":""}">Each car's best buy</button></div>
    </div>
  </div>`;
  // compute
  const sel=state.compare.map(id=>vehicleById(id)).filter(Boolean);
  const rows=sel.map((v,idx)=>{
    const i=state.vehicles.findIndex(x=>x.id===v.id);
    const color=PALETTE[i%PALETTE.length];
    const M=Eng.model(v,S);
    let buyAge=0, label;
    if(cmpBasis==="optimal"){ const o=M.optimal(); buyAge=o.buyAge; label=o.modelYear+" · "+o.H+"y best"; }
    const own=M.ownership(buyAge,cmpHorizon);
    const cum=M.cumulative(buyAge,Math.max(cmpHorizon,20));
    const opt=M.optimal();
    return {v,color,M,buyAge,own,cum,opt};
  });
  // chart
  h+=`<div class="card"><h2>Cumulative cost over time</h2>
    <div class="chartbox"><canvas id="cmpChart"></canvas></div>
    <div class="legend" id="cmpLegend"></div></div>`;
  // table
  const sorted=rows.slice().sort((a,b)=>a.own.total-b.own.total);
  const bestId=sorted[0]&&sorted[0].v.id;
  h+=`<div class="card"><h2>At ${cmpHorizon} years · ${(+S.annualMiles).toLocaleString()} mi/yr</h2>
    <div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Vehicle</th><th>$/yr</th><th>$/mi</th><th>Total</th></tr></thead><tbody>`;
  sorted.forEach(r=>{
    h+=`<tr class="${r.v.id===bestId?"best":""}"><td class="car"><span class="sw" style="background:${r.color}"></span>${esc(r.v.name)}${r.v.id===bestId?'<span class="pill">CHEAPEST</span>':""}</td>
      <td class="num">${money(r.own.perYear)}</td><td class="num">${perMile(r.own.perMile)}</td><td class="num">${money(r.own.total)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  // best-buy recommendations
  h+=`<div class="card"><h2>Each car's lowest-cost plan</h2>`;
  rows.forEach(r=>{
    h+=`<div class="bd-row" style="padding:9px 0">
      <span class="swatch" style="background:${r.color};width:12px;height:12px"></span>
      <span style="flex:1;font-size:13.5px"><b>${esc(r.v.name)}</b> · buy ${r.opt.modelYear}, own ${r.opt.H}y</span>
      <span class="num" style="font-weight:600">${money(r.opt.perYear)}/yr</span></div>`;
  });
  h+=`</div></div>`;
  app.innerHTML=h;
  // events
  app.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.sel;
    if(state.compare.includes(id)){ if(state.compare.length>1) state.compare=state.compare.filter(x=>x!==id); }
    else state.compare.push(id);
    save(); renderCompare();
  });
  const cm=$("#cmpMiles"); cm.onchange=()=>{ const n=parseFloat(cm.value); if(isFinite(n)&&n>0){state.settings.annualMiles=n;save();renderCompare();} };
  const cz=$("#czR"); cz.oninput=()=>{styleRange(cz);$("#czVal").textContent=cz.value+" yrs";}; cz.onchange=()=>{cmpHorizon=+cz.value;renderCompare();}; styleRange(cz);
  app.querySelectorAll("[data-basis]").forEach(b=>b.onclick=()=>{cmpBasis=b.dataset.basis;renderCompare();});
  // draw chart
  const series=rows.map(r=>({color:r.color,width:2.6,dot:true,points:r.cum.filter(p=>p.t<=cmpHorizon).map(p=>({x:p.t,y:p.cum}))}));
  lineChart($("#cmpChart"),series,{height:215,xticks:Math.min(6,cmpHorizon-1),xfmt:x=>Math.round(x)+"y",yfmt:y=>"$"+k(y),minY:0});
  $("#cmpLegend").innerHTML=rows.map(r=>`<span class="li"><span class="sw" style="background:${r.color}"></span>${esc(r.v.name)}</span>`).join("");
}

  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=importData;
  $("#resetBtn").onclick=()=>{ if(confirm("Replace all vehicles with the original samples? Your edits will be lost.")){ state=defaultState(); save(); heroBuy=heroHold=null; toast("Reset to samples"); go("garage"); } };
  $("#aboutModel2").onclick=showModelInfo;
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="driveline-vehicles.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Exported");
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const s=JSON.parse(r.result);
    if(!s.vehicles||!Array.isArray(s.vehicles)) throw 0;
    s.settings=Object.assign({},Eng.DEFAULTS,s.settings||{}); s.compare=s.compare||[];
    state=s; save(); heroBuy=heroHold=null; toast("Imported "+s.vehicles.length+" vehicles"); go("garage");
  }catch(err){ toast("Couldn't read that file"); } };
  r.readAsText(f); e.target.value="";
}
function showModelInfo(){
  alert("How Driveline models cost\n\n• Depreciation: an exponential-decay-to-floor curve is fitted to your model-year prices, so it flattens realistically for old cars and never goes negative — better than a straight-line forecast.\n\n• Mileage-adjusted value: resale reflects both age and your actual odometer vs CarEdge's assumed mileage, so driving less keeps the car worth more.\n\n• Operating costs: fuel = miles × price ÷ MPG (works for MPGe too); maintenance scales from CarEdge's ~13,500 mi/yr baseline to your miles; insurance & registration follow their trend. All grow with inflation.\n\n• Financing: loan interest from price − down payment, your rate and term.\n\n• Total cost of ownership = depreciation + fuel + maintenance + insurance + registration + interest + sales tax − resale. The optimizer scans every buy-year and holding length to find the lowest cost per year.");
}

/* boot */
render();
window.addEventListener("resize",()=>{ if(route.view==="vehicle"&&vehTab==="overview"){const v=vehicleById(route.id);if(v)drawValueChart(v,state.settings,Eng.model(v,state.settings));} else if(route.view==="compare"){/* redraw on next render */} });
</script>
</body>
</html>
