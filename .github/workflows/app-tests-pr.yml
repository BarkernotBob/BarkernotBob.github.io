name: App tests (pull requests)

# Runs the bank-bonus and grocery Playwright suites on pull requests, so a
# change is tested (and its screenshots can be reviewed) before it reaches main.
# deploy.yml still runs every affected suite as the gate on push to main.
on:
  pull_request:
    branches: [main]
    paths:
      - 'quartz/static/bank-bonus/**'
      - 'quartz/static/shared/**'
      - 'tests/bank-bonus/**'
      - 'quartz/static/grocery/**'
      - 'tests/grocery/**'
      - 'tests/shared/**'
      - '.github/workflows/app-tests-pr.yml'

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bank-bonus, grocery]
    defaults:
      run:
        working-directory: tests/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.app }} regression suite
        run: npm test
        env:
          CI: 'true'
      - name: TEMP print screenshots
        if: ${{ !cancelled() && matrix.app == 'bank-bonus' }}
        run: for f in offers-eligibility today-overdue; do echo "B64START $f"; base64 -w0 screenshots/$f.png; echo; echo "B64END"; done
      - name: Upload screenshot gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-screenshots
          path: tests/${{ matrix.app }}/screenshots/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-playwright-report
          path: tests/${{ matrix.app }}/playwright-report/
          if-no-files-found: ignore
