<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bank Bonus Tracker</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/static/bank-bonus/manifest.webmanifest">

  <!-- iOS / iPhone PWA support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bank Bonus">
  <link rel="apple-touch-icon" href="/static/bank-bonus/apple-touch-icon.png">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#5b5bd6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#7c7cf2" media="(prefers-color-scheme: dark)">
  <style>
    /* =====================================================================
       Design system. Grounded in Stripe (type + number hierarchy), Linear
       (crisp 1px borders over heavy shadows, first-class dark mode) and Apple
       HIG (44px min touch targets, system type, 8/12/16 spacing). One token
       set; [data-theme="dark"] on <html> flips it.
       ===================================================================== */
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f1f3f5; --surface-3: #e8ebef;
      --text: #15171c; --muted: #5e636e; --faint: #8a909b;
      --border: #e6e8ee; --border-strong: #d5d9e1;
      --accent: #5b5bd6; --accent-hover: #4a4ac6; --accent-press: #3f3fb0; --on-accent: #ffffff;
      --accent-soft: rgba(91,91,214,.12);
      --open: #197a3e; --open-bg: #e6f5ec; --closed: #5e636e; --closed-bg: #eef0f3;
      --planned: #3a5bd0; --planned-bg: #e7ecfd; --danger: #d23b3b; --danger-hover: #b62f2f;
      --warn: #92670a; --warn-soft: rgba(146,103,10,.12);
      --shadow-sm: 0 1px 2px rgba(20,23,28,.06), 0 1px 1px rgba(20,23,28,.04);
      --shadow-md: 0 8px 24px rgba(20,23,28,.10);
      --radius: 14px; --radius-sm: 9px; --pill: 999px;
      --bar-h: 56px; --tab-h: 50px; --safe-top: env(safe-area-inset-top, 0px);
    }
    html[data-theme="dark"] {
      --bg: #0b0c0f; --surface: #15171c; --surface-2: #1c1f26; --surface-3: #262a33;
      --text: #e8eaed; --muted: #9aa0ab; --faint: #6c717b;
      --border: #262a32; --border-strong: #353a44;
      --accent: #7c7cf2; --accent-hover: #9090f6; --accent-press: #6a6ae6; --on-accent: #0b0c0f;
      --accent-soft: rgba(124,124,242,.18);
      --open: #45c267; --open-bg: #112619; --closed: #9aa0ab; --closed-bg: #21262d;
      --planned: #8098ff; --planned-bg: #161d3a; --danger: #f06a6a; --danger-hover: #ff8181;
      --warn: #d6a017; --warn-soft: rgba(214,160,23,.16);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 10px 28px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    /* Stop accidental mobile zoom: no double-tap zoom, no text inflation. (iOS also
       won't focus-zoom because inputs are >=16px below.) */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0; padding: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
      letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation; overflow-x: hidden; }
    #main { max-width: 940px; margin: 0 auto; padding: 24px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
    :focus-visible { outline: none; }

    /* ---- App header bar ---- */
    #appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface);
      background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border); padding: var(--safe-top) 16px 0; height: calc(var(--bar-h) + var(--safe-top));
      position: sticky; top: 0; z-index: 101; }
    .appbar-title { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .appbar-right { display: flex; align-items: center; gap: 8px; }
    #appbar-user { font-size: 13px; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { background: none; color: var(--text); border: 1px solid var(--border); border-radius: 10px;
      min-width: 40px; height: 40px; padding: 0 10px; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .icon-btn:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }

    /* ---- Tab bar (horizontally scrollable on small screens) ---- */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: calc(var(--bar-h) + var(--safe-top)); z-index: 100;
      display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 0 0 auto; background: none; border: none; padding: 0 16px; cursor: pointer; font-size: 14px; font-weight: 500;
      border-bottom: 2px solid transparent; color: var(--muted); height: var(--tab-h); white-space: nowrap; transition: color .12s; }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    nav button:hover { color: var(--text); }
    .ic { margin-right: 5px; }
    .badge { background: var(--danger); color: #fff; border-radius: var(--pill); display: inline-block; min-width: 19px; height: 19px; padding: 0 5px; text-align: center; line-height: 19px; font-size: 11px; font-weight: 600; margin-left: 5px; }
    .badge.hidden { display: none; }

    .section { display: none; animation: fadeIn 0.18s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card { background: var(--surface); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .card.clickable { cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; }
    .card.clickable:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-1px); }
    /* Left accent stripe encodes account status at a glance */
    .card.st-open { border-left: 3px solid var(--open); }
    .card.st-closed { border-left: 3px solid var(--closed); }
    .card.st-planned { border-left: 3px solid var(--planned); }
    .card-header { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .row-item { flex: 1; min-width: 130px; }
    .row-item input, .row-item select, .row-item textarea { width: 100%; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin-bottom: 5px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 600; }
    .value.money { font-variant-numeric: tabular-nums; }

    button { background: var(--accent); color: var(--on-accent); border: none; padding: 0 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 600; min-height: 42px; box-shadow: var(--shadow-sm); transition: background .12s, transform .06s; }
    button:hover { background: var(--accent-hover); }
    button:active { background: var(--accent-press); transform: translateY(1px); }
    button:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
    button.sec { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    button.sec:hover { background: var(--surface-3); border-color: var(--border-strong); }
    button.danger { background: var(--danger); color: #fff; }
    button.danger:hover { background: var(--danger-hover); }
    button.small { min-height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }

    /* 16px keeps iOS Safari from auto-zooming when a field is focused. */
    input, select, textarea { border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 16px; font-family: inherit; background: var(--surface); color: var(--text); min-height: 42px; max-width: 100%; min-width: 0; transition: border-color .12s, box-shadow .12s; }
    /* Money fields: a fixed "$" sits inside the box; the input pads left to clear it. */
    .money-field { position: relative; display: flex; align-items: center; }
    .money-field > .money-prefix { position: absolute; left: 12px; color: var(--muted); font-size: 16px; pointer-events: none; }
    .money-field > input { width: 100%; padding-left: 26px; }
    textarea { min-height: 0; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    ::placeholder { color: var(--faint); }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px); background: #1c1f26; color: #fff; padding: 12px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 1000; box-shadow: var(--shadow-md); font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-ov { position: fixed; inset: 0; background: rgba(10,12,16,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; animation: fadeIn .15s ease; }
    .modal-card { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 520px; width: 100%; box-shadow: var(--shadow-md); max-height: 90vh; overflow: auto; }
    .modal-card p { margin: 0 0 16px; }
    .modal-card input, .modal-card select { width: 100%; margin-bottom: 12px; }

    /* ---- Status pills & person tokens ---- */
    .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: var(--pill); letter-spacing: .01em; text-transform: capitalize; }
    .pill-open { color: var(--open); background: var(--open-bg); }
    .pill-closed { color: var(--closed); background: var(--closed-bg); }
    .pill-planned { color: var(--planned); background: var(--planned-bg); }
    .pill-full { color: var(--open); background: var(--open-bg); }
    .pill-partial { color: var(--warn); background: var(--warn-soft); }
    .pill-over { color: var(--danger); background: rgba(210,59,59,.12); }
    .late { font-size: 12px; font-weight: 600; color: var(--danger); }
    .elig { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
    .elig-ok { color: var(--open); }
    .elig-wait, .elig-check { color: var(--warn); }
    .deadline-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .pill-verify { color: var(--warn); background: var(--warn-soft); text-transform: none; }
    .rank-summary { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
    .rank-line { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 2px; }
    .rank-no { font-weight: 700; }
    .rank-rate { font-size: 18px; font-weight: 700; }
    .rank-uses, .rank-how { font-size: 12px; color: var(--muted); }
    .rank-warn { font-size: 12px; color: var(--warn); margin-top: 2px; }
    .rank-group { color: var(--muted); background: var(--surface-2, rgba(127,127,127,.12)); text-transform: none; }
    .rank-dim { opacity: .75; }
    .offer-notes { font-size: 13px; color: var(--muted); white-space: pre-line; margin: 6px 0 2px; }
    .person-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
    .person-dot { width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }

    /* ---- Filter bar + segmented control ---- */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .chips { display: inline-flex; flex-wrap: nowrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; background: none; border: none; color: var(--muted); border-radius: 7px; padding: 0 13px; min-height: 34px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
    .chip:hover { color: var(--text); }
    .chip.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }
    .search-input { flex: 1; min-width: 180px; }

    /* People editor */
    .people-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .person-tag { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--pill); padding: 4px 4px 4px 10px; }
    .person-x { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; min-height: 0; padding: 2px 8px; box-shadow: none; border-radius: var(--pill); }
    .person-x:hover { color: var(--danger); background: none; }

    /* Date fields: never let the native control exceed its column. */
    input[type="date"] { width: 100%; max-width: 100%; box-sizing: border-box; min-width: 0; }
    /* On touch devices (iOS/Android), the native date control has an intrinsic
       min-width that can spill past its column. Neutralizing the native appearance
       lets width:100% win; the date picker still opens on tap. */
    @media (pointer: coarse) {
      input[type="date"] { -webkit-appearance: none; appearance: none; }
    }
    /* Compact inline date pickers used inside list-card value cells. */
    input.date-quick { min-height: 34px; padding: 4px 7px; font-size: 16px; font-weight: 600; width: 100%; border-radius: 6px; }
    /* Keyboard shortcut button is useless on touch-only devices. */
    @media (pointer: coarse) { .kbd-help-btn { display: none; } }
    /* Progress bar (calendar paycheck usage) */
    .prog { height: 12px; border-radius: 7px; background: var(--surface-3); overflow: hidden; }
    .prog > i { display: block; height: 100%; border-radius: 7px; }
    .cal-bar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
    .cal-bar > i { display: block; height: 100%; }

    .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
    .empty .empty-cta { margin-top: 18px; }
    .action-bar { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---- Tables ---- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th { background: var(--surface-2); }
    th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.num { font-weight: 600; }
    tbody tr:nth-child(even) { background: var(--surface-2); }
    tbody tr:hover { background: var(--accent-soft); }

    /* ---- Summary stat strip ---- */
    .summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
    .stat .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin-bottom: 7px; font-weight: 600; }
    .stat .stat-value { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat .stat-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ---- Calendar month grid ---- */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cal-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    /* Fixed grid so arrows never move when you change months. */
    .cal-nav { display: grid; grid-template-columns: 44px 1fr 44px auto; align-items: center; gap: 8px; margin-bottom: 16px; }
    .cal-arrow { padding: 0; font-size: 20px; line-height: 1; }
    .cal-month { text-align: center; min-width: 0; }
    .cal-month-name { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-month-sub { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-today-btn { font-size: 13px; }
    .cal-hint { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day-cell { cursor: pointer; }
    .cal-day-cell:hover { border-color: var(--border-strong); }
    .cal-dot { display: none; }
    .cal-dow { font-size: 11px; color: var(--faint); text-align: center; padding: 4px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .cal-cell { min-height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 5px; font-size: 12px; background: var(--surface); }
    .cal-empty { border: none; background: transparent; }
    .cal-day { color: var(--muted); font-weight: 600; }
    .cal-cell.cal-today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .cal-cell.cal-past { opacity: .5; }
    .cal-amt { margin-top: 3px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 11px; }
    .cal-full { background: var(--open-bg); } .cal-full .cal-amt { color: var(--open); }
    .cal-partial { background: var(--warn-soft); } .cal-partial .cal-amt { color: var(--warn); }
    .cal-over { background: rgba(210,59,59,.12); } .cal-over .cal-amt { color: var(--danger); }
    /* A payday whose paycheck was set to a one-off amount: a corner mark, drawn
       over the cell so nothing inside it moves. */
    .cal-cell { position: relative; }
    .cal-bump::after, .cal-bump-key { content: ''; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--accent) transparent transparent; }
    .cal-bump::after { position: absolute; top: 0; right: 0; border-top-right-radius: 7px; }
    .cal-legend i.cal-bump-key { width: 0; height: 0; border-radius: 0; }

    /* Today-view list rows — clickable rows highlight on hover/tap. */
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 12px; font-size: 14px; }
    .list-item:last-child { border-bottom: none; }
    .list-item.clickable { cursor: pointer; border-radius: var(--radius-sm); margin: 0 -8px; padding: 11px 8px; transition: background .12s; }
    .list-item.clickable:hover { background: var(--accent-soft); }
    /* Sticky back bar in the detail view — floats below the appbar+nav so it's always visible. */
    .detail-back-bar { position: sticky; top: calc(var(--bar-h) + var(--safe-top) + var(--tab-h)); z-index: 99; padding: 8px 0 4px; background: var(--bg); }
    .checkbox { margin: 0; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
    .reminder-list { margin-top: 12px; }
    .reminder-item { background: var(--surface-2); padding: 11px 12px; border-radius: var(--radius-sm); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
    .reminder-item[data-mval] { cursor: pointer; }
    .reminder-item[data-mval]:hover { background: var(--surface-3); }
    .reminder-date { color: var(--muted); font-size: 12px; }
    kbd { background: var(--surface-2); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .sc-table td { padding: 7px 8px; border: none; }

    @media (max-width: 600px) {
      body { font-size: 15px; }
      #main { padding: 18px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
      .card { padding: 16px; }
      button { min-height: 46px; }
      input, select { min-height: 46px; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      #appbar-user { display: none; }
      /* Stack form fields to full width — no input can spill into the next column. */
      .row { flex-direction: column; gap: 14px; }
      .row-item { min-width: 0; width: 100%; }
      /* Full-width, comfortably spaced action buttons — never squished or overlapping. */
      .action-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .action-bar > button { width: 100%; }
      .filter-bar .search-input { min-width: 120px; }
      .chip { min-height: 44px; }   /* easy-tap filter segments */
      /* Calendar: tighter cells; show bar + dot, hide the money amount text. */
      .cal-nav { grid-template-columns: 44px 1fr 44px auto; gap: 6px; }
      .cal-grid { gap: 3px; }
      .cal-cell { min-height: 54px; padding: 3px; border-radius: 6px; }
      .cal-amt { display: none; }
      .cal-bar { height: 4px; }
      .cal-dot { display: block; width: 7px; height: 7px; border-radius: 50%; margin-top: 2px; }
      .cal-pay.cal-full .cal-dot { background: var(--open); }
      .cal-pay.cal-partial .cal-dot { background: var(--warn); }
      .cal-pay.cal-over .cal-dot { background: var(--danger); }
    }
  </style>
</head>
<body>

<header id="appbar">
  <div class="appbar-title">🏦 Bank Bonus Tracker</div>
  <div class="appbar-right">
    <span id="appbar-user"></span>

<script type="module">
/* =========================================================================
   Bank Bonus Tracker — one file, plus the shared helpers it imports.
   By default all data lives in this browser (localStorage). Optional GitHub
   sync stores it in the user's own private repo via their own token.
   ========================================================================= */

/* ---- Shared helpers (GAP-W5, #111) ----------------------------------------
   This is a module so it can import them. That only became possible once the
   inline on*= handlers were gone (GAP-W4, #112): a module's top-level names
   are not globals, so an `onclick="setPersonFilter(...)"` in the markup could
   not have found `setPersonFilter`.

   The local esc() this replaces did NOT escape the single quote; the shared
   one does. Read shared/text.js before reaching for it in a new place — it is
   safe for text and for quoted attribute values, and is NOT a fix for putting
   data inside an inline handler.

   starter-offers.js above stays a classic script: it is parser-blocking, so
   its global is set before this deferred module runs. ---- */
import { esc } from '/static/shared/text.js';

/* ---- Public-safe storage model ---------------------------------------------
   This app is local-first: by default ALL data lives in this browser
   (localStorage) and is never sent anywhere. There is no shared sign-in and no
   third-party server in the loop — nothing routes through anyone else's
   infrastructure.

   Cross-device sync is OPTIONAL and "bring your own token": a user pastes a
   GitHub fine-grained token scoped to their OWN private data repo. That token
   is stored only in this browser and talks directly to api.github.com. No
   Cloudflare Worker, no shared OAuth App, no operator who can see your token.
   ----------------------------------------------------------------------------- */

// Bump this on each deploy so the Settings footer shows which build is live —
// lets you confirm a phone isn't serving a cached old copy.
const BUILD = '2026-11-25 · r16';

const LS = {
  get repo(){ return localStorage.getItem('bb_repo') || '' },
  set repo(v){ localStorage.setItem('bb_repo', v) },
  get token(){ return localStorage.getItem('bb_token') || '' },
  set token(v){ localStorage.setItem('bb_token', v) },
  get me(){ return localStorage.getItem('bb_me') || '' },
  set me(v){ localStorage.setItem('bb_me', v) },
  get login(){ return localStorage.getItem('bb_login') || '' },      // GitHub username (from OAuth)
  set login(v){ localStorage.setItem('bb_login', v) },
  get method(){ return localStorage.getItem('bb_method') || '' },    // 'token' (GitHub sync) or ''
  set method(v){ localStorage.setItem('bb_method', v) },
};

/* Where data is read/written:
     'local'  — this browser only (default; no account, no network)
     'github' — synced to the user's own private repo via their own token
   The token (when present) persists in localStorage indefinitely — a user
   connects once per device and stays connected until they explicitly disconnect. */
const STORE = {
  get mode(){
    const m = localStorage.getItem('bb_store_mode');
    if(m) return m;
    // Migrate installs from before local-first: if this device already has a
    // saved token + repo (an earlier connected version), keep syncing instead
    // of silently flipping to a fresh local store.
    if(localStorage.getItem('bb_token') && localStorage.getItem('bb_repo')) return 'github';
    return 'local';
  },
  set mode(v){ localStorage.setItem('bb_store_mode', v) },
};
const LKEY = path => 'bb_local_' + path;   // localStorage key for a data file

const API = 'https://api.github.com';
const DB = {};

// --------- UI helpers ---------
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const el = (tag, attrs={}, html='') => {
  const e = document.createElement(tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html !== '') e.innerHTML = html;
  return e;
};
const money = n => (n == null || isNaN(n)) ? '—' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// Money INPUT helpers: format with thousands separators (no forced decimals) for
// display in a text field, and parse back to a number tolerating "$" and commas.
function parseMoney(str){
  if(str == null) return null;
  const c = String(str).replace(/[^0-9.\-]/g, '');
  if(c === '' || c === '-' || c === '.') return null;
  const n = parseFloat(c);
  return isNaN(n) ? null : n;
}
function fmtMoneyInput(v){
  if(v == null || v === '') return '';
  const n = Number(v);
  if(isNaN(n)) return '';
  return n.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
}
function reformatMoney(elm){ const n = parseMoney(elm.value); elm.value = (n == null ? '' : fmtMoneyInput(n)); }
// "Today" in the user's configured timezone (not the browser/UTC day), so
// date-based alerts don't roll over a day early/late.
function todayISO(){
  const tz = (typeof config !== 'undefined' && config && config.timezone) || 'America/New_York';
  try {
    return new Intl.DateTimeFormat('en-CA', {timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  } catch(e) {
    return new Date().toISOString().split('T')[0];
  }
}
// Shift an ISO date by N days (anchored at noon UTC to dodge DST edges).
function shiftISO(iso, days){
  const d = new Date(iso + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().split('T')[0];
}
// Format a stored ISO date (YYYY-MM-DD) for DISPLAY as MM/DD/YY. Storage and
// all date math stay ISO; this only affects what the user sees. Returns ''
// for empty/invalid input so callers can fall back to a placeholder.
function fmtDate(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return m[2] + '/' + m[3] + '/' + m[1].slice(2);
}

function toast(msg, ms=2600){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}

// --------- Theme (light / dark) ---------
function applyTheme(){
  const stored = localStorage.getItem('bb_theme');
  const dark = stored ? stored === 'dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = $('#themeBtn'); if(btn) btn.textContent = dark ? '☀️' : '🌙';
}
function toggleTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  localStorage.setItem('bb_theme', dark ? 'light' : 'dark');
  applyTheme();
}

// --------- Status pills & person tokens ---------
function statusPill(status){
  const s = (status||'').toLowerCase();
  const cls = s==='open'?'pill-open':s==='closed'?'pill-closed':'pill-planned';
  return `<span class="pill ${cls}">${esc(s||'—')}</span>`;
}
// Stable color per person name, so each person reads as the same chip everywhere.
const PERSON_PALETTE = ['#0969da','#1a7f37','#9a3fb0','#bc4c00','#0a7ea3','#a8431e','#6e40c9','#2d7d46'];
function personColor(name){
  let h = 0; const s = String(name||'');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return PERSON_PALETTE[h % PERSON_PALETTE.length];
}
function personChip(name){
  if(!name) return '';
  const initial = String(name).trim().charAt(0).toUpperCase() || '?';
  return `<span class="person-chip"><span class="person-dot" style="background:${personColor(name)}">${esc(initial)}</span>${esc(name)}</span>`;
}

// --------- Current visible tab helpers (for keyboard shortcuts) ---------
function currentTab(){
  const s = document.querySelector('.section.active');
  return s ? s.id.replace('section-','') : '';
}
function modalOpen(){ return !!document.querySelector('.modal-ov:not([data-closing])'); }

// --------- Keyboard shortcuts ---------
const TAB_KEYS = {'t':'today','a':'active','p':'planned','o':'offers','c':'calendar','r':'reports','s':'settings'};
function showShortcuts(){
  modal(`<p><strong>⌨ Keyboard shortcuts</strong></p>
    <table class="sc-table" style="width:100%;font-size:13px">
      <tr><td><kbd>T</kbd><kbd>A</kbd><kbd>P</kbd><kbd>O</kbd><kbd>C</kbd><kbd>R</kbd><kbd>S</kbd></td><td>Jump to <u>T</u>oday / <u>A</u>ctive / <u>P</u>lanned / <u>O</u>ffers / <u>C</u>alendar / <u>R</u>eports / <u>S</u>ettings</td></tr>
      <tr><td><kbd>n</kbd></td><td>New — account (Active/Planned) or offer (Offers)</td></tr>
      <tr><td><kbd>s</kbd></td><td>Save changes (while editing an account)</td></tr>
      <tr><td><kbd>e</kbd></td><td>Edit — focus the first field (while editing an account)</td></tr>
      <tr><td><kbd>/</kbd></td><td>Focus the search box (Active / Planned)</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Exit a text field, close a dialog, or go back from an account</td></tr>
      <tr><td><kbd>?</kbd></td><td>Show this help</td></tr>
    </table>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button data-mval="ok">Got it</button></div>`);
}
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const activeTag = (document.activeElement && document.activeElement.tagName) || '';
  const inInput = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';
  // Escape: blur focused input first; if nothing focused, close modal or go back.
  if(e.key === 'Escape'){
    if(inInput && !modalOpen()){ document.activeElement.blur(); return; }
    if(modalOpen()){ const o = document.querySelector('.modal-ov:not([data-closing])'); if(o && o._esc) o._esc(); return; }
    if(currentTab() === 'detail'){ backFromDetail(); }
    return;
  }
  // Don't hijack keys while typing or while a dialog is open.
  if(inInput || modalOpen()) return;

  const tab = currentTab();
  // Tab nav keys (TAPOCRS). In detail view, 's' means save — don't switch tabs.
  if(TAB_KEYS[e.key] && !(tab === 'detail' && (e.key === 's' || e.key === 'e'))){ show(TAB_KEYS[e.key]); return; }
  if(e.key === '?'){ showShortcuts(); return; }
  if(e.key === 'n'){
    if(tab === 'offers') addOffer();
    else if(tab === 'active' || tab === 'planned') addAccount(tab === 'active' ? 'open' : 'planned');
    return;
  }
  if(e.key === '/' && (tab === 'active' || tab === 'planned')){
    const s = document.querySelector(`#section-${tab} .search-input`); if(s){ e.preventDefault(); s.focus(); }
    return;
  }
  if(tab === 'detail'){
    if(e.key === 's'){ e.preventDefault(); saveAccountDetail(); }
    else if(e.key === 'e'){ const f = document.querySelector('#section-detail input, #section-detail select, #section-detail textarea'); if(f){ e.preventDefault(); f.focus(); } }
  }
});

function modal(innerHtml){
  return new Promise(resolve => {
    const o = el('div', {class:'modal-ov'});
    o.innerHTML = `<div class="modal-card">${innerHtml}</div>`;
    // Detach AFTER the caller has resumed, not before. Callers that collect
    // input (addAccount, addOffer) read their fields on the line after
    // `await modal(...)`; removing the overlay here left them reading `.value`
    // off null, which threw and silently created nothing. Hide it now so the
    // UI still responds instantly, resolve (the caller resumes as a microtask,
    // fields still attached), then remove on the next macrotask.
    const close = (val) => {
      if(o._done) return;
      o._done = true;
      o.style.visibility = 'hidden';
      o.style.pointerEvents = 'none';
      // It stays in the DOM for one macrotask (above), so mark it: modalOpen()
      // and the Esc handler must not find this closed overlay and treat a
      // chained modal's Escape as already handled.
      o.setAttribute('data-closing', '');
      resolve(val);
      setTimeout(() => o.remove(), 0);
    };
    o._esc = () => close(null);   // let the global Esc handler cancel this modal
    o.addEventListener('click', e => { if(e.target===o) close(null); });
    document.body.appendChild(o);
    const focusEl = o.querySelector('[autofocus]') || o.querySelector('input, select, textarea');
    // Only if focus hasn't already moved into the dialog: a late focus() would
    // pull a fast typist (or a test) back to the first field mid-entry.
    if(focusEl) setTimeout(() => { if(!o.contains(document.activeElement)) focusEl.focus(); }, 30);
    o.querySelectorAll('[data-mval]').forEach(b => b.addEventListener('click', () => close(b.getAttribute('data-mval'))));
    o.querySelectorAll('[data-mcancel]').forEach(b => b.addEventListener('click', () => close(null)));
  });
}

function confirmModal(message, okLabel='OK', danger=false){
  return modal(`<p style="margin:0 0 14px">${esc(message)}</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="${danger?'danger':''}" data-mval="yes">${esc(okLabel)}</button></div>`)
    .then(v=>v==='yes');
}

function uid(p){ return p + '_' + Math.floor(Date.now()/1000) + '_' + Math.random().toString(36).slice(2,6); }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(b64))); }

// --------- GitHub API ---------
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + LS.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

/* =========================================================================
   GITHUB SYNC  (optional, bring-your-own-token — no shared server)
   The user pastes a fine-grained token scoped to their own private data repo.
   We validate it, then either pull the repo's existing data or seed the repo
   from what's already in this browser. The token lives only in localStorage.
   ========================================================================= */

// Connect this device to a GitHub data repo. On success, future reads/writes
// go to GitHub and the token persists until the user disconnects.
async function connectGitHub(repo, token){
  repo = (repo||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'');
  token = (token||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast('Repo must look like  your-username/bank-bonus-data'); return false; }
  if(!token){ toast('Paste your GitHub token'); return false; }

  // Validate the token against this repo without committing to github mode yet.
  let who = '';
  try{
    const u = await fetch(`${API}/user`, {headers: ghHead(token)});
    if(u.ok){ who = (await u.json()).login || ''; }
    const r = await fetch(`${API}/repos/${repo}`, {headers: ghHead(token)});
    if(r.status === 404) throw new Error('Repo not found — create a private repo named bank-bonus-data first, and make sure the token can see it.');
    if(r.status === 401 || r.status === 403) throw new Error('Token rejected — check it has Contents: Read and write on this repo.');
    if(!r.ok) throw new Error('GitHub error '+r.status);
  }catch(e){ toast('Could not connect: '+(e.message||e)); return false; }

  // Commit to github mode, then reconcile data.
  LS.repo = repo; LS.token = token; LS.login = who; LS.method = 'token';
  const prevMode = STORE.mode; STORE.mode = 'github';
  try{
    const existing = await ghContents('db/config.json');   // null if the repo has no data yet
    if(existing === null){
      // Empty repo → push whatever this browser currently has (first device).
      // config.json goes last: its presence is what marks a repo as seeded, so a
      // seed cut short is redone on the next connect rather than loaded half-empty.
      await saveJson('db/accounts.json', accounts, 'Seed accounts from device');
      await saveJson('db/offers.json', offers, 'Seed offers from device');
      await saveJson('db/config.json', config, 'Seed config from device');
      toast('Connected — your data is now synced to GitHub ✓');
    } else {
      toast('Connected — loaded the data already in your repo ✓');
    }
  }catch(e){
    STORE.mode = prevMode;                                  // roll back on failure
    // Forget the half-made connection too, or a reload would start in github
    // mode against a repo whose seed never finished.
    if(prevMode !== 'github') ['bb_repo','bb_token','bb_login','bb_method'].forEach(k => localStorage.removeItem(k));
    toast('Connected but sync failed: '+(e.message||e));
    return false;
  }
  await init();
  return true;
}

// Stop syncing on this device and return to local-only. The GitHub repo keeps
// its data untouched; we just forget the token here.
async function disconnectGitHub(){
  if(!await confirmModal('Disconnect GitHub sync on this device? Your synced data stays safe in your repo; this browser switches back to its own local copy.','Disconnect',true)) return;
  localStorage.removeItem('bb_token'); localStorage.removeItem('bb_login'); localStorage.removeItem('bb_method');
  STORE.mode = 'local';
  toast('Disconnected — back to local-only');
  init();
}

// Headers for an arbitrary token (used while validating, before we store it).
function ghHead(token){
  return { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}

async function ghContents(path){
  const r = await fetch(`${API}/repos/${LS.repo}/contents/${path}`, {headers: ghHeaders()});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}

async function ghPut(path, contentB64, sha, message){
  const body = { message, content: contentB64 };
  if(sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${LS.repo}/contents/${path}`, {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if(!r.ok){ const err = new Error(`Save failed ${r.status}`); err.status = r.status; throw err; }
  return r.json();
}

async function loadJson(path, fallback){
  // Local-first: read from this browser unless GitHub sync is on.
  if(STORE.mode !== 'github'){
    const raw = localStorage.getItem(LKEY(path));
    if(raw == null){
      const v = JSON.parse(JSON.stringify(fallback));
      DB[path] = {value: v, sha: null, base: null};
      return v;
    }
    const value = JSON.parse(raw);
    DB[path] = {value, sha: null, base: raw};
    return value;
  }
  try {
    const c = await ghContents(path);
    if(c === null){
      DB[path] = {value: JSON.parse(JSON.stringify(fallback)), sha: null, base: null};
      return DB[path].value;
    }
    const text = b64decode(c.content);
    const value = JSON.parse(text);
    DB[path] = {value, sha: c.sha, base: text};
    return value;
  } catch(e) {
    console.error('Error loading', path, e);
    throw e;
  }
}

// ---- Saving (issue #11) ----
// Saves to one file run one at a time, in order, so two quick saves never reuse
// the same file version. Each save sends the data as it is when its turn comes.
// On a real conflict (the file changed elsewhere since this device last read or
// wrote it) the whole list is NEVER re-sent over the newer version: this
// device's changes are merged record by record with the other change, and if
// both changed the same record, the newer data is loaded and the user is told.
// Any failure puts the screen back to what is actually saved, says so, and
// fails the saves queued behind it rather than letting them report success.
// Actions that change more than one file go through saveBatch, below, which
// writes them all in one commit or none of them (issue #17).
const DATA_VARS = {
  'db/config.json':   { get: () => config,   set: v => { config = v; } },
  'db/accounts.json': { get: () => accounts, set: v => { accounts = v; } },
  'db/offers.json':   { get: () => offers,   set: v => { offers = v; } },
};
const saveQueues = {};
const saveGen = {};   // bumped whenever a file's in-memory copy is replaced after a failure

class SaveError extends Error {
  constructor(msg){ super(msg); this.name = 'SaveError'; this.userMessage = msg; }
}

function saveJson(path, value, message){
  const gen = saveGen[path] || 0;
  const prev = saveQueues[path] || Promise.resolve();
  const run = prev.catch(() => {}).then(() => {
    if((saveGen[path] || 0) !== gen)
      throw new SaveError("Not saved, because an earlier change couldn't be saved. Please redo it.");
    return saveJsonNow(path, value, message);
  });
  saveQueues[path] = run;
  return run;
}

function currentValue(path, fallback){
  const v = DATA_VARS[path];
  return v ? v.get() : fallback;
}

function setValue(path, value){
  const v = DATA_VARS[path];
  if(v) v.set(value);
}

// Re-draw after data was replaced. The account detail form holds its own copy
// of the fields, so leave it rather than let a later Save write stale values.
function rerenderCurrent(){
  const tab = currentTab();
  if(tab === 'detail'){ show(lastTab); return; }
  const fn = RENDERERS[tab];
  if(fn) fn();
}

// Replace the in-memory copy of `path` with saved data (text) after a failure.
function replaceWithSaved(path, text, sha){
  const value = JSON.parse(text);
  setValue(path, value);
  DB[path] = {value, sha, base: text};
  saveGen[path] = (saveGen[path] || 0) + 1;
  rerenderCurrent();
}

async function saveJsonNow(path, fallbackValue, message){
  const value = currentValue(path, fallbackValue);
  const body = JSON.stringify(value, null, 2);
  if(STORE.mode !== 'github'){
    localStorage.setItem(LKEY(path), body);
    DB[path] = {value, sha: null, base: body};
    return;
  }
  const entry = DB[path] || {sha: null, base: null};
  try {
    const res = await ghPut(path, b64encode(body), entry.sha, message);
    DB[path] = {value, sha: res.content.sha, base: body};
    return;
  } catch(e) {
    const conflict = e.status === 409 || (e.status === 422 && !entry.sha);
    if(conflict) return resolveConflict(path, entry, value, body, message);
    // The write may have landed even though the reply was lost: check first.
    let c = null;
    try { c = await ghContents(path); } catch(_) {}
    const remoteText = c ? b64decode(c.content) : null;
    if(remoteText === body){
      DB[path] = {value, sha: c.sha, base: body};
      return;
    }
    if(remoteText != null){
      replaceWithSaved(path, remoteText, c.sha);
      throw new SaveError(`Couldn't save (${e.message}). Your last change was undone.`);
    }
    if(entry.base != null){
      replaceWithSaved(path, entry.base, entry.sha);
      throw new SaveError(`Couldn't save (${e.message}). Your last change was undone.`);
    }
    throw new SaveError(`Couldn't save (${e.message}). Reload to see what is saved.`);
  }
}

async function resolveConflict(path, entry, local, localText, message){
  let c;
  try { c = await ghContents(path); }
  catch(e){
    if(entry.base != null) replaceWithSaved(path, entry.base, entry.sha);
    throw new SaveError(`Couldn't save (${e.message}). Your last change was undone.`);
  }
  const remoteText = c ? b64decode(c.content) : null;
  const remote = remoteText != null ? JSON.parse(remoteText) : null;
  const base = entry.base != null ? JSON.parse(entry.base) : null;
  const merged = mergeThreeWay(base, local, remote);
  if(!merged.ok){
    // Both sides changed the same record: keep the other change, drop ours.
    if(remoteText != null) replaceWithSaved(path, remoteText, c.sha);
    throw new SaveError('This changed on another device, so I loaded the latest. Please redo your last change.');
  }
  const body = JSON.stringify(merged.value, null, 2);
  let res;
  try {
    res = await ghPut(path, b64encode(body), c ? c.sha : null, message + ' (merged)');
  } catch(e) {
    if(remoteText != null) replaceWithSaved(path, remoteText, c.sha);
    throw new SaveError(`Couldn't save (${e.message}). I loaded the latest; please redo your last change.`);
  }
  // Keep any edit made on this device while the merge was in flight: fold the
  // live data onto what was just saved, with what we sent as the common base.
  const live = currentValue(path, local);
  const folded = mergeThreeWay(JSON.parse(localText), live, merged.value);
  const next = folded.ok ? folded.value : merged.value;
  setValue(path, next);
  DB[path] = {value: next, sha: res.content.sha, base: body};
  // Redraw only when the other device's changes are visible.
  if(body !== localText) rerenderCurrent();
}

// ---- All-or-nothing saves across files (issue #17) ----
// Promoting an offer changes accounts and offers together; saving them one at a
// time could leave the account made but the offer still in the backlog. A batch
// waits behind every queued save to its files, then writes them as ONE commit
// (Git Data API: blobs -> tree -> commit -> move main), so either every file
// changes or none does. A file changed elsewhere is merged record by record as
// in a single save; a race on main is retried; a failure puts every file in the
// batch back to what is saved.
function saveBatch(paths, message){
  const gens = paths.map(p => saveGen[p] || 0);
  const prev = Promise.all(paths.map(p => (saveQueues[p] || Promise.resolve()).catch(() => {})));
  const run = prev.then(() => {
    if(paths.some((p, i) => (saveGen[p] || 0) !== gens[i]))
      throw new SaveError("Not saved, because an earlier change couldn't be saved. Please redo it.");
    return saveBatchNow(paths, message);
  });
  paths.forEach(p => { saveQueues[p] = run; });
  return run;
}

let branchCache = {repo: null, name: null};   // the data repo's default branch, per repo
async function dataBranch(){
  if(branchCache.repo !== LS.repo)
    branchCache = {repo: LS.repo, name: (await ghJson('')).default_branch || 'main'};
  return branchCache.name;
}
// Did `sha` land on the branch? True if it is the head or behind it.
async function commitLanded(sha, branch){
  let now = null;
  try { now = (await ghJson(`/git/ref/heads/${branch}`)).object.sha; } catch(_) { return false; }
  if(now === sha) return true;
  try {
    const cmp = await ghJson(`/compare/${sha}...${now}`);
    return cmp.status === 'ahead' || cmp.status === 'identical';
  } catch(_) { return false; }
}
async function ghJson(path, opts = {}){
  const r = await fetch(`${API}/repos/${LS.repo}${path}`, {cache: 'no-store', ...opts,
    headers: {...ghHeaders(), ...(opts.body ? {'Content-Type': 'application/json'} : {})}});
  if(!r.ok){ const err = new Error(`GitHub ${r.status}`); err.status = r.status; throw err; }
  return r.json();
}
const ghPost = (path, body, method = 'POST') => ghJson(path, {method, body: JSON.stringify(body)});

// Put every file in the batch back to its last saved copy after a failure. A
// file with no saved copy on this device can't be put back from memory, so
// reload everything from storage instead.
function revertBatch(paths, latest = {}){
  let reload = false;
  paths.forEach(p => {
    if(latest[p]) return replaceWithSaved(p, latest[p].text, latest[p].sha);
    const e = DB[p];
    if(e && e.base != null) return replaceWithSaved(p, e.base, e.sha);
    saveGen[p] = (saveGen[p] || 0) + 1;
    reload = true;
  });
  if(reload) setTimeout(() => init(), 0);
}

async function saveBatchNow(paths, message){
  const items = paths.map(p => { const value = currentValue(p); return {path: p, value, body: JSON.stringify(value, null, 2)}; });
  if(STORE.mode !== 'github'){
    const old = paths.map(p => localStorage.getItem(LKEY(p)));
    try { items.forEach(it => localStorage.setItem(LKEY(it.path), it.body)); }
    catch(e){
      paths.forEach((p, i) => { try { old[i] == null ? localStorage.removeItem(LKEY(p)) : localStorage.setItem(LKEY(p), old[i]); } catch(_){} });
      revertBatch(paths);
      throw new SaveError(`Couldn't save (${e.message}). Your last change was undone.`);
    }
    items.forEach(it => { DB[it.path] = {value: it.value, sha: null, base: it.body}; });
    return;
  }
  const latest = {};   // remote copies read along the way, for a revert
  try {
    const branch = await dataBranch();
    const refPath = `/git/refs/heads/${branch}`;
    for(let attempt = 0; attempt < 5; attempt++){
      if(attempt) await new Promise(r => setTimeout(r, 250 * attempt));
      const head = (await ghJson(`/git/ref/heads/${branch}`)).object.sha;
      const treeSha = (await ghJson(`/git/commits/${head}`)).tree.sha;
      const tree = await ghJson(`/git/trees/${treeSha}?recursive=1`);
      const shaAt = {};
      (tree.tree || []).forEach(e => { if(e.type === 'blob') shaAt[e.path] = e.sha; });
      // Work out what to write for each file: ours as is, or merged with a change
      // made elsewhere since this device last synced it.
      const plan = [];
      for(const it of items){
        const entry = DB[it.path] || {sha: null, base: null};
        let remoteSha = shaAt[it.path];
        if(remoteSha === undefined && tree.truncated){
          const c = await ghContents(it.path); remoteSha = c ? c.sha : undefined;
        }
        if((remoteSha || null) === (entry.sha || null)){ plan.push({...it, out: it.value, outBody: it.body}); continue; }
        let remoteValue = null;   // the file is gone on GitHub: ours stands
        if(remoteSha){
          const remoteText = b64decode((await ghJson(`/git/blobs/${remoteSha}`)).content.replace(/\n/g, ''));
          latest[it.path] = {text: remoteText, sha: remoteSha};
          remoteValue = JSON.parse(remoteText);
        }
        const merged = mergeThreeWay(entry.base != null ? JSON.parse(entry.base) : null, it.value, remoteValue);
        if(!merged.ok){
          revertBatch(paths, latest);
          throw new SaveError('This changed on another device, so I loaded the latest. Please redo your last change.');
        }
        plan.push({...it, out: merged.value, outBody: JSON.stringify(merged.value, null, 2)});
      }
      const entries = [];
      for(const f of plan){
        const blob = await ghPost('/git/blobs', {content: b64encode(f.outBody), encoding: 'base64'});
        f.blobSha = blob.sha;
        entries.push({path: f.path, mode: '100644', type: 'blob', sha: blob.sha});
      }
      const newTree = await ghPost('/git/trees', {base_tree: treeSha, tree: entries});
      const commit = await ghPost('/git/commits', {message, tree: newTree.sha, parents: [head]});
      let moved = false;
      try {
        await ghPost(refPath, {sha: commit.sha, force: false}, 'PATCH');
        moved = true;
      } catch(e) {
        if(e.status === 422 || e.status === 409) continue;   // main moved underneath us: read it again and retry
        // The commit may have landed even though the reply was lost (and other
        // commits may already sit on top of it): check before calling it failed.
        if(!(await commitLanded(commit.sha, branch))) throw e;
        moved = true;
      }
      if(moved){
        for(const f of plan){
          if(f.outBody === f.body){ DB[f.path] = {value: f.value, sha: f.blobSha, base: f.body}; continue; }
          // Merged with another device's change: keep any edit made here meanwhile.
          const live = currentValue(f.path, f.value);
          const folded = mergeThreeWay(JSON.parse(f.body), live, f.out);
          const next = folded.ok ? folded.value : f.out;
          setValue(f.path, next);
          DB[f.path] = {value: next, sha: f.blobSha, base: f.outBody};
        }
        if(plan.some(f => f.outBody !== f.body)) rerenderCurrent();
        return;
      }
    }
    throw new Error('main kept changing');
  } catch(e) {
    if(e instanceof SaveError) throw e;
    revertBatch(paths, latest);
    throw new SaveError(`Couldn't save (${e.message}). Your last change was undone.`);
  }
}

// Three-way merge of one data file. base = last copy this device synced,
// local = this device now, remote = what GitHub has now. Lists are merged by
// record id, objects (config) by top-level key. A record changed on both sides
// in different ways is a conflict; so is anything that can't be matched up.
function mergeThreeWay(base, local, remote){
  if(remote == null) return {ok: true, value: local};
  if(base == null) return {ok: false};
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const pick = (b, l, r) => {
    if(same(l, r)) return {ok: true, v: l};
    if(same(l, b)) return {ok: true, v: r};
    if(same(r, b)) return {ok: true, v: l};
    return {ok: false};
  };
  if(Array.isArray(base) && Array.isArray(local) && Array.isArray(remote)){
    const all = [...base, ...local, ...remote];
    if(all.some(x => !x || typeof x !== 'object' || x.id == null)) return {ok: false};
    const byId = arr => new Map(arr.map(x => [x.id, x]));
    const B = byId(base), L = byId(local), R = byId(remote);
    const order = [...remote.map(x => x.id), ...local.map(x => x.id).filter(id => !R.has(id))];
    const out = [];
    for(const id of new Set(order)){
      const r = pick(B.get(id), L.get(id), R.get(id));
      if(!r.ok) return {ok: false};
      if(r.v !== undefined) out.push(r.v);
    }
    return {ok: true, value: out};
  }
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  if(isObj(base) && isObj(local) && isObj(remote)){
    const out = {};
    for(const k of new Set([...Object.keys(remote), ...Object.keys(local), ...Object.keys(base)])){
      const r = pick(base[k], local[k], remote[k]);
      if(!r.ok) return {ok: false};
      if(r.v !== undefined) out[k] = r.v;
    }
    return {ok: true, value: out};
  }
  return {ok: false};
}

// A save that fails inside a button handler must never fail silently.
function reportSaveError(e){
  console.warn('Save problem:', e && e.message);
  toast((e && e.userMessage) || ('Something went wrong: ' + ((e && e.message) || e)), 5000);
}
window.addEventListener('unhandledrejection', (ev) => {
  if(ev.reason instanceof SaveError){ ev.preventDefault(); reportSaveError(ev.reason); }
});

// --------- Tab navigation ---------
let lastTab = 'today';

function updateAppbarUser(){
  const u = $('#appbar-user'); if(!u) return;
  if(STORE.mode === 'github'){
    const who = LS.login ? '@'+LS.login : 'synced';
    u.textContent = (LS.me ? LS.me + ' · ' : '') + who;
  } else u.textContent = '';
}

// Tab -> renderer. A fixed table, not window['render_'+tab]: this script is a
// module, so its top-level functions are NOT properties of window and a
// name-based lookup silently resolves to undefined — every tab would render
// blank. Same reasoning as the ACTIONS table at the bottom of this file: names
// that come from data resolve through a table we control, never off a global.
const RENDERERS = {
  today: render_today,
  active: render_active,
  planned: render_planned,
  offers: render_offers,
  calendar: render_calendar,
  reports: render_reports,
  settings: render_settings,
  detail: render_detail,
};

function show(tab){
  $$('.section').forEach(s => s.classList.remove('active'));
  $$('.nav-btn').forEach(b => b.classList.remove('active'));
  const section = $(`#section-${tab}`);
  if(section) {
    section.classList.add('active');
    const navBtn = $(`[data-tab="${tab}"]`);
    if(navBtn){ navBtn.classList.add('active');   // detail view has no nav button
      navBtn.scrollIntoView({inline: 'center', block: 'nearest'}); }   // keep active tab visible on the scrollable mobile bar
    if(tab !== 'detail'){ lastTab = tab; localStorage.setItem('bb_tab', tab); }  // remember tab across refreshes
    const fn = RENDERERS[tab];
    if(fn) fn();
  }
  updateAppbarUser();
}

  return {owner:'Me', people:['Me'], paycheck:{amount:2000, firstDate:'2025-01-03', intervalDays:14, ddClearDays:21},
    taxRate:0.1675, laborHours:{open:0.35, adjustDD:0.15, requirements:0.5, close:0.5}, notify:[], timezone:'America/New_York'};

// First run on this device (local mode): pre-fill the browser store with a
// generic config and the starter catalog of offers, so the app opens with
// banks to work from instead of an empty screen. Runs once, ever.
function seedLocalIfNeeded(){
  if(STORE.mode === 'github') return;
  if(localStorage.getItem('bb_seeded')) return;
  if(localStorage.getItem(LKEY('db/config.json')) == null)
    localStorage.setItem(LKEY('db/config.json'), JSON.stringify(defaultConfig(), null, 2));
  if(localStorage.getItem(LKEY('db/offers.json')) == null)
    localStorage.setItem(LKEY('db/offers.json'), JSON.stringify(typeof STARTER_OFFERS !== 'undefined' ? STARTER_OFFERS : [], null, 2));
  if(localStorage.getItem(LKEY('db/accounts.json')) == null)
    localStorage.setItem(LKEY('db/accounts.json'), '[]');
  localStorage.setItem('bb_seeded', '1');
}

async function loadAll(){
  try {
    config = await loadJson('db/config.json', defaultConfig());
    accounts = await loadJson('db/accounts.json', []);
    offers = await loadJson('db/offers.json', []);
    return true;
  } catch(e) {
    toast('Error loading data: ' + e.message);
    console.error(e);
    return false;

}

// --------- Main init ---------
let loadError = '';

async function init(){
  const main = $('#main');

  // Create all sections (only once — never destroy them, or Settings becomes
  // unreachable on a load error)
  if(!$('#section-today')) {
    main.innerHTML = `
      <div id="section-today" class="section"></div>
      <div id="section-active" class="section"></div>
      <div id="section-planned" class="section"></div>
      <div id="section-offers" class="section"></div>
      <div id="section-calendar" class="section"></div>
      <div id="section-reports" class="section"></div>
      <div id="section-settings" class="section"></div>
      <div id="section-detail" class="section"></div>
    `;
  }

  // GitHub sync is on but the token is gone (e.g. cleared) — guide to Settings.
  if(STORE.mode === 'github' && (!LS.repo || !LS.token)) {
    loadError = 'GitHub sync is on but no token is saved. Reconnect below, or it will stay local-only.';
    show('settings');
    return;
  }

  // Local-first: seed the browser store on the very first run so the app opens
  // with the starter catalog instead of an empty screen.
  seedLocalIfNeeded();

  // Load data and render. On failure, fall back to Settings (which stays
  // reachable) rather than wiping the page.
  if(await loadAll()) {
    loadError = '';
    // Reopen the tab you were last on (survives a page refresh).
    const TABS = ['today','active','planned','offers','calendar','reports','settings'];
    const saved = localStorage.getItem('bb_tab');
    show(TABS.includes(saved) ? saved : 'today');
  } else {
    loadError = STORE.mode === 'github'
      ? 'Could not load from GitHub. Check your repo name and token below.'
      : 'Could not load your local data.';
    show('settings');
  }
}

// --------- Render functions ---------

// Shared "what's due today" computation — used by the Today screen, the app-icon
// badge, and the on-open notification nudge so they can never disagree.
// Everything due today OR overdue and not yet handled (issue #12): an item
// stays on Today, and in the badge, until it is dealt with. `late` is days past due.
function daysLate(iso, today){
  return Math.round((Date.parse(today + 'T12:00:00Z') - Date.parse(iso + 'T12:00:00Z')) / 86400000);
}
const sameBank = (a, b) => bankMatch(a.institution, b.institution);
// A passed reopen date is handled once the same person has a newer account at the
// same bank (planned, or opened after this one closed), or it was dismissed on Today.
// A dismissal covers only the reopen date it was made against, so moving that date
// later brings the item back when the new date arrives.
function reopenHandled(a){
  const d = a.dates || {};
  const reopen = reopenDate(a);
  if(a.reopenDismissedOn && a.reopenDismissedOn >= reopen) return true;
  const since = d.closed || d.opened || reopen || '';
  return accounts.some(b => b !== a && b.person === a.person && sameBank(a, b) &&
    (b.status === 'planned' || ((b.dates && b.dates.opened) || '') > since));
}
// ---- Deadlines (issue #14) ----
// Worked out from the terms each account already stores, never stored themselves
// (except the reopen date), so editing a date or a term moves the deadline too.
function addMonthsISO(iso, months){
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + months, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last));
  return t.toISOString().split('T')[0];
}
function deadlinesFor(a){
  const d = a.dates || {};
  const n = v => (typeof v === 'number' && v > 0) ? v : null;
  return {
    // Requirements must be met this many days after opening.
    reqDue: d.opened && n(a.daysToCompleteReq) ? shiftISO(d.opened, a.daysToCompleteReq) : null,
    // Minimum balance must be held this many days from the first deposit.
    minBalUntil: (d.firstDD || d.opened) && n(a.minBalDays) ? shiftISO(d.firstDD || d.opened, a.minBalDays) : null,
    // Same convention as the old sheet: the reopen clock runs from the bonus
    // payout (or the close date when no payout is recorded).
    reopenFrom: (d.bonusPaidOut || d.closed) && n(a.monthsTillReopen) ? addMonthsISO(d.bonusPaidOut || d.closed, a.monthsTillReopen) : null,
  };
}
// Fill in a closed account's reopen date from its terms, unless it was typed in
// by hand: a date this function set earlier (reopenAutoFrom) is kept up to date
// (or cleared when the terms no longer give one); any other date is left alone.
// Emptying a filled-in date counts as a hand edit (reopenAutoOff): it stays empty.
function fillReopenAfter(a){
  if(!a || !a.dates || a.status !== 'closed') return;
  if(!a.dates.reopenAfter && a.reopenAutoFrom){ delete a.reopenAutoFrom; a.reopenAutoOff = true; }
  if(a.reopenAutoOff) return;
  const want = deadlinesFor(a).reopenFrom;
  const auto = a.dates.reopenAfter && a.dates.reopenAfter === a.reopenAutoFrom;
  if(!want){
    if(auto){ a.dates.reopenAfter = null; delete a.reopenAutoFrom; }
    return;
  }
  if(!a.dates.reopenAfter || auto){
    a.dates.reopenAfter = want;
    a.reopenAutoFrom = want;
  }
}
// When the same person may open this bank again: the date on the account, or,
// for a closed account that was never saved since #14, the one its terms give.
// One read for Today, Offers, the cards and the daily email, so they agree.
// tools/daily_digest.py in the data repo repeats these rules for the email.
function reopenDate(a){
  const d = a.dates || {};
  if(d.reopenAfter) return d.reopenAfter;
  return a.status === 'closed' && !a.reopenAutoOff ? deadlinesFor(a).reopenFrom : null;
}
// Deadlines worth showing on Today: requirements from two weeks out until a
// month past (after that the bonus is either paid or lost), and the end of a
// minimum-balance hold from two weeks out until a week past.
function upcomingDeadlines(today){
  const out = [];
  const within = (iso, before, after) => iso && iso >= shiftISO(today, -after) && iso <= shiftISO(today, before);
  accounts.filter(a => a && a.dates && a.status === 'open').forEach(a => {
    const dl = deadlinesFor(a);
    if(!a.dates.bonusPaidOut && within(dl.reqDue, 14, 30))
      out.push({account: a, kind: 'req', date: dl.reqDue});
    if(within(dl.minBalUntil, 14, 7))
      out.push({account: a, kind: 'minbal', date: dl.minBalUntil});
  });
  return out.sort((x, y) => x.date.localeCompare(y.date));
}

// ---- Eligibility per person (issue #14) ----
// Bank names are matched loosely ("Ally Bank" = "Ally", "Langley FCU" =
// "Langley Federal Credit Union", "Navy Federal" = "Navy Federal Credit Union"),
// and an account made from an offer always matches it. A bare name matches the
// bank or the credit union of that name, but a name that says which it is keeps
// "Citizens Bank" and "Citizens FCU" apart.
function bankKey(name){
  let s = String(name || '').toLowerCase()
    .replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  let kind = '';
  if(/\b(credit union|fcu|cu)\b/.test(s)) kind = 'cu';
  else if(/\b(bank|na|n a|national association)\b/.test(s)) kind = 'bank';
  s = s.replace(/\b(federal credit union|credit union|fcu|cu)\b/g, ' ')
    .replace(/\b(bank|na|n a|national association|the)\b/g, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/ federal$/, '');   // "Navy Federal" is the credit union's short name
  return {base: s, kind};
}
function bankMatch(x, y){
  const a = bankKey(x), b = bankKey(y);
  if(!a.base || !b.base)
    return String(x || '').trim().toLowerCase() === String(y || '').trim().toLowerCase();
  return a.base === b.base && (a.kind === b.kind || !a.kind || !b.kind);
}
// {state, label}: 'has' (has one open or planned), 'wait' (eligible from a date),
// 'check' (had one before and the reopen rule isn't known), 'ok'.
function eligibility(offer, person, today = todayISO()){
  const mine = accounts.filter(a => a && a.person === person &&
    (a.offerId === offer.id || bankMatch(a.institution, offer.institution)));
  const live = mine.find(a => a.status === 'open' || a.status === 'planned');
  if(live) return {state: 'has', label: live.status === 'planned' ? 'planned' : 'has one open'};
  if(!mine.length) return {state: 'ok', label: 'eligible'};
  // The most recent past account decides: an older account's reopen date says
  // nothing about the lockout from a newer one. Without a date, it's unknown.
  const ended = a => { const d = a.dates || {}; return d.closed || d.bonusPaidOut || d.opened || ''; };
  const last = [...mine].sort((x, y) => ended(x).localeCompare(ended(y))).at(-1);
  const from = reopenDate(last);
  if(from) return from > today ? {state: 'wait', label: 'from ' + fmtDate(from)} : {state: 'ok', label: 'eligible again'};
  return {state: 'check', label: 'had one, check terms'};
}
// One line of an account's deadlines, for its card and its detail page.
function deadlineLine(a){
  const dl = deadlinesFor(a);
  const parts = [];
  if(dl.reqDue && !(a.dates || {}).bonusPaidOut) parts.push('Requirements by ' + fmtDate(dl.reqDue));
  if(dl.minBalUntil) parts.push('Keep the minimum balance until ' + fmtDate(dl.minBalUntil));
  const reopen = reopenDate(a);
  if(reopen) parts.push('Reopen after ' + fmtDate(reopen));
  return parts.length ? `<div class="deadline-line">${esc(parts.join(' · '))}</div>` : '';
}

function eligibilityLine(offer){
