window.addEventListener('load', async ()=>{
  // sync target ranges from any saved config happens after load; first handle OAuth return.
  const came = await handleOAuthRedirect();
  if(came) return;
  if(!isConfigured()){ show('settings'); return; }
  // Load BEFORE the first render, and only once. show() was previously kicked
  // off un-awaited and then loadAll() ran again alongside it, so every cold
  // start fetched all four data files twice — eight GitHub calls for four
  // files' worth of data, on a phone, before anything appeared. Loading first
  // also means the saved target ranges are applied to READINGS before the
  // first render uses them, instead of racing it.
  // Everything that reads D.config stays inside the try: on a failed load
  // (expired token, deleted repo) D.config is undefined, and updateBadges()
  // walks D.config.tasks. show() below re-attempts the load and renders the
  // error card either way.
  try{
    await loadAll();
    updateBadges();
  }catch(e){
    // Leave nothing half-loaded. loadAll() reads the four files in turn, so a
    // failure on the third still leaves D.config set — and show() skips its own
    // retry when D.config is truthy, rendering a normal-looking Today over
    // missing D.log/D.swim. The next tap would then throw out of markTask()'s
    // reach and do nothing. Clearing D forces show() to retry and surface the
    // error card instead.
    D={};
  }
  await show('today');
});

/* ---------- Click dispatch: why there are no onclick attributes here ----------
   Every button's behaviour is bound here instead of in an inline handler.

   The reason is narrow and worth keeping: a browser HTML-decodes an event
   handler attribute BEFORE parsing its contents as JavaScript. So escaping a
   value on its way into an inline markTask('<id>') call cannot help — ' becomes
   &#39;, the decode turns it straight back into a quote, and a task id that
   closes the quote and adds a comma expression runs whatever follows. There is
   no escaper that makes an interpolated value safe in an executable position;
   the value has to stop reaching one. Pool renders only data fetched from the
   GitHub Contents API, and all five apps share one origin and one
   localStorage, so a value that reaches script here hands over grocery's and
   bank-bonus's tokens too.

   In a data-* attribute esc() genuinely does close the hole, because the value
   stays data and is never parsed as code. Actions resolve through the fixed
   table below rather than off `window`, so a data-action that somehow carried a
   hostile name still can't reach anything that isn't listed. */
const ACTIONS = {
  show, markTask, editTask, editChecklist, logChecklistDone, deleteInsight,
  pickLevel, setTestMode, setGeoMode, saveTokenSetup, signInWithGitHub,
  logSwim, saveTest, lookupGeo, savePool, saveEmail, saveSeason, saveTargets,
  saveChemicals, showAiExport, importInsights, addInsightManual, saveDevice,
  signOut, deleteLog, deleteTest,
};

/* Actions that write to GitHub (#134). While one is running, a second tap on
   the same action is ignored, and its button is disabled and shows a spinner.
   Without this, two taps inside one network round trip queued two commits and
   wrote the same record twice (the pump ×3 in 1.2 s in log.json). The guard is
   keyed by action + argument, not by the DOM node, because a save can
   re-render the tab and put a brand-new button under the next tap. */
const WRITES = new Set(['markTask','logChecklistDone','logSwim','saveTest','editTask','editChecklist',
  'deleteInsight','importInsights','addInsightManual','savePool','saveEmail','saveSeason','saveTargets',
  'saveChemicals','saveTokenSetup','deleteLog','deleteTest']);
const INFLIGHT = new Set();

document.addEventListener('click', e=>{
  // closest(), not e.target: several of these buttons wrap an <svg>, so the
  // click lands on a child and a target-only check would silently do nothing.
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const name = el.getAttribute('data-action');
  const fn = ACTIONS[name];
  if(typeof fn !== 'function') return;
  const a1 = el.getAttribute('data-a1');
  const a2 = el.getAttribute('data-a2');
  // Arity is decided by which attributes are present, so a handler that takes
  // no argument is never handed a stray undefined.
  const run = () => a2 !== null ? fn(a1, a2, el) : a1 !== null ? fn(a1) : fn();
  if(!WRITES.has(name)){ run(); return; }
  const key = name + ':' + (a1 ?? '');
  if(INFLIGHT.has(key)) return;
  INFLIGHT.add(key);
  const wasDisabled = el.disabled;
  el.disabled = true; el.classList.add('busy'); el.setAttribute('aria-busy','true');
  Promise.resolve().then(run).catch(err=>toast(String(err && err.message || err))).finally(()=>{
    INFLIGHT.delete(key);
    el.classList.remove('busy'); el.removeAttribute('aria-busy');
    // A Done button that settled into "✓ Done" stays disabled (#144).
    if(el.dataset.done !== '1') el.disabled = wasDisabled;
  });
});

/* ---------- PWA: register the service worker (offline app shell) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
