    --fg:#fff2fb; --muted:#e9c6ff; --card-bg:rgba(255,255,255,.10); --card-border:rgba(255,255,255,.30);
    --wordmark:#fff2fb; --hero-accent:#2ce5d6;
    --c-games:#2ce5d6; --c-tools:#ffd24d; --c-notes:#ff5ca8; --c-yt:#b06bff;
    --card-radius:18px; --glow:1;
  }
  /* ---------- POP (bright neo-brutalist) ---------- */
  html[data-theme=&quot;pop&quot;]{
    --bg:#fff6ea; --bg-accent:none;
    --fg:#1c1430; --muted:#6b6280; --card-bg:#ffffff; --card-border:#1c1430;
    --wordmark:#1c1430; --hero-accent:#ff5a4d;
    --c-games:#ff5a4d; --c-tools:#2f7bff; --c-notes:#1fb86b; --c-yt:#ff9f1c;
    --card-radius:16px; --glow:0;
  }
  body{font-family:var(--font-body);background:var(--bg);color:var(--fg);min-height:100vh;
    background-image:var(--bg-accent);background-attachment:fixed;}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 40px 60px;}
  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:70px;}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.5px;color:var(--wordmark);display:flex;align-items:center;gap:9px;}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--hero-accent);}
  html[data-theme=&quot;pop&quot;] .dot{border:2px solid #1c1430;}
  .navlinks{display:flex;gap:24px;font-weight:600;font-size:15px;color:var(--muted);}
  /* hero */
  .hero{margin-bottom:54px;max-width:760px;}
  .kicker{font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--hero-accent);margin-bottom:18px;}
  h1{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:-2px;margin-bottom:20px;}
  h1 .pop-accent{color:var(--hero-accent);}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:620px;}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .card{position:relative;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:var(--card-radius);
    padding:26px 26px 24px;display:flex;flex-direction:column;gap:12px;min-height:172px;cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease;text-decoration:none;color:inherit;overflow:hidden;}
  html[data-theme=&quot;pop&quot;] .card{border-width:2.5px;box-shadow:6px 6px 0 #1c1430;}
  .card .ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;
    background:color-mix(in srgb, var(--accent) 22%, transparent);border:1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);}
  html[data-theme=&quot;pop&quot;] .card .ic{background:var(--accent);border:2px solid #1c1430;}
  .card h3{font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-.5px;}
  .card p{font-size:15px;line-height:1.45;color:var(--muted);}
  .card .go{margin-top:auto;font-weight:600;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:6px;}
  html[data-theme=&quot;pop&quot;] .card .go{color:#1c1430;}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);}
  html[data-theme=&quot;pop&quot;] .card .bar{display:none;}
  .card:hover{transform:translateY(-5px);}
  html[data-theme=&quot;neon&quot;] .card:hover,html[data-theme=&quot;vapor&quot;] .card:hover{box-shadow:0 0 0 1.5px var(--accent), 0 14px 40px -10px color-mix(in srgb,var(--accent) 55%, transparent);}
  html[data-theme=&quot;pop&quot;] .card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #1c1430;}
  .card.games{--accent:var(--c-games)} .card.tools{--accent:var(--c-tools)}
  .card.notes{--accent:var(--c-notes)} .card.yt{--accent:var(--c-yt)}
  .foot{margin-top:46px;font-size:14px;color:var(--muted);display:flex;gap:18px;justify-content:center;}
  /* theme label chip */
  .themechip{position:fixed;top:16px;right:18px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;padding:7px 13px;border-radius:30px;background:var(--hero-accent);color:#0a0b1e;}
&lt;/style&gt;
&lt;/head&gt;
