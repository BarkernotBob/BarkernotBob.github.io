name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Make search match within words (substring), not just word-starts
        run: |
          sed -i 's/tokenize:"forward"/tokenize:"full"/g' \
            .quartz/plugins/search/dist/index.js \
            .quartz/plugins/search/dist/components/index.js
      - name: Make the file-tree explorer a slide-over drawer (matches local preview)
        # The home page uses a click-to-open drawer, which needs the explorer in
        # its "collapsed by default" mode at all widths. custom.scss then restores
        # the always-visible sidebar on every non-home page. Keep this in sync with
        # the same patch in "Preview Website.command" / "Publish Changes.command".
        run: |
          sed -i 's/max-width: *800px/max-width: 99999px/g' \
            .quartz/plugins/explorer/dist/index.js \
            .quartz/plugins/explorer/dist/components/index.js
      - name: Teach plugins to honor the `order:` frontmatter field (list pages + sidebar)
        # Re-applied after `plugin install` wipes plugin dist edits. See patch-plugins.mjs
        # and QUARTZ_GUIDE.md → "Changing the order pages appear in".
        run: node patch-plugins.mjs
      - name: Build
        run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ---- Grocery Tracker regression gate (PRD S0) --------------------------------
  # GitHub Actions has no per-job `paths` filter, so a change-detection job decides
  # whether the Playwright suite must run. Only commits touching the grocery app,
  # its tests, this workflow, or the Quartz config trigger it — so ordinary content
  # publishes are never blocked by (or made to wait on) the browser tests.
  changes:
    runs-on: ubuntu-latest
    outputs:
      grocery: ${{ steps.filter.outputs.grocery }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        name: Detect grocery-related changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "grocery=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(quartz/static/grocery/|tests/grocery/|\.github/workflows/deploy\.yml|quartz\.config\.default\.yaml)'; then
            echo "grocery=true" >> "$GITHUB_OUTPUT"
          else
            echo "grocery=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ needs.changes.outputs.grocery == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/grocery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run grocery regression suite
        run: npm test
      - name: Upload screenshot gallery (visual-verification record)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: grocery-screenshots
          path: tests/grocery/screenshots/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: grocery-playwright-report
          path: tests/grocery/playwright-report/
          if-no-files-found: ignore

  deploy:
    # A skipped `test` (non-grocery commit) counts as pass; a failed `test` blocks
    # the deploy so red never ships. `!cancelled()` lets this run even when `test`
    # was skipped — a skipped `needs` would otherwise skip `deploy` too.
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages' deploy API intermittently returns "Deployment failed, try
      # again later." — a transient server-side error that a plain rerun clears.
      # Retry up to 3 times so publishing doesn't need a manual rerun each time.
      - name: Deploy to GitHub Pages
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait, then retry deploy (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 15
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait, then retry deploy (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
