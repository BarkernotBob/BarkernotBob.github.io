name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Make search match within words (substring), not just word-starts
        run: |
          sed -i 's/tokenize:"forward"/tokenize:"full"/g' \
            .quartz/plugins/search/dist/index.js \
            .quartz/plugins/search/dist/components/index.js
      - name: Make the file-tree explorer a slide-over drawer (matches local preview)
        # The home page uses a click-to-open drawer, which needs the explorer in
        # its "collapsed by default" mode at all widths. custom.scss then restores
        # the always-visible sidebar on every non-home page. Keep this in sync with
        # the same patch in "Preview Website.command" / "Publish Changes.command".
        run: |
          sed -i 's/max-width: *800px/max-width: 99999px/g' \
            .quartz/plugins/explorer/dist/index.js \
            .quartz/plugins/explorer/dist/components/index.js
      - name: Teach plugins to honor the `order:` frontmatter field (list pages + sidebar)
        # Re-applied after `plugin install` wipes plugin dist edits. See patch-plugins.mjs
        # and QUARTZ_GUIDE.md → "Changing the order pages appear in".
        run: node patch-plugins.mjs
      - name: Build
        run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ---- Studio editor safety gate -----------------------------------------------
  # Studio (the local "Edit Website" editor) never runs in CI and never touches
  # the build above — but its safety invariants are checked against the REAL
  # files in content/. So a content file that gains syntax Studio can't map
  # byte-for-byte fails here, before it can corrupt a page on a later edit.
  # Pure Node, no browser: ~seconds.
  studio_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - name: Run Studio safety suite
        run: npx tsx --test studio/studio.test.mts

  # ---- The gate's own gate -----------------------------------------------------
  # Checks that the change filter below still selects the suites it claims to.
  # Both failure modes it guards are silent: a suite nothing selects is SKIPPED,
  # not red, and a skipped job counts as a pass on the way to `deploy`. Pure
  # Node, no browser: ~seconds, and it runs on every push so a filter that stops
  # covering an app is caught here rather than by the outage.
  gate_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - name: Run deploy-gate suite
        run: npx tsx --test tests/workflow/deploy-gate.test.mts

  # ---- App regression gate (GAP-W2b) -------------------------------------------
  # GitHub Actions has no per-job `paths` filter, so a change-detection job decides
  # which app suites must run. Only commits touching an app, its tests, the shared
  # browser modules, this workflow, or the Quartz config trigger them — so ordinary
  # content publishes are never blocked by (or made to wait on) the browser tests.
  #
  # `filter` emits a JSON array of app names, which `test` consumes as a dynamic
  # matrix: two apps touched produces a two-leg matrix, none produces `[]` and the
  # whole job is skipped. Deliberately NOT one copy of the job per app — see
  # GAP-W1 (#108) for what copy-pasted CI steps cost here. The coverage a copy
  # would have made visible is asserted instead by tests/workflow/deploy-gate.test.mts,
  # which fails if a suite under tests/ is missing from the filter or the app list.
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Detect which app suites need to run
        run: |
          set -eu

          # Keep in step with tests/workflow/deploy-gate.test.mts, which asserts
          # this list covers every suite directory under tests/.
          ALL='grocery bank-bonus pool vehicle'

          emit() {
            if [ -z "${1:-}" ]; then
              echo 'apps=[]' >> "$GITHUB_OUTPUT"
              echo "Suites to run: none"
            else
              list=$(printf '"%s",' $1)
              printf 'apps=[%s]\n' "${list%,}" >> "$GITHUB_OUTPUT"
              echo "Suites to run: $1"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — running every suite."
            emit "$ALL"; exit 0
          fi

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # Base commit unreachable (force-push, rebase, or new branch): we
            # can't reliably scope the diff, so fail CLOSED and run everything.
            echo "Base commit unavailable — running every suite to be safe."
            emit "$ALL"; exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"; echo "$CHANGED"

          # Paths that force every suite. quartz/static/shared/ is the shared
          # browser code from GAP-W5 (#111) — all four apps import from it at
          # runtime, so an edit there can break any of them.
          if echo "$CHANGED" | grep -qE '^(quartz/static/shared/|\.github/workflows/deploy\.yml|quartz\.config\.default\.yaml)'; then
            echo "A shared path changed — running every suite."
            emit "$ALL"; exit 0
          fi

          # Per-app paths. tests/shared/ holds the GitHub API mock used by
          # grocery, bank-bonus and pool; an edit there must not let those
          # suites skip, because a skipped job counts as a pass.
          SELECTED=''
          for app in $ALL; do
            case "$app" in
              vehicle) extra='' ;;                    # no mock: vehicle makes no network calls
              *)       extra='|^tests/shared/' ;;
            esac
            if echo "$CHANGED" | grep -qE "^quartz/static/$app/|^tests/$app/$extra"; then
              SELECTED="$SELECTED $app"
            fi
          done
          emit "$(echo $SELECTED)"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # One red app must not cancel the others — a run should report every
      # failure it found, not just the first.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: tests/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      # Per-suite, not once globally: the suites pin different Playwright
      # versions and each needs its own matching browser build.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.app }} regression suite
        run: npm test
      - name: Upload screenshot gallery (visual-verification record)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-screenshots
          path: tests/${{ matrix.app }}/screenshots/
          if-no-files-found: warn
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-playwright-report
          path: tests/${{ matrix.app }}/playwright-report/
          if-no-files-found: ignore

  deploy:
    # A skipped `test` (a commit touching no app) counts as pass; a failed `test`
    # blocks the deploy so red never ships. With the matrix, "failed" means any
    # leg failed. `!cancelled()` lets this run even when `test` was skipped — a
    # skipped `needs` would otherwise skip `deploy` too. Requiring `changes` to
    # have succeeded keeps the gate fail-CLOSED: if change-detection itself
    # errors, `test` is skipped but the deploy is blocked rather than shipping
    # untested. `studio_test` and `gate_test` always run, so both must be a
    # plain success.
    needs: [build, changes, test, studio_test, gate_test]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.result == 'success' && needs.test.result != 'failure' && needs.studio_test.result == 'success' && needs.gate_test.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages' deploy API intermittently returns "Deployment failed, try
      # again later." — a transient server-side error that a plain rerun clears.
      # Retry up to 3 times so publishing doesn't need a manual rerun each time.
      - name: Deploy to GitHub Pages
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait, then retry deploy (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 15
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait, then retry deploy (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
