// --------- Offer ranking (design agreed with Isaiah, Nov 2026) ---------
// Offers are ordered by what they pay per hour of your time: the after-tax
// bonus, less any fee paid and the after-tax savings interest the parked cash
// gives up. Paycheck and float are limits, not costs. Direct deposits stay in
// the account until it closes unless sweeping them out pays more per hour.
const RANK_DEFAULTS = {minutes: {open: 30, close: 30, transfer: 15, upkeep: 30, purchase: 1, purchaseMin: 5},
  floatLimit: 25000, savingsRate: 0.04, bonusPostDays: 30};
function rankSettings(){
  const r = config.ranking || {};
  return {...RANK_DEFAULTS, ...r, minutes: {...RANK_DEFAULTS.minutes, ...(r.minutes || {})}};
}
const dollars = n => '$' + Math.round(n || 0).toLocaleString('en-US');
// Purchases the bonus itself asks for ("20 Debits", "10 debit card purchases of $5+").
function bonusPurchases(o){
  const t = o.additionalRequirements || '';
  const m = t.match(/(?<![$\d,.])(\d+)\s*(?:[a-z]+\s+){0,2}?(debit|purchase|transaction)/i);
  if(!m || +m[1] > 100) return {count: 0, min: false};
  const near = t.slice(Math.max(0, m.index - 60), m.index + m[0].length + 60);
  const min = /\$\s?\d+\s*(or more|\+|minimum|min\b)|(minimum of|at least|above|over|each of) \$/i.test(near) && !/balance/i.test(near);
  return {count: +m[1], min};
}
function avoidLabel(w){
  if(w.type === 'balance') return `keep ${dollars(w.amount)} ${w.kind === 'average' ? 'average' : 'daily'} balance`;
  if(w.type === 'deposit') return `${dollars(w.amount)} deposit a month`;
  if(w.type === 'purchases') return `${w.count || 0} purchases a month`;
  return w.text || 'other';
}
// Works out each way of doing an offer (pay or avoid the fee; leave deposits
// in or sweep them out) and keeps whichever pays most per hour.
function rankOffer(o){
  const S = rankSettings(), M = S.minutes, tax = config.taxRate || 0;
  const interval = (config.paycheck || {}).intervalDays || 14;
  const reqDays = o.daysToCompleteReq || 90;
  const fee = o.fee || {monthly: null, graceMonths: 0, avoid: []};
  const closeDay = Math.max(o.keepOpenDays || 0, fee.earlyCloseDays || 0, reqDays + (S.bonusPostDays || 0));
  const feeMonths = Math.max(0, Math.ceil(closeDay / 30) - (fee.graceMonths || 0));
  const dd = o.directDepositTotal || 0;
  const nd = dd ? (o.nbDeposits || (o.requiresMultipleDeposits ? 2 : 1)) : 0;
  const bonusDeps = Array.from({length: nd}, (_, k) => ({day: Math.min((k + 1) * interval, reqDays), amt: dd / nd}));
  const bal = o.minBalance || 0, balDays = o.minBalDays || reqDays;
  const purch = bonusPurchases(o);
  const atBonus = (o.bonus || 0) * (1 - tax);
  const lostPer = (S.savingsRate || 0) / 365 * (1 - tax);

  const avoid = (fee.avoid || []).filter(w => w && w.type);
  const choices = [];
  if(fee.monthly === 0 || feeMonths === 0) choices.push({how: fee.monthly === 0 ? 'no fee' : 'no fee (grace months)', cost: 0});
  else {
    if(fee.monthly != null) choices.push({how: `pay ${dollars(fee.monthly * feeMonths)} in fees`, cost: fee.monthly * feeMonths});
    avoid.forEach(w => choices.push({how: 'avoid it: ' + avoidLabel(w), avoid: w, cost: 0}));
    if(!choices.length) choices.push({how: 'fee not on file', cost: 0, unknown: true});
  }

  let best = null;
  for(const c of choices){
    const w = c.avoid || {};
    const feeBal = w.type === 'balance' ? (w.amount || 0) : 0;
    let deps = bonusDeps.slice(), extraMin = 0;
    if(w.type === 'deposit'){
      // Each fee month (after the grace months) needs a deposit of at least the
      // amount; a big enough bonus deposit that lands that month covers it.
      const months = Math.ceil(closeDay / 30);
      for(let m = fee.graceMonths || 0; m < months; m++){
        const hit = bonusDeps.some(d => d.amt >= (w.amount || 0) && d.day > m * 30 && d.day <= (m + 1) * 30);
        if(!hit) deps.push({day: Math.min((m + 1) * 30, closeDay), amt: w.amount || 0});
      }
    }
    if(w.type === 'purchases') extraMin = Math.max(0, feeMonths * (w.count || 0) - purch.count) * (w.minAmount ? M.purchaseMin : M.purchase);
    if(c.avoid && fee.minutes != null) extraMin = fee.minutes * feeMonths;
    const totalDD = deps.reduce((s, d) => s + d.amt, 0);
    // The balance needed: the larger of the two while the bonus balance runs,
    // then the fee balance alone until closing.
    const d1 = Math.min(balDays, closeDay), d2 = Math.max(0, closeDay - d1);
    const need = Math.max(bal, feeBal);
    const transferIn = Math.max(0, need - totalDD);
    const inDays = transferIn * d1 + Math.max(0, feeBal - totalDD) * d2;
    const base = M.open + M.close + (need ? M.upkeep : 0) + (transferIn ? M.transfer : 0)
      + purch.count * (purch.min ? M.purchaseMin : M.purchase) + extraMin;
    // Day by day: leaving deposits in parks all that has arrived; sweeping
    // keeps only what has arrived up to the balance still needed that day.
    let leaveDays = 0, sweepDays = 0;
    for(let t = 1; t <= closeDay; t++){
      const arrived = deps.reduce((s, d) => s + (d.day <= t ? d.amt : 0), 0);
      leaveDays += arrived;
      sweepDays += Math.min(arrived, t <= d1 ? need : feeBal);
    }
    const modes = [{mode: 'leave', dDays: leaveDays, peak: totalDD, extra: 0}];
    if(totalDD > need){
      modes.push({mode: 'sweep', dDays: sweepDays, peak: Math.min(totalDD, need), extra: deps.length * M.transfer});
    }
    for(const md of modes){
      const dDays = md.dDays + inDays;
      const lost = dDays * lostPer;
      const minutes = base + md.extra;
      const net = atBonus - c.cost - lost;
      const r = {perHour: net / (Math.max(minutes, 1) / 60), net, minutes, lost, paycheck: totalDD, float: md.peak + transferIn,
        transferIn, mode: md.mode, feeHow: c.how, feeUnknown: !!c.unknown, closeDay};
      if(!best || r.perHour > best.perHour) best = r;
    }
  }
  best.missingTerms = !dd && !bal && !(o.additionalRequirements || '').trim();
  return best;
}
// Cash sitting in open accounts today: deposits in so far (they stay until
// closing), or the required balance if that's more.
function floatInUse(today = todayISO()){
  return accounts.filter(a => a && a.status === 'open').reduce((s, a) => {
    const plan = a.ddPlan || [], d = a.dates || {};
    const ddIn = plan.length ? plan.filter(x => x.payrollDate && x.payrollDate <= today).reduce((t, x) => t + (x.amount || 0), 0)
      : (d.firstDD && d.firstDD <= today ? (a.directDepositTotal || 0) : 0);
    return s + Math.max(ddIn, a.minBalance || 0);
  }, 0);
}
// 0 can open now · 1 terms missing · 2 waiting to reopen · 3 already have one.
function offerGroup(o, r){
  const people = o.person ? [o.person] : (config.people || []);
  const st = people.map(p => eligibility(o, p).state);
  if(!st.length || st.includes('ok') || st.includes('check')) return r.missingTerms ? 1 : 0;
  return st.includes('wait') ? 2 : 3;
}

function computeDueToday(){
  const today = todayISO();
  const due = (iso) => !!iso && iso <= today;
  const withLate = (a, iso) => ({...a, late: daysLate(iso, today)});
  const live = accounts.filter(a => a && a.dates);
  const toOpen = live.filter(a => a.status === 'planned' && due(a.dates.plannedOpen))
    .map(a => withLate(a, a.dates.plannedOpen));
  const reopen = live.filter(a => due(reopenDate(a)) && !reopenHandled(a))
    .map(a => ({...withLate(a, reopenDate(a)), reopenOn: reopenDate(a)}));
  const toClose = live.filter(a => a.status === 'open' && due(a.dates.closed))
    .map(a => withLate(a, a.dates.closed));
  const reminders = [];
  live.forEach(a => {
    if(a.reminders) a.reminders.forEach(r => {
      if(due(r.date) && !r.done) reminders.push({...r, institution: a.institution, person: a.person, accountId: a.id, late: daysLate(r.date, today)});
    });
  });
  const byLate = (x, y) => y.late - x.late;
  [toOpen, reopen, toClose, reminders].forEach(list => list.sort(byLate));
  const ddCleared = live.filter(a => a.dates.firstDD === shiftISO(today, -1) && a.status === 'open');
  const deadlines = upcomingDeadlines(today).map(x => ({...x, late: daysLate(x.date, today)}));
  // Only a deadline falling today counts toward the badge: one still ahead is a
  // heads-up, and one already past may well be met and just awaiting the payout.
  const dueDeadlines = deadlines.filter(x => x.late === 0).length;
  return { toOpen, reopen, toClose, reminders, ddCleared, deadlines,
    count: toOpen.length + reopen.length + toClose.length + reminders.length + ddCleared.length + dueDeadlines };
}

function lateNote(late){
  if(!late) return '';
  return ` <span class="late">${late === 1 ? '1 day overdue' : late + ' days overdue'}</span>`;
}

// On-open nudge + Home Screen icon badge. Zero infrastructure: the app already
// knows what's due, so when you open it we (a) paint the count onto the app icon
// (Badging API) and (b) — if you've allowed notifications and haven't been nudged
// yet today — fire a single local notification summarizing what's due. No server,
// no push subscription; works offline. On iPhone, both require the app to be
// installed to the Home Screen and opened from that icon.
// The count on the Today tab. Kept in place at zero (hidden, not removed) so the
// tab row never shifts when the last item is dealt with.
function setNavBadge(count){
  const tab = $('[data-tab="today"]'); if(!tab) return;
  let b = tab.querySelector('.badge');
  if(!b){
    if(!count) return;
    tab.innerHTML = '<span class="ic">🗓</span>Today<span class="badge"></span>';
    b = tab.querySelector('.badge');
  }
  b.textContent = count;
  b.style.visibility = count ? '' : 'hidden';
}

// The Today-tab count and the app-icon badge (installed PWAs only; silently
// ignored elsewhere). Called on open and after every accounts save, so neither
// lags Today.
function refreshAppBadge(due){
  try {
    if(!due) due = computeDueToday();
    setNavBadge(due.count);
    if(!('setAppBadge' in navigator)) return;
    if(due.count > 0) navigator.setAppBadge(due.count); else navigator.clearAppBadge();
  } catch(e){}
}

function nudgeOnOpen(){
  let due;
  try { due = computeDueToday(); } catch(e){ return; }
  refreshAppBadge(due);
  // Local notification — only if granted, only once per day, only if something's due.
  if(due.count === 0) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const today = todayISO();
  if(localStorage.getItem('bb_last_nudge') === today) return;
  localStorage.setItem('bb_last_nudge', today);
  const parts = [];
  if(due.toOpen.length) parts.push(`${due.toOpen.length} to open`);
  if(due.reopen.length) parts.push(`${due.reopen.length} eligible to reopen`);
  if(due.toClose.length) parts.push(`${due.toClose.length} to close`);
  if(due.reminders.length) parts.push(`${due.reminders.length} reminder${due.reminders.length>1?'s':''}`);
  if(due.ddCleared.length) parts.push(`${due.ddCleared.length} DD cleared`);
  const dueDl = due.deadlines.filter(x => x.late === 0).length;
  if(dueDl) parts.push(`${dueDl} deadline${dueDl > 1 ? 's' : ''}`);
  const title = `🏦 ${due.count} need${due.count === 1 ? 's' : ''} attention`;
  const opts = { body: parts.join(' · '), tag: 'bb-due-'+today,
    icon: '/static/bank-bonus/icon-192.png', badge: '/static/bank-bonus/icon-192.png' };
  try {
    if(navigator.serviceWorker && navigator.serviceWorker.ready && navigator.serviceWorker.ready.then){
      navigator.serviceWorker.ready
        .then(r => r.showNotification(title, opts))
        .catch(() => { try { new Notification(title, opts); } catch(e){} });
    } else {
      new Notification(title, opts);
    }
  } catch(e){}
}

function render_today(){
  const section = $('#section-today');
  let html = '';

  const { toOpen, reopen, toClose, reminders, ddCleared, deadlines, count } = computeDueToday();

  if(count === 0 && !deadlines.length) {
    if(accounts.length === 0){
      // No accounts yet — point the user at the Offers catalog to get started.
      html = `<div class="empty">No accounts yet.<br>
        <span style="font-size:13px">Head to <b>Offers</b> (press <kbd>O</kbd>) and tap <b>Move to Planned</b> or <b>Open now</b> on a bank to start tracking it — or add one on <b>Active</b> / <b>Planned</b>.</span></div>`;
    } else {
      // Caught up for today, but accounts still exist — show the totals so an empty
      // Today screen is never mistaken for "my data is gone."
      const o = accounts.filter(a => a.status === 'open').length;
      const p = accounts.filter(a => a.status === 'planned').length;
      const c = accounts.filter(a => a.status === 'closed').length;
      html = `<div class="card">
        <div class="card-header">✅ Nothing due today</div>
        <p style="margin:0 0 12px;color:var(--muted)">You're all caught up. Your ${accounts.length} accounts are still here:</p>
        <div class="summary-strip" style="margin:0 0 12px">
          <div class="stat"><div class="stat-label">Open</div><div class="stat-value">${o}</div></div>
          <div class="stat"><div class="stat-label">Planned</div><div class="stat-value">${p}</div></div>
          <div class="stat"><div class="stat-label">Closed</div><div class="stat-value">${c}</div></div>
        </div>
        <div class="action-bar" style="margin:0">
          <button data-action="show" data-a1="active">View Active</button>
          <button class="sec" data-action="show" data-a1="reports">Reports</button>
          <button class="sec" data-action="show" data-a1="calendar">Calendar</button>
        </div>
      </div>`;
    }
  } else {
    if(toOpen.length) {
      html += '<div class="card"><div class="card-header">📖 Accounts to Open</div>';
      toOpen.forEach(a => {
        html += `<div class="list-item clickable" data-action="editAccount" data-a1="${esc(a.id)}"><div><strong>${esc(a.institution)}</strong> (${esc(a.person)})${lateNote(a.late)}<br><span style="font-size:12px;color:var(--muted)">${money(a.bonus)} bonus, ${money(a.directDepositTotal)} DD</span></div><span style="color:var(--faint);font-size:18px">›</span></div>`;
      });
      html += '</div>';
    }

    if(reopen.length) {
      html += '<div class="card"><div class="card-header">🔁 Eligible to Reopen</div>';
      reopen.forEach(a => {
        const since = a.late ? `since ${fmtDate(a.reopenOn)}` : 'from today';
        const note = a.status === 'open' ? `Eligible ${since}; this account is still open` : `Eligible ${since}`;
        html += `<div class="list-item clickable" data-action="editAccount" data-a1="${esc(a.id)}"><div><strong>${esc(a.institution)}</strong> (${esc(a.person)})<br><span style="font-size:12px;color:var(--muted)">${note}</span></div><div style="display:flex;align-items:center;gap:8px"><button class="sec" data-stop="1" data-action="dismissReopen" data-a1="${esc(a.id)}">Dismiss</button><span style="color:var(--faint);font-size:18px">›</span></div></div>`;
      });
      html += '</div>';
    }

    if(toClose.length) {
      html += '<div class="card"><div class="card-header">🔒 Accounts to Close</div>';
      toClose.forEach(a => {
        html += `<div class="list-item clickable" data-action="editAccount" data-a1="${esc(a.id)}"><div><strong>${esc(a.institution)}</strong> (${esc(a.person)})${lateNote(a.late)}</div><span style="color:var(--faint);font-size:18px">›</span></div>`;
      });
      html += '</div>';
    }

    if(deadlines.length) {
      html += '<div class="card"><div class="card-header">⏳ Deadlines</div>';
      deadlines.forEach(x => {
        const a = x.account;
        const what = x.kind === 'req' ? 'Requirements due' : 'Minimum balance hold ends';
        const when = x.late > 0 ? lateNote(x.late) : ` <span style="color:var(--muted)">${x.late === 0 ? 'today' : x.late === -1 ? 'tomorrow' : 'in ' + (-x.late) + ' days'}</span>`;

      html += '</div>';
    }

    if(reminders.length) {
      html += '<div class="card"><div class="card-header">⏰ Reminders</div>';
      reminders.forEach(r => {
        html += `<div class="list-item clickable" data-action="editAccount" data-a1="${esc(r.accountId)}"><div><strong>${esc(r.institution)}</strong> (${esc(r.person)})${lateNote(r.late)}<br><span style="font-size:13px">${esc(r.note)}</span></div><div style="display:flex;align-items:center;gap:8px"><button class="sec" data-stop="1" data-action="markReminderDone" data-a1="${esc(r.accountId)}" data-a2="${esc(r.id)}">Done</button><span style="color:var(--faint);font-size:18px">›</span></div></div>`;
      });
      html += '</div>';
    }

    if(ddCleared.length) {
      html += '<div class="card"><div class="card-header">✅ First DD Cleared (Yesterday)</div>';
      ddCleared.forEach(a => {
        html += `<div class="list-item clickable" data-action="editAccount" data-a1="${esc(a.id)}"><div><strong>${esc(a.institution)}</strong> (${esc(a.person)})</div><span style="color:var(--faint);font-size:18px">›</span></div>`;
      });
      html += '</div>';
    }
  }

  setNavBadge(count);
  section.innerHTML = html;
}

// Stop showing a passed reopen date on Today without opening a new account.
// Settle a Today row in place rather than redrawing, so nothing below it jumps
// under the user's finger. It drops off on the next visit to Today.
function settleRow(el, label){
  if(!el) { render_today(); return; }
  el.style.width = el.offsetWidth + 'px';
  el.disabled = true;
  el.textContent = label;
  const row = el.closest('.list-item');
  if(row){ row.style.opacity = '0.5'; row.removeAttribute('data-action'); row.classList.remove('clickable'); }
}

async function dismissReopen(el, accountId){
  const acc = accounts.find(a => a.id === accountId);
  if(!acc) return;
  acc.reopenDismissedOn = todayISO();
  await saveAccounts('Dismiss reopen: ' + acc.institution);
  settleRow(el, 'Dismissed');
  toast(acc.institution + ' dismissed');
}

async function markReminderDone(el, accountId, reminderId){
  const acc = accounts.find(a => a.id === accountId);
  if(acc && acc.reminders) {
    const rem = acc.reminders.find(r => r.id === reminderId);
    if(rem) {
      rem.done = true;
      await saveAccounts('Mark reminder done');
      settleRow(el, 'Done ✓');
      toast('Reminder marked done');
    }
  }
}

// Generate `count` paycheck dates on/after fromISO, from the config schedule.
function paycheckDates(fromISO, count){
  const pc = config.paycheck || {};
  const interval = pc.intervalDays || 14;
  let d = pc.firstDate || '2024-12-27';
  const out = [];
  let guard = 0;
  while(d < fromISO && guard < 2000){ d = shiftISO(d, interval); guard++; }
  while(out.length < count && guard < 4000){ out.push(d); d = shiftISO(d, interval); guard++; }
  return out;
}

// Total DD already allocated on a payroll date by all accounts except one
// (every entry counts, also two from one account on the same payday).
function allocatedOn(date, exceptId){
  return accounts.reduce((s, a) => {
    if(a.id === exceptId) return s;
    return (a.ddPlan || []).reduce((t, x) => t + (x.payrollDate === date ? (x.amount || 0) : 0), s);
  }, 0);
}
const isPayday = (iso) => paycheckDates(iso, 1)[0] === iso;

// --------- Paycheck amount over time ---------
// Stored as config.paycheck.amounts = [{from:'YYYY-MM-DD', amount}], sorted. This
// lets the take-home change on a date (e.g. $2000 now, $3000 in 6 months) and have
// the calendar / auto-suggest use the right amount for each payday. Migrates the
// old single `amount` + `firstDate` automatically.
function pcAmounts(){
  const pc = config.paycheck || (config.paycheck = {});
  if(!Array.isArray(pc.amounts) || pc.amounts.length === 0){
    pc.amounts = [{ from: pc.firstDate || '2000-01-01', amount: (pc.amount != null ? pc.amount : 1930) }];
  }
  pc.amounts.sort((a, b) => a.from.localeCompare(b.from));
  return pc.amounts;
}
// The usual take-home paycheck in effect on a given date.
function usualPaycheckOn(dateISO){
  const arr = pcAmounts();
  let amt = arr[0].amount;
  for(const e of arr){ if(e.from <= dateISO) amt = e.amount; else break; }
  return amt;
}
// One payday whose paycheck differs from the usual (a bonus check, overtime),
// set from that day on the Calendar: config.paycheck.bumps = {'YYYY-MM-DD': amount}.
// A one-off only counts while its date is still a payday on the schedule.
function paycheckBump(dateISO){
  const b = (config.paycheck || {}).bumps;
  return b && typeof b[dateISO] === 'number' && isPayday(dateISO) ? b[dateISO] : null;
}
// How full a payday is, compared in cents so sums of cent amounts aren't "over".
function payState(alloc, cap){
  const a = Math.round(alloc * 100), c = Math.round(cap * 100);
  return a > c ? 'over' : a === c ? 'full' : 'partial';
}
// What a payday actually pays: its one-off amount if set, else the usual.
function paycheckAmountOn(dateISO){
  const bump = paycheckBump(dateISO);
  return bump != null ? bump : usualPaycheckOn(dateISO);
}

// ---- Direct deposit planning (issue #16) ----
// Same rules as the old sheet's Calendar tab, with Isaiah's changes (2026-11-25):
// one paycheck pays every account; the first deposit lands on the first payday
// at least ddClearDays after opening, the last on or before the requirement
// deadline; the earliest deadline gets first claim on each paycheck; "N deposits"
// splits the total evenly (total / N); amounts set by hand stay put. Only
// suggested entries (auto: true) on today or later are ever replaced.
function ddWindow(a){
  const d = a.dates || {};
  const open = d.opened || d.plannedOpen;
  if(!open) return null;
  const clear = (config.paycheck || {}).ddClearDays;
  const first = paycheckDates(shiftISO(open, typeof clear === 'number' ? clear : 21), 1)[0];
  const end = a.daysToCompleteReq > 0 ? shiftISO(open, a.daysToCompleteReq) : null;
  return {first, end};
}
const ddPlanned = (a) => (a.ddPlan || []).reduce((s, x) => s + (x.amount || 0), 0);

// Re-plan the suggested deposits of `focus` and of every other account that
// already has suggested deposits ahead, earliest deadline first. Returns
// {short: [{account, amount}]} for accounts that can't reach their total in time.
function planDeposits(focus, today = todayISO()){
  const live = a => (a.status === 'planned' || a.status === 'open') && (a.directDepositTotal || 0) > 0 &&
    !(a.dates || {}).bonusPaidOut;
  const group = accounts.filter(a => a && live(a) && ddWindow(a) &&
    (a === focus || (a.ddPlan || []).some(x => x.auto && x.payrollDate >= today)));
  group.forEach(a => { a.ddPlan = (a.ddPlan || []).filter(x => !(x.auto && x.payrollDate >= today)); });
  const wins = new Map(group.map(a => [a, ddWindow(a)]));
  const key = a => (wins.get(a) || {}).end || '9999-12-31';
  group.sort((x, y) => key(x).localeCompare(key(y)) || ((wins.get(x) || {}).first || '').localeCompare((wins.get(y) || {}).first || ''));
  const short = [];
  const cents = v => Math.round(v * 100) / 100;
  group.forEach(a => {
    const w = wins.get(a);
    const need = a.directDepositTotal;
    const n = a.nbDeposits > 1 ? Math.floor(a.nbDeposits) : 1;
    const per = cents(need / n);
    let remaining = cents(need - ddPlanned(a));
    let made = (a.ddPlan || []).length;
    const start = w.first > today ? w.first : paycheckDates(today, 1)[0];
    for(const d of paycheckDates(start, 60)){
      if(remaining <= 0 || (w.end && d > w.end)) break;
      if(a.ddPlan.some(x => x.payrollDate === d)) continue;   // one deposit per payday per account
      const free = cents(paycheckAmountOn(d) - allocatedOn(d, null));
      // The n-th deposit takes what's left, so rounding never adds an extra one.
      const amt = cents(Math.min(remaining, free, made < n - 1 ? per : remaining));
      if(amt <= 0) continue;
      a.ddPlan.push({payrollDate: d, amount: amt, auto: true});
      made++;
      remaining = cents(remaining - amt);
    }
    a.ddPlan.sort((x, y) => x.payrollDate.localeCompare(y.payrollDate));
    if(remaining > 0) short.push({account: a, amount: remaining});
  });
  return {short};
}

// Build one month's 7-column grid. Always renders 6 week-rows (42 day cells) so
// the calendar is the SAME height every month — switching months never shifts
// anything below it. Payroll days are colored and tappable for a breakdown.
function calMonthGrid(ym, allocByDate, today){
  const [y, m] = ym.split('-').map(Number);
  const startDow = new Date(Date.UTC(y, m-1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-cell cal-empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${ym}-${String(d).padStart(2,'0')}`;
    const alloc = allocByDate[iso];
    let cls = 'cal-cell cal-day-cell';
    if(iso < today) cls += ' cal-past';
    if(iso === today) cls += ' cal-today';
    const bump = paycheckBump(iso);
    if(bump != null) cls += ' cal-bump';
    let inner = `<div class="cal-day">${d}</div>`;
    if(alloc != null){
      const cap = paycheckAmountOn(iso);
      const st = payState(alloc, cap);
      cls += ' cal-pay cal-' + st;
      const pct = cap > 0 ? Math.min(100, Math.round(alloc / cap * 100)) : 100;
      const fill = st === 'over' ? 'var(--danger)' : st === 'full' ? 'var(--open)' : 'var(--warn)';
      inner += `<div class="cal-amt">${money(alloc)}</div><div class="cal-bar"><i style="width:${pct}%;background:${fill}"></i></div><span class="cal-dot"></span>`;
    }
    cells += `<div class="${cls}" data-action="calDay" data-a1="${esc(iso)}">${inner}</div>`;
  }
  // Pad trailing cells out to a full 6 rows (42 cells) for constant height.
  const filled = startDow + daysInMonth;
  for(let i=filled;i<42;i++) cells += '<div class="cal-cell cal-empty"></div>';
  return `<div class="cal-grid">${dows}${cells}</div>`;
}

// Tracks which calendar month the user came from when drilling into a bank detail.
let calReturnMonth = null;

// Tap a calendar day → modal listing every direct deposit planned that day.
// Each bank row has a "View →" button that drills into the account detail.
async function calDay(iso){
  const items = [];
  accounts.forEach(a => (a.ddPlan || []).forEach(dd => {
    if(dd.payrollDate === iso) items.push({inst: a.institution, person: a.person, amount: dd.amount, id: a.id});
  }));
  const cap = paycheckAmountOn(iso);
  const total = items.reduce((s,x) => s + x.amount, 0);
  const label = new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone:'UTC'});
  let body = `<p style="margin:0 0 14px"><strong>${esc(label)}</strong></p>`;
  const payday = isPayday(iso);
  if(payday){
    const usual = usualPaycheckOn(iso);
    const note = cap !== usual ? ` <span style="color:var(--muted)">(usually ${money(usual)})</span>` : '';
    body += `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px">
        <span>Paycheck: <strong>${money(cap)}</strong>${note}</span>
        <button class="sec small" data-mval="setpay">Change this paycheck</button>
      </div>`;
  }
  if(items.length === 0){
    body += `<p style="color:var(--muted);margin:0 0 18px">No direct deposits planned on this day.</p>`;
  } else {
    body += '<div class="reminder-list" style="margin:0 0 14px">';
    items.sort((a,b) => b.amount - a.amount).forEach(x => {
      body += `<div class="reminder-item" data-mval="goto_${x.id}">
        <div style="display:flex;align-items:center;gap:8px">${personChip(x.person)} <strong>${esc(x.inst)}</strong></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="value money">${money(x.amount)}</span>
          <span style="color:var(--faint);font-size:18px">›</span>
        </div>
      </div>`;
    });
    body += '</div>';
    const st = payState(total, cap);
    const pct = cap > 0 ? Math.min(100, Math.round(total / cap * 100)) : 100;
    const free = Math.max(0, cap - total);
    const fill = st === 'over' ? 'var(--danger)' : st === 'full' ? 'var(--open)' : 'var(--warn)';
    body += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px">
        <span style="font-weight:600">${money(total)} of ${money(cap)}</span>
        <span class="pill pill-${st}">${st}</span>
      </div>
      <div class="prog"><i style="width:${pct}%;background:${fill}"></i></div>
      <p style="margin:6px 0 18px;font-size:13px;color:var(--muted)">${pct}% of paycheck used · ${money(free)} still free${st === 'over' ? ' · over by ' + money(total - cap) : ''}</p>`;
  }
  body += `<div class="row" style="justify-content:flex-end;margin:0"><button data-mval="ok">Close</button></div>`;
  const result = await modal(body);
  if(result === 'setpay') return setPaydayAmount(iso);
  if(result && result.startsWith('goto_')){
    calReturnMonth = iso.slice(0, 7);
    editAccount(result.slice(5));
  }
}

// Set one payday's paycheck when it isn't the usual amount (issue #16). Setting it
// back to the usual amount, or leaving it empty, clears the one-off.
async function setPaydayAmount(iso){
  const usual = usualPaycheckOn(iso);
  const cur = paycheckAmountOn(iso);
  const label = new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
  const r = await modal(`<p style="margin:0 0 6px"><strong>Paycheck on ${esc(label)}</strong></p>
    <p style="margin:0 0 12px;font-size:13px;color:var(--muted)">For one payday only, like a bonus check. Usually ${money(usual)}; change that in Settings.</p>
    <div class="money-field" style="margin-bottom:14px"><span class="money-prefix">$</span><input type="text" inputmode="decimal" id="pay_amt" value="${esc(fmtMoneyInput(cur))}" data-blur="reformatMoney"></div>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button data-mval="save">Save</button></div>`);
  if(r !== 'save') return;
  const amt = parseMoney($('#pay_amt').value);
  if(amt != null && amt <= 0){ toast('Enter a paycheck above $0'); return; }
  const pc = config.paycheck || (config.paycheck = {});
  const bumps = {...(pc.bumps || {})};
  if(amt == null || amt === usual) delete bumps[iso]; else bumps[iso] = amt;
  pc.bumps = bumps;
  try { await saveConfig('Set paycheck for ' + iso); render_calendar(); toast(amt == null || amt === usual ? 'Back to the usual paycheck' : 'Paycheck set to ' + money(amt)); }
  catch(e){ toast('Save error: ' + e.message); }
}

// Which month the Calendar is showing (YYYY-MM). Defaults to the current month;
// the ‹ › buttons step back/forward and "Today" jumps home.
let calMonth = null;
function shiftMonth(ym, delta){
  let [y, m] = ym.split('-').map(Number);
  m += delta;
  while(m < 1){ m += 12; y--; }
  while(m > 12){ m -= 12; y++; }
  return y + '-' + String(m).padStart(2, '0');
}
function calNav(delta){ calMonth = shiftMonth(calMonth || todayISO().slice(0,7), delta); render_calendar(); }
function calToday(){ calMonth = todayISO().slice(0,7); render_calendar(); }

// Click "Over-allocated" stat → list every over-budget payday with drill-in to each account.
async function showOverAllocated(){
  const allocByDate = {};
  accounts.forEach(a => (a.ddPlan||[]).forEach(dd => {
    allocByDate[dd.payrollDate] = (allocByDate[dd.payrollDate]||0) + dd.amount;
  }));
  const overDates = Object.keys(allocByDate).filter(d => payState(allocByDate[d], paycheckAmountOn(d)) === 'over').sort();
  if(overDates.length === 0){ toast('No over-allocated dates — you\'re good!'); return; }
  let body = `<p style="margin:0 0 14px"><strong>${overDates.length} over-allocated payday(s)</strong></p>`;
  overDates.forEach(d => {
    const total = allocByDate[d];
    const cap = paycheckAmountOn(d);
    const excess = total - cap;
    const label = new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
    const dayAccts = [];
    accounts.forEach(a => (a.ddPlan||[]).forEach(dd => {
      if(dd.payrollDate === d) dayAccts.push({inst: a.institution, amount: dd.amount, id: a.id});
    }));
    body += `<div class="reminder-item" style="flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;width:100%;align-items:center">
        <strong>${esc(label)}</strong>
        <span class="pill pill-over">over by ${money(excess)}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${dayAccts.map(x => `<button class="sec small" data-mval="goto_${x.id}">${esc(x.inst)} ${money(x.amount)}</button>`).join('')}
      </div>
    </div>`;
  });
  body += `<div class="row" style="justify-content:flex-end;margin:8px 0 0"><button data-mval="ok">Close</button></div>`;
  const result = await modal(body);
  if(result && result.startsWith('goto_')){
    calReturnMonth = calMonth;
    editAccount(result.slice(5));
  }
}

// Click "Upcoming" stat → jump the calendar to the first month with a future payday.
function calJumpUpcoming(){
  const today = todayISO();
  const allocByDate = {};
  accounts.forEach(a => (a.ddPlan||[]).forEach(dd => {
    allocByDate[dd.payrollDate] = (allocByDate[dd.payrollDate]||0) + dd.amount;
  }));
  const next = Object.keys(allocByDate).filter(d => d >= today).sort()[0];
  if(!next){ toast('No upcoming paychecks scheduled'); return; }
  calMonth = next.slice(0, 7);
  render_calendar();
}

function render_calendar(){
  const section = $('#section-calendar');
  const today = todayISO();
  if(!calMonth) calMonth = today.slice(0,7);   // open on the current month

  // Sum each payroll date's allocation across all accounts.
  const allocByDate = {};
  accounts.forEach(a => (a.ddPlan || []).forEach(dd => {
    allocByDate[dd.payrollDate] = (allocByDate[dd.payrollDate] || 0) + dd.amount;
  }));
  const dates = Object.keys(allocByDate).sort();
  const totalPlanned = dates.reduce((s,d) => s + allocByDate[d], 0);
  const upcoming = dates.filter(d => d >= today).length;
  const overCount = dates.filter(d => payState(allocByDate[d], paycheckAmountOn(d)) === 'over').length;

  const [yy, mm] = calMonth.split('-').map(Number);
  const monthName = new Date(Date.UTC(yy, mm-1, 1)).toLocaleString('en-US', {month:'long', year:'numeric', timeZone:'UTC'});
  const monthTotal = dates.filter(d => d.slice(0,7) === calMonth).reduce((s,d) => s + allocByDate[d], 0);

  // The nav uses a FIXED grid and an always-present Today button + subtitle line,
  // so stepping between months never moves the arrows or resizes the controls.
  let html = `<div class="summary-strip">
      <div class="stat clickable" data-action="showCalTotalDD" style="cursor:pointer"><div class="stat-label">Total planned DD</div><div class="stat-value">${money(totalPlanned)}</div><div class="stat-sub">${dates.length} payday(s) · tap for breakdown</div></div>
      <div class="stat clickable" data-action="calJumpUpcoming" style="cursor:pointer"><div class="stat-label">Upcoming</div><div class="stat-value">${upcoming}</div><div class="stat-sub">payday(s) ahead · tap to jump</div></div>
      <div class="stat clickable" data-action="showOverAllocated" style="cursor:pointer;${overCount>0?'border-left:3px solid var(--danger)':''}"><div class="stat-label">Over-allocated</div><div class="stat-value" style="${overCount>0?'color:var(--danger)':''}">${overCount}</div><div class="stat-sub">${overCount>0?'tap to fix':'all good'}</div></div>
    </div>
    <div class="cal-legend">
      <span><i style="background:var(--open-bg)"></i> Full</span>
      <span><i style="background:var(--warn-soft)"></i> Partial</span>
      <span><i style="background:rgba(210,59,59,.18)"></i> Over</span>
      <span><i style="outline:2px solid var(--accent);outline-offset:-2px"></i> Today</span>
      <span><i class="cal-bump-key"></i> Different paycheck</span>
    </div>
    <div class="card">
      <div class="cal-nav">
        <button class="sec cal-arrow" data-action="calNav" data-a1="-1" aria-label="Previous month">‹</button>
        <div class="cal-month">
          <div class="cal-month-name">${esc(monthName)}</div>
          <div class="cal-month-sub">${monthTotal > 0 ? money(monthTotal) + ' planned' : 'No deposits this month'}</div>
        </div>
        <button class="sec cal-arrow" data-action="calNav" data-a1="1" aria-label="Next month">›</button>
        <button class="sec cal-today-btn" data-action="calToday">Today</button>
      </div>
      ${calMonthGrid(calMonth, allocByDate, today)}
      <p class="cal-hint">Tap any day to see what's planned.</p>
    </div>`;
  section.innerHTML = html;
}

let reportPerson = 'all';
function setReportPerson(p){ reportPerson = p; render_reports(); }

function render_reports(){
  const section = $('#section-reports');

  const open = accounts.filter(a => a.status === 'open');
  const closed = accounts.filter(a => a.status === 'closed');
  const planned = accounts.filter(a => a.status === 'planned');

  // Gross income per account = bonus + referral
  const gross = a => (a.bonus || 0) + (a.referralValue || 0);
  const sum = arr => arr.reduce((s, a) => s + gross(a), 0);

  const taxRate = config.taxRate || 0;
  const afterTax = v => v * (1 - taxRate);

  // A bonus is earned once it's paid out, even if the account is still open
  // (kept for its minimum period). Closed accounts count as earned as before.
  // A payout date in the future is an expectation, not money received.
  const todayStr = todayISO();
  const isPaid = a => !!(a.dates && a.dates.bonusPaidOut && a.dates.bonusPaidOut <= todayStr);
  const earnedAccts = accounts.filter(a => a.status === 'closed' || (a.status === 'open' && isPaid(a)));
  const pendingAccts = open.filter(a => !isPaid(a));
  const paidOpen = earnedAccts.length - closed.length;
  const earned = sum(earnedAccts);
  const pending = sum(pendingAccts);
  const plannedTot = sum(planned);
  const total = earned + pending + plannedTot;

  const hrs = config.laborHours || {};
  const perOpen = (hrs.open || 0.35) + (hrs.requirements || 0.5);
  const perClosed = (hrs.open || 0.35) + (hrs.requirements || 0.5) + (hrs.close || 0.5);
  // Realized + in-progress effort (planned accounts not yet worked)
  const totalHours = open.length * perOpen + closed.length * perClosed;
  const afterTaxRealized = afterTax(earned + pending);

  const pct = (taxRate * 100).toFixed(2);

  // Headline numbers up top.
  let html = `<div class="summary-strip">
      <div class="stat"><div class="stat-label">Total projected (after-tax)</div><div class="stat-value">${money(afterTax(total))}</div><div class="stat-sub">${money(total)} gross · ${accounts.length} accounts</div></div>
      <div class="stat"><div class="stat-label">Earned</div><div class="stat-value">${money(afterTax(earned))}</div><div class="stat-sub">${earnedAccts.length} paid or closed</div></div>
      <div class="stat"><div class="stat-label">Pending</div><div class="stat-value">${money(afterTax(pending))}</div><div class="stat-sub">${pendingAccts.length} open, unpaid</div></div>
      <div class="stat"><div class="stat-label">After-tax $/hr</div><div class="stat-value">${money(afterTaxRealized / Math.max(totalHours, 1))}</div><div class="stat-sub">${totalHours.toFixed(1)}h invested</div></div>
    </div>`;

  html += '<div class="card" style="padding:0"><div class="card-header" style="padding:16px 16px 0">Bonuses (gross → after-tax)</div>';
  html += '<div class="table-wrap"><table><thead><tr><th></th><th class="num">Gross</th><th class="num">After-tax</th><th class="num">#</th></tr></thead><tbody>';
  html += `<tr><td>Earned (paid or closed)</td><td class="num">${money(earned)}</td><td class="num">${money(afterTax(earned))}</td><td class="num">${earnedAccts.length}</td></tr>`;
  html += `<tr><td>Pending (open, unpaid)</td><td class="num">${money(pending)}</td><td class="num">${money(afterTax(pending))}</td><td class="num">${pendingAccts.length}</td></tr>`;
  html += `<tr><td>Planned</td><td class="num">${money(plannedTot)}</td><td class="num">${money(afterTax(plannedTot))}</td><td class="num">${planned.length}</td></tr>`;
  html += `<tr style="font-weight:700"><td>Total projected</td><td class="num">${money(total)}</td><td class="num">${money(afterTax(total))}</td><td class="num">${accounts.length}</td></tr>`;
  html += '</tbody></table></div>';
  html += `<div style="font-size:12px;color:var(--muted);padding:8px 16px 16px">${paidOpen ? `Earned includes ${paidOpen} paid bonus${paidOpen === 1 ? '' : 'es'} on accounts still open. ` : ''}After-tax applies your ${pct}% marginal rate to bonus + referral income.</div>`;
  html += '</div>';

  html += '<div class="card"><div class="card-header">Effort & return</div><div class="row">';
  html += `<div class="row-item"><div class="label">Est. hours (opened)</div><div class="value">${totalHours.toFixed(1)}h</div></div>`;
  html += `<div class="row-item"><div class="label">After-tax realized+pending</div><div class="value money">${money(afterTaxRealized)}</div></div>`;
  html += `<div class="row-item"><div class="label">After-tax $/hr</div><div class="value money">${money(afterTaxRealized / Math.max(totalHours, 1))}/hr</div></div>`;
  html += '</div></div>';

  // All-accounts table, filterable by person.
  const personChips = ['all', ...(config.people || [])].map(p =>
    `<button class="chip ${reportPerson===p?'active':''}" data-action="setReportPerson" data-a1="${esc(p)}">${p==='all'?'Everyone':esc(p)}</button>`).join('');
  const rows = accounts.filter(a => reportPerson==='all' || a.person===reportPerson);

  html += '<div class="card" style="padding:0"><div class="card-header" style="padding:16px 16px 0">All accounts</div>';
  html += `<div style="padding:0 16px 12px"><div class="chips">${personChips}</div></div>`;
  html += '<div class="table-wrap"><table><thead><tr><th>Institution</th><th>Person</th><th>Status</th><th class="num">Bonus</th><th class="num">Referral</th><th class="num">APY</th></tr></thead><tbody>';
  rows.forEach(a => {
    let apy = '—';
    if (a.minBalance && a.minBalance > 0 && a.minBalDays && a.minBalDays > 0) {
      const afterTaxBonus = (a.bonus || 0) * (1 - taxRate);
      apy = `${(afterTaxBonus / a.minBalance * 365 / a.minBalDays * 100).toFixed(1)}%`;
    }
    html += `<tr><td>${esc(a.institution)}</td><td>${personChip(a.person)}</td><td>${statusPill(a.status)}</td><td class="num">${money(a.bonus)}</td><td class="num">${a.referralValue ? money(a.referralValue) : '—'}</td><td class="num">${apy}</td></tr>`;
  });
  html += '</tbody></table></div></div>';

  section.innerHTML = html;
}

// "Connect & sync": validate the repo+token and switch this device to GitHub
// sync (connectGitHub reconciles the data and re-inits).
async function saveSettings(){
  const repoEl = $('#set_repo'), tokenEl = $('#set_token');
  if(repoEl && tokenEl){

  }

// On-device notification permission: the button shown in Settings reflects the
// current browser permission state, and the click handler requests it.
function notifButtonHTML(){
  if(!('Notification' in window))
    return `<p style="margin:0;color:var(--muted);font-size:13px">This browser doesn't support notifications. The app-icon badge may still appear on an installed app.</p>`;
  if(Notification.permission === 'granted')
    return `<p style="margin:0;color:var(--muted);font-size:13px">✅ Notifications are on. You'll get a nudge for anything due when you open the app.</p>`;
  if(Notification.permission === 'denied')
    return `<p style="margin:0;color:var(--muted);font-size:13px">🔕 Notifications are blocked in your browser/site settings. Re-allow them for this site to get nudges.</p>`;
  return `<button data-action="enableNotifications">🔔 Turn on notifications</button>`;
}
async function enableNotifications(){
  if(!('Notification' in window)){ toast('Notifications not supported here'); return; }
  try {
    const p = await Notification.requestPermission();
    render_settings();
    if(p === 'granted'){ toast('Notifications on ✓'); nudgeOnOpen(); }
    else toast('Notifications not enabled');
  } catch(e){ toast('Could not enable notifications'); }
}

// --------- Local backup / restore (works in local or synced mode) ---------
function exportData(){
  const blob = new Blob([JSON.stringify({ config, accounts, offers, exportedFrom: 'bank-bonus-tracker', version: 1 }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bank-bonus-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}

async function importData(input){
  const file = input.files && input.files[0];
  input.value = '';   // allow re-importing the same file later
  if(!file) return;
  if(!await confirmModal('Import this backup? It REPLACES the accounts, offers, and settings currently on this device.', 'Import', true)) return;
  try {
    const data = JSON.parse(await file.text());
    if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.offers) || typeof data.config !== 'object'){
      throw new Error('Not a Bank Bonus Tracker backup file');
    }
    config = data.config; accounts = data.accounts; offers = data.offers;
    await saveBatch(['db/config.json', 'db/accounts.json', 'db/offers.json'], 'Import backup');
    toast('Backup imported ✓');
    init();
  } catch(e){
    if(e instanceof SaveError){ reportSaveError(e); init(); return; }   // show what is actually saved
    toast('Import failed: ' + (e.message || e));
  }
}

async function saveRankingSettings(){
  const n = (id, dflt) => { const v = parseFloat($('#' + id).value); return isNaN(v) || v < 0 ? dflt : v; };
  const D = RANK_DEFAULTS, M = D.minutes;
  const float = parseMoney($('#rk_float').value);
  config.ranking = {
    minutes: {open: n('rk_open', M.open), close: n('rk_close', M.close), transfer: n('rk_transfer', M.transfer),
      upkeep: n('rk_upkeep', M.upkeep), purchase: n('rk_purchase', M.purchase), purchaseMin: n('rk_purchaseMin', M.purchaseMin)},
    floatLimit: float == null || float < 0 ? D.floatLimit : float,
    savingsRate: n('rk_rate', D.savingsRate * 100) / 100,
    bonusPostDays: n('rk_post', D.bonusPostDays),
  };
  try {
    await saveConfig('Update offer ranking settings');
    toast('Ranking settings saved');
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

async function savePaycheckSettings(){
  const pc = config.paycheck || (config.paycheck = {});
  pc.intervalDays = parseInt($('#set_interval').value) || 14;
  pc.firstDate = $('#set_firstdate').value.trim();
  pc.ddClearDays = parseInt($('#set_ddclear').value) || 21;
  pcAmounts();   // ensure the amounts list exists; it's the source of truth for amount
  try {
    await saveConfig('Update paycheck settings');
    toast('Paycheck settings saved');
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

// Add / remove a take-home amount that takes effect on a date.
async function addPaycheckAmount(){
  const from = $('#pa_from').value;
  const amount = parseMoney($('#pa_amount').value);
  if(!from || amount == null){ toast('Pick an effective date and amount'); return; }
  const pc = config.paycheck || (config.paycheck = {});
  const arr = pcAmounts();
  const existing = arr.find(e => e.from === from);
  if(existing) existing.amount = amount; else arr.push({ from, amount });
  arr.sort((a, b) => a.from.localeCompare(b.from));
  pc.amount = arr[arr.length - 1].amount;   // keep legacy field = latest
  try { await saveConfig('Update paycheck amount'); render_settings(); toast('Saved'); }
  catch(e){ toast('Error: ' + e.message); }
}
async function removePaycheckAmount(i){
  const arr = pcAmounts();
  if(arr.length <= 1){ toast('Keep at least one amount'); return; }
  if(!await confirmModal('Remove this paycheck amount?', 'Remove', true)) return;
  arr.splice(i, 1);
  config.paycheck.amount = arr[arr.length - 1].amount;
  try { await saveConfig('Remove paycheck amount'); render_settings(); }
  catch(e){ toast('Error: ' + e.message); }
}

// People list (drives every Person dropdown).
async function addPerson(){
  const v = ($('#new_person').value || '').trim();
  if(!v) return;
  if(!config.people) config.people = [];
  if(config.people.includes(v)){ toast('Already in the list'); return; }
  config.people.push(v);
  try { await saveConfig('Add person: ' + v); render_settings(); toast(v + ' added'); }
  catch(e){ toast('Error: ' + e.message); }
}
async function removePerson(p){
  if(!await confirmModal('Remove "' + p + '"? Existing accounts keep their label, but you won\'t be able to pick this person for new ones.', 'Remove', true)) return;
  config.people = (config.people || []).filter(x => x !== p);
  try { await saveConfig('Remove person: ' + p); render_settings(); }
  catch(e){ toast('Error: ' + e.message); }
}

// Runs the data repo's daily-alert workflow now, which sends a test email even
// on a day with nothing new.
async function testNotification(){
  if(STORE.mode !== 'github' || !LS.token || !LS.repo){ toast('Connect GitHub sync first'); return; }
  try {
    const r = await fetch(`${API}/repos/${LS.repo}/actions/workflows/daily-alert.yml/dispatches`, {
      method: 'POST', headers: ghHeaders(),
      body: JSON.stringify({ ref: await dataBranch(), inputs: { test: 'true' } })
    });
    if(r.status === 204){ toast('Test email on its way. Check your inbox in a minute or two 📧'); }
    else { const j = await r.json().catch(() => ({})); toast('Could not send the test: ' + (j.message || ('HTTP ' + r.status))); }
  } catch(e){ toast('Error: ' + e.message); }
}

// Read every field input back into the in-memory account object, so edits are
// never lost when the detail view re-renders (e.g. after adding a reminder).
function captureFields(){
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const gv = id => { const e = $('#' + id); return e ? e.value : undefined; };
  const gs = id => { const v = gv(id); return v === undefined ? undefined : v.trim(); };
  const gn = id => { const v = gv(id); if(v === undefined) return undefined; const c = String(v).replace(/[^0-9.\-]/g, ''); if(c === '' || c === '-' || c === '.') return null; const n = parseFloat(c); return isNaN(n) ? null : n; };
  const gd = id => { const v = gv(id); return v === undefined ? undefined : (v.trim() === '' ? null : v.trim()); };

  if(gs('d_institution') !== undefined) a.institution = gs('d_institution');
  if(gv('d_person') !== undefined) a.person = gv('d_person');
  if(gv('d_status') !== undefined && gv('d_status') !== 'move_offers') a.status = gv('d_status');
  if(gn('d_bonus') !== undefined) a.bonus = gn('d_bonus');
  if(gn('d_referralValue') !== undefined) a.referralValue = gn('d_referralValue');
  if(gn('d_directDepositTotal') !== undefined) a.directDepositTotal = gn('d_directDepositTotal');
  if(gn('d_nbDeposits') !== undefined) a.nbDeposits = gn('d_nbDeposits');
  if(gn('d_minBalance') !== undefined) a.minBalance = gn('d_minBalance');
  if(gn('d_minBalDays') !== undefined) a.minBalDays = gn('d_minBalDays');
  if(gn('d_daysToCompleteReq') !== undefined) a.daysToCompleteReq = gn('d_daysToCompleteReq');
  if(gn('d_monthsTillReopen') !== undefined) a.monthsTillReopen = gn('d_monthsTillReopen');
  if(gs('d_bonusTiming') !== undefined) a.bonusTiming = gs('d_bonusTiming');
  if(gs('d_avoidFees') !== undefined) a.avoidFees = gs('d_avoidFees');
  if(gs('d_additionalRequirements') !== undefined) a.additionalRequirements = gs('d_additionalRequirements');
  if(gs('d_notes') !== undefined) a.notes = gs('d_notes');

  if(gd('d_date_plannedOpen') !== undefined) a.dates.plannedOpen = gd('d_date_plannedOpen');
  if(gd('d_date_opened') !== undefined) a.dates.opened = gd('d_date_opened');
  if(gd('d_date_firstDD') !== undefined) a.dates.firstDD = gd('d_date_firstDD');
  if(gd('d_date_bonusPaidOut') !== undefined) a.dates.bonusPaidOut = gd('d_date_bonusPaidOut');
  if(gd('d_date_closed') !== undefined) a.dates.closed = gd('d_date_closed');
  if(gd('d_date_reopenAfter') !== undefined) a.dates.reopenAfter = gd('d_date_reopenAfter');
  fillReopenAfter(a);   // issue #14: every path that saves the detail page goes through here
}

      <button class="sec" data-action="suggestDD">⚡ Auto-suggest</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:4px 0 8px">Auto-suggest starts on the first payday ${esc(String((config.paycheck || {}).ddClearDays ?? 21))} days after opening and ends by the requirement deadline, using only what's left of each paycheck. The earliest deadline gets first claim. If <b># Deposits</b> is set, it splits the DD total evenly (e.g. 12 × $10). Deposits you add by hand stay put.</div>
    <div class="row" style="margin-top:8px">
      <input type="date" id="d_new_dd_date">
      <div class="money-field" style="flex:1;min-width:120px"><span class="money-prefix">$</span><input type="text" inputmode="decimal" id="d_new_dd_amount" placeholder="Amount" data-blur="reformatMoney"></div>
      <button data-action="addDD">Add</button>
    </div></div>`;

  // Actions
  html += `<div class="card">
    <div class="action-bar">
      <button data-action="saveAccountDetail">Save Changes</button>
      <button class="sec" data-action="closeAccountDetail">Close Account</button>
      <button class="sec" data-action="moveToOffers">Move to Offers</button>
      <button class="danger" data-action="deleteAccountDetail">Delete</button>
    </div>
  </div>`;

  section.innerHTML = html;
}

function backFromDetail(){
  captureFields();
  saveAccounts('Update account').catch(e => toast('Save error: ' + e.message));
  editingId = null;
  show(lastTab);
}

async function persistDetail(msg){
  try {
    await saveAccounts(msg);
    render_detail();
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

async function toggleTask(key){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.tasks[key] = !a.tasks[key];
  await persistDetail('Update task');
}

async function toggleReminderDetail(remId){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  const r = a && a.reminders.find(x => x.id === remId);
  if(!r) return;
  r.done = !r.done;
  await persistDetail('Toggle reminder');
}

async function deleteReminder(remId){
  if(!await confirmModal('Delete this reminder?', 'Delete', true)) return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.reminders = a.reminders.filter(x => x.id !== remId);
  await persistDetail('Delete reminder');
}

async function addReminder(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const date = $('#d_new_rem_date').value;
  const note = $('#d_new_rem_note').value.trim();
  if(!date || !note) { toast('Reminder needs a date and a note'); return; }
  a.reminders.push({ id: uid('r'), date, note, done: false });
  await persistDetail('Add reminder');
}

async function deleteDD(index){
  if(!await confirmModal('Remove this direct-deposit entry?', 'Remove', true)) return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.ddPlan.splice(index, 1);
  await persistDetail('Delete DD entry');
}

async function addDD(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  const payrollDate = $('#d_new_dd_date').value;
  const amount = parseMoney($('#d_new_dd_amount').value);
  if(!payrollDate || amount == null) { toast('DD entry needs a date and amount'); return; }
  a.ddPlan.push({ payrollDate, amount });
  a.ddPlan.sort((x, y) => x.payrollDate.localeCompare(y.payrollDate));
  await persistDetail('Add DD entry');
}

async function suggestDD(){
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  if(!(a.directDepositTotal > 0)){ toast('No DD requirement to schedule'); return; }
  if(!ddWindow(a)){ toast('Add the opened or planned-open date first'); return; }
  if(a.status !== 'planned' && a.status !== 'open'){ toast('Only planned or open accounts get a DD plan'); return; }
  if(a.dates.bonusPaidOut){ toast('Bonus already paid out, so no DD plan is needed'); return; }
  const before = new Map(accounts.map(x => [x, JSON.stringify(x.ddPlan || [])]));
  const {short} = planDeposits(a);
  const moved = accounts.filter(x => x !== a && before.get(x) !== JSON.stringify(x.ddPlan || []));
  const mine = short.find(x => x.account === a);
  let msg = mine ? `Short ${money(mine.amount)} of ${money(a.directDepositTotal)} by the deadline`
    : `Planned ${money(a.directDepositTotal)} over ${(a.ddPlan || []).length} payday(s)`;
  if(moved.length) msg += ` · also moved ${moved.map(x => x.institution).join(', ')}`;
  toast(msg);
  await persistDetail('Auto-suggest DD plan');
}

async function saveAccountDetail(){
  captureFields();
  try {
    await saveAccounts('Update account');
    toast('Saved');
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

async function closeAccountDetail(){
  const ok = await modal(`<p>Close this account? Status will be set to <strong>closed</strong>.</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="danger" data-mval="yes">Close Account</button></div>`);
  if(ok !== 'yes') return;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  a.status = 'closed';
  if(!a.dates.closed) a.dates.closed = todayISO();
  fillReopenAfter(a);
  try {
    await saveAccounts('Close account: ' + a.institution);
    toast('Account closed');
    editingId = null;
    show(lastTab);
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

// Status dropdown handler: intercept "move to offers" and reset on cancel.
function onStatusSelectChange(sel){
  if(sel.value !== 'move_offers') return;
  const a = accounts.find(x => x.id === editingId);
  const prev = a ? a.status : 'planned';
  moveToOffers().then(ok => {
    if(!ok && sel && sel.isConnected) sel.value = prev;
  });
}

// Move an account back to the Offers backlog (the reverse of "Promote").
async function moveToOffers(){
  if(!await confirmModal('Move this account back to the Offers backlog? Its open/close dates, reminders, and DD plan will be cleared.', 'Move to Offers')) return false;
  captureFields();
  const a = accounts.find(x => x.id === editingId);
  if(!a) return;
  offers.push({
    id: uid('o'), institution: a.institution, person: a.person, bonus: a.bonus,
    referralValue: a.referralValue, directDepositTotal: a.directDepositTotal,
    requiresMultipleDeposits: a.requiresMultipleDeposits, nbDeposits: a.nbDeposits,
    minBalance: a.minBalance, minBalDays: a.minBalDays, additionalRequirements: a.additionalRequirements,
    daysToCompleteReq: a.daysToCompleteReq, bonusTiming: a.bonusTiming, avoidFees: a.avoidFees,
    ...(a.fee ? {fee: JSON.parse(JSON.stringify(a.fee))} : {}), keepOpenDays: a.keepOpenDays ?? null,
    churnable: a.churnable, monthsTillReopen: a.monthsTillReopen, notes: a.notes, status: 'backlog'
  });
  accounts = accounts.filter(x => x.id !== editingId);
  try {
    await saveBatch(['db/offers.json', 'db/accounts.json'], 'Move account to offers: ' + a.institution);
    afterAccountsSaved();
    toast(a.institution + ' moved to Offers');
    editingId = null;
    show('offers');
    return true;
  } catch(e) {
    reportSaveError(e);
    return false;
  }
}

async function deleteAccountDetail(){
  const ok = await modal(`<p>Permanently delete this account? This cannot be undone.</p>
    <div class="row"><button class="sec" data-mcancel>Cancel</button><button class="danger" data-mval="yes">Delete</button></div>`);
  if(ok !== 'yes') return;
  accounts = accounts.filter(x => x.id !== editingId);
  try {
    await saveAccounts('Delete account');
    toast('Account deleted');
    editingId = null;
    show(lastTab);
  } catch(e) {
    toast('Save error: ' + e.message);
  }
}

/* ---------- Click dispatch: why there are no inline handlers here ----------
   Every control's behaviour is bound here rather than in an on* attribute.

   A browser HTML-decodes an event-handler attribute BEFORE parsing its
   contents as JavaScript, so escaping a value on its way into one cannot make
   it safe: turn ' into &#39; and the decode turns it back into a quote, and a
   person name or account id that closes the quote and adds a comma expression
   runs on click. All five apps are served from one origin and share one
   localStorage, so a value that reaches script here also hands over grocery's
   and pool's GitHub tokens.

   In a data-* attribute esc() genuinely does close the hole, because the value
   stays data and is never parsed as code. Action names resolve through the
   fixed table below rather than off `window`, so even a data-action carrying a
   hostile name can only reach something listed here.

   Every action is called as (el, a1, a2). Taking the element as the first
   argument is what replaces `this`, and it keeps one shape for all of them. */
const ACTIONS = {
  // Values arrive as text, so anything numeric is coerced. calNav matters
  // most: shiftMonth does `m += delta`, and "7" + "1" is "71", not 8.
  calNav: (el, delta) => calNav(Number(delta)),
  deleteDD: (el, i) => deleteDD(Number(i)),
  removePaycheckAmount: (el, i) => removePaycheckAmount(Number(i)),

  // Read off the element, where the attribute used to say `this`.
  reformatMoney: (el) => reformatMoney(el),
  importData: (el) => importData(el),
  saveMe: (el) => saveMe(el.value),
  onStatusSelectChange: (el) => onStatusSelectChange(el),
  setSearchFilter: (el, tab) => setSearchFilter(tab, el.value),
  quickUpdateDate: (el, id, field) => quickUpdateDate(id, field, el.value),

  // Were multi-statement or expression handlers; now each has a name.
  openImportPicker: () => document.getElementById('importFile').click(),

  show: (el, tab) => show(tab),
  editAccount: (el, id) => editAccount(id),
  addAccount: (el, status) => addAccount(status),
  openPlanned: (el, id) => openPlanned(id),
  promoteOffer: (el, id, status) => promoteOffer(id, status),
  deleteOffer: (el, id) => deleteOffer(id),
  markOfferVerified: (el, id) => markOfferVerified(el, id),
  markReminderDone: (el, accountId, id) => markReminderDone(el, accountId, id),
  dismissReopen: (el, id) => dismissReopen(el, id),
  setPersonFilter: (el, tab, person) => setPersonFilter(tab, person),
  setStatusFilter: (el, status) => setStatusFilter(status),
  setReportPerson: (el, person) => setReportPerson(person),
  removePerson: (el, person) => removePerson(person),
  calDay: (el, iso) => calDay(iso),
  toggleTask: (el, key) => toggleTask(key),
  toggleReminderDetail: (el, id) => toggleReminderDetail(id),
  deleteReminder: (el, id) => deleteReminder(id),

  addOffer: () => addOffer(),
  addPerson: () => addPerson(),
  addReminder: () => addReminder(),
  addDD: () => addDD(),
  addPaycheckAmount: () => addPaycheckAmount(),
  suggestDD: () => suggestDD(),
  saveAccountDetail: () => saveAccountDetail(),
  closeAccountDetail: () => closeAccountDetail(),
  deleteAccountDetail: () => deleteAccountDetail(),
  moveToOffers: () => moveToOffers(),
  saveSettings: () => saveSettings(),
  savePaycheckSettings: () => savePaycheckSettings(),
  saveRankingSettings: () => saveRankingSettings(),
  testNotification: () => testNotification(),
  enableNotifications: () => enableNotifications(),
  exportData: () => exportData(),
  disconnectGitHub: () => disconnectGitHub(),
  toggleTheme: () => toggleTheme(),
  showShortcuts: () => showShortcuts(),
  showCalTotalDD: () => showCalTotalDD(),
  showOverAllocated: () => showOverAllocated(),
  calJumpUpcoming: () => calJumpUpcoming(),
  calToday: () => calToday(),
  backToCalendar: () => backToCalendar(),
  backFromDetail: () => backFromDetail(),
};

// One listener per event type the markup uses. `data-stop` and `data-prevent`
// carry what the old compound handlers did before their call.
function dispatch(attr, e) {
  // closest(), not e.target: several controls wrap an icon or a <span>, so the
  // event lands on a child and a target-only check would silently do nothing.
  const el = e.target.closest('[' + attr + '], [data-stop], [data-prevent]');
  if (!el) return;
  if (el.hasAttribute('data-stop')) e.stopPropagation();
  if (el.hasAttribute('data-prevent')) e.preventDefault();
  const name = el.getAttribute(attr);
  if (!name) return;
  const fn = ACTIONS[name];
  if (typeof fn !== 'function') return;
  const r = fn(el, el.getAttribute('data-a1'), el.getAttribute('data-a2'));
  if(r && typeof r.catch === 'function') r.catch(reportSaveError);
}

document.addEventListener('click', (e) => dispatch('data-action', e));
document.addEventListener('change', (e) => dispatch('data-change', e));
document.addEventListener('input', (e) => dispatch('data-input', e));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  dispatch('data-enter', e);
});
// blur does not bubble; its capturing phase does.
document.addEventListener('blur', (e) => dispatch('data-blur', e), true);
</script>
