name: Daily Bank Bonus Report

# Runs automatically every day at 11:00 UTC, or manually via "Run workflow"
# (or the in-app "Send test email" button, which triggers this with test=true).
on:
  schedule:
    # Cron: run at 11:00 UTC daily
    # Format: minute hour day month weekday
    # This runs at 11:00 UTC, which is 6:00 AM EST or 7:00 AM EDT
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test/confirmation email even if nothing is due today'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read account data and send email (if needed)
        id: check_actions
        env:
          # The in-app "Send test" button dispatches this workflow with test=true.
          TEST_FLAG: ${{ github.event.inputs.test }}
          # Fallback recipient if the app config has no notify email set.
          MAIL_TO_SECRET: ${{ secrets.MAIL_TO }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const os = require('os');

          const isTest = String(process.env.TEST_FLAG || '').toLowerCase() === 'true';

          // Read config and accounts
          let config = {};
          let accounts = [];
          try {
            config = JSON.parse(fs.readFileSync('db/config.json', 'utf8'));
            accounts = JSON.parse(fs.readFileSync('db/accounts.json', 'utf8'));
          } catch (e) {
            console.log('Error reading data files:', e.message);
            process.exit(1);
          }

          // Helper: set a step output via the modern $GITHUB_OUTPUT file
          // (the old ::set-output command was disabled by GitHub in 2023).
          function setOutput(name, value) {
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
            }
          }

          // Resolve the recipient: the email saved in the app (db/config.json ->
          // notify[0].email) wins; otherwise fall back to the MAIL_TO secret.
          const notify = Array.isArray(config.notify) ? config.notify : [];
          const recipient = (notify[0] && notify[0].email) || process.env.MAIL_TO_SECRET || '';
          setOutput('mail_to', recipient);
          if (!recipient) {
            console.log('No recipient: set an email in the app (Settings) or a MAIL_TO secret.');
            setOutput('send_email', 'false');
            process.exit(0);
          }

          // Compute today's date in the user's configured timezone (so the
          // day boundary matches the app, not the UTC runner).
          const tz = (config && config.timezone) || 'America/New_York';
          const fmt = d => new Intl.DateTimeFormat('en-CA', {timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
          const todayISO = fmt(new Date());

          // Yesterday (for DD clearance), anchored at noon UTC to dodge DST edges
          const y = new Date(todayISO + 'T12:00:00Z');
          y.setUTCDate(y.getUTCDate() - 1);
          const yesterdayISO = y.toISOString().split('T')[0];

          console.log(`Computing actions for ${todayISO}...`);

          let actions = [];

          // Scan accounts
          accounts.forEach(account => {
            // Accounts to open (planned with a planned-open date of today, or reopen today)
            if (
              (account.status === 'planned' && account.dates.plannedOpen === todayISO) ||
              (account.dates.reopenAfter === todayISO)
            ) {
              actions.push({
                type: 'open',
                institution: account.institution,
                person: account.person,
                bonus: account.bonus,
                directDepositTotal: account.directDepositTotal
              });
            }

            // Accounts to close
            if (account.dates.closed === todayISO) {
              actions.push({
                type: 'close',
                institution: account.institution,
                person: account.person,
                bonus: account.bonus
              });
            }

            // Reminders due today (not already done)
            if (account.reminders && Array.isArray(account.reminders)) {
              account.reminders.forEach(reminder => {
                if (reminder.date === todayISO && !reminder.done) {
                  actions.push({
                    type: 'reminder',
                    institution: account.institution,
                    person: account.person,
                    note: reminder.note
                  });
                }
              });
            }

            // First DD cleared yesterday
            if (account.dates.firstDD === yesterdayISO && account.status === 'open') {
              actions.push({
                type: 'dd-cleared',
                institution: account.institution,
                person: account.person,
                directDepositTotal: account.directDepositTotal
              });
            }
          });

          console.log(`Found ${actions.length} actions for ${todayISO}`);

          // If there's nothing due and this isn't a test run, skip the email
          // (no "nothing today" spam). A test run always sends a confirmation.
          if (actions.length === 0 && !isTest) {
            console.log('No actions for today. Skipping email.');
            setOutput('send_email', 'false');
            process.exit(0);
          }

          // Build email HTML
          let html = `<p><strong>Bank Bonus Report</strong> — ${todayISO}</p>`;

          if (isTest) {
            html = `<p>✅ <strong>Your daily email is set up correctly.</strong> This is a test message.</p>` +
                   (actions.length === 0
                      ? `<p>Nothing is due today, so a normal day would send no email. On days with something to do you'll get a report like the one below.</p>`
                      : `<p>Here's what's actually due today:</p>`) +
                   html;
          }

          const opens = actions.filter(a => a.type === 'open');
          if (opens.length > 0) {
            html += '<h3>Accounts to Open</h3><ul>';
            opens.forEach(a => {
              html += `<li><strong>${a.institution}</strong> (${a.person}) — $${a.bonus} bonus, $${a.directDepositTotal} DD</li>`;
            });
            html += '</ul>';
          }

          const closes = actions.filter(a => a.type === 'close');
          if (closes.length > 0) {
            html += '<h3>Accounts to Close</h3><ul>';
            closes.forEach(a => {
              html += `<li><strong>${a.institution}</strong> (${a.person})</li>`;
            });
            html += '</ul>';
          }

          const reminders = actions.filter(a => a.type === 'reminder');
          if (reminders.length > 0) {
            html += '<h3>Reminders</h3><ul>';
            reminders.forEach(r => {
              html += `<li><strong>${r.institution}</strong> (${r.person}): ${r.note}</li>`;
            });
            html += '</ul>';
          }

          const ddCleared = actions.filter(a => a.type === 'dd-cleared');
          if (ddCleared.length > 0) {
            html += '<h3>First DD Cleared</h3><ul>';
            ddCleared.forEach(d => {
              html += `<li><strong>${d.institution}</strong> (${d.person})</li>`;
            });
            html += '</ul>';
          }

          // Write to temp file
          fs.writeFileSync('/tmp/email_body.html', html);
          setOutput('send_email', 'true');
          console.log('Email body prepared.');
          SCRIPT

      - name: Send email via Gmail
        if: steps.check_actions.outputs.send_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ github.event.inputs.test == 'true' && 'Bank Bonus — test email ✅' || 'Daily Bank Bonus Report' }}
          to: ${{ steps.check_actions.outputs.mail_to }}
          html_body: file:///tmp/email_body.html
          from: ${{ secrets.MAIL_USERNAME }}
