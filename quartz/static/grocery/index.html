<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F2E9" />
<!-- Apply the saved theme BEFORE first paint so there is no light/dark flash.
     Plain script (no on* handler) — reads localStorage only. System preference is
     the default (no attribute); a manual toggle stamps data-theme on <html>. -->
<script>(function(){try{var t=localStorage.getItem('gt_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Grocery Tracker</title>
<!-- PWA (S2): installable, standalone, iOS home-screen. No maximum-scale /
     user-scalable in the viewport above — pinch-zoom stays available; double-tap
     zoom is killed via touch-action below (FR-18). -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Grocery Tracker" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- Icon sprite (S3 "Grocer's Ledger" line glyphs, from the signed-off mockup).
     Inline symbols referenced by <use href="#id">; stroke uses currentColor so an
     active nav tab (color:var(--pine)) tints its own icon. Zero emoji as icons (§9). -->
<svg width="0" height="0" class="hidden-sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="ic-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18l-1.6 10.2a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8L3 8Z"/><path d="M3 8l2.5-4.5M21 8l-2.5-4.5M8.5 12v4M12 12v4M15.5 12v4"/></symbol>
  <symbol id="ic-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6M6 10v9h12v-9"/></symbol>
  <symbol id="ic-capture" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4V8Z"/><circle cx="12" cy="13" r="3.2"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="ic-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-7"/></symbol>
  <symbol id="ic-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="15" rx="1.5"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M8.5 12.5l2.2 2.2L15.5 10"/></symbol>
  <symbol id="ic-table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M4 14.5h16M12 5v14"/></symbol>
  <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7l1.9 1.1M17.9 15.9l1.9 1.1M4.2 17l1.9-1.1M17.9 8.1l1.9-1.1"/></symbol>
</defs></svg>

<header>
  <div><h1><svg class="mk-ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-cart"></use></svg>Grocery Tracker</h1><div class="who" id="whoami"></div></div>
  <button class="link hd-settings" data-action="show" data-arg="settings"><svg class="hd-ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-settings"></use></svg>Settings</button>
</header>

<main id="main"></main>

<nav id="nav">
  <button data-tab="today" data-action="show" data-arg="today"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-today"></use></svg></span>Today</button>
  <button data-tab="capture" data-action="show" data-arg="capture"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-capture"></use></svg></span>Capture</button>
  <button data-tab="search" data-action="show" data-arg="search"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-search"></use></svg></span>Search</button>
  <button data-tab="reports" data-action="show" data-arg="reports"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-reports"></use></svg></span>Reports</button>
  <button data-tab="review" data-action="show" data-arg="review"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-review"></use></svg></span>Review<span id="reviewBadge" class="badge hidden">0</span></button>
  <button data-tab="table" data-action="show" data-arg="table"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-table"></use></svg></span>Table</button>
  <button data-tab="settings" data-action="show" data-arg="settings"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-settings"></use></svg></span>Settings</button>
</nav>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
