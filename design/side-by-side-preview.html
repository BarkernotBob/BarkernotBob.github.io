<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview — Desktop + Phone</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1d1b26; color: #eee; min-height: 100vh; }
  .bar { padding: 10px 16px; font-size: 13px; background: #111019; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .bar b { color: #fff; }
  .bar a { color: #6aa0ff; text-decoration: none; }
  .bar button { background: #2a2740; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .views { display: flex; gap: 22px; padding: 20px; align-items: flex-start; overflow: auto; }
  .label { font-size: 12px; color: #aaa; margin: 0 0 6px 2px; letter-spacing: .5px; text-transform: uppercase; }
  .frame { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 26px rgba(0,0,0,.45); }
  /* Desktop view: render at 1280px, scaled down to fit */
  .desktop { width: 832px; height: 520px; }
  .desktop iframe { width: 1280px; height: 800px; border: 0; transform: scale(0.65); transform-origin: top left; }
  /* Phone view: real phone width */
  .phone { width: 390px; height: 780px; }
  .phone iframe { width: 390px; height: 780px; border: 0; }
</style>
</head>
<body>
  <div class="bar">
    <b>Live preview</b> — desktop &amp; phone side by side, from <b>localhost:8080</b>.
    <button onclick="document.querySelectorAll('iframe').forEach(f=>f.src=f.src)">↻ Refresh both</button>
    <a href="http://localhost:8080/" target="_blank">Open full size ↗</a>
    <span style="color:#888">(Make sure “Preview Website” is running.)</span>
  </div>
  <div class="views">
    <div><div class="label">Desktop</div><div class="frame desktop"><iframe src="http://localhost:8080/"></iframe></div></div>
    <div><div class="label">Phone</div><div class="frame phone"><iframe src="http://localhost:8080/"></iframe></div></div>
  </div>
</body>
</html>
