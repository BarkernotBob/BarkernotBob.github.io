name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Patch plugins (substring search + slide-over file-tree at all widths)
        run: |
          sed -i 's/tokenize:"forward"/tokenize:"full"/g' \
            .quartz/plugins/search/dist/index.js \
            .quartz/plugins/search/dist/components/index.js
          sed -i 's/max-width: *800px/max-width: 99999px/g' \
            .quartz/plugins/explorer/dist/index.js \
            .quartz/plugins/explorer/dist/components/index.js
      - name: Build
        run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
